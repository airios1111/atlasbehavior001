# Generated by scripts/gen_behavior_pack.py (behavior pack). Safe to edit by hand.
id: BHV-LM-001
name: Agent presents its delegated token to an MCP server outside its baseline
status: test
severity: high
confidence: medium
description: >-
  An agent calls an MCP server for the first time (server_first_seen_for_agent, computed by the gateway) using its
  delegated OAuth token, and the server is not in the agent's manifest. The agent's identity is being used to reach
  systems it was never set up for.
atlas:
  tactics: [AML.TA0015]
  techniques:
  - {id: AML.T0091.000, relationship: primary}
telemetry:
  required:
  - source: mcp_gateway
    fields:
    - timestamp
    - session_id
    - agent_id
    - server_id
    - auth_type
    - server_first_seen_for_agent
    - server_in_agent_manifest
detection:
  logic: field_match
  match:
    auth_type: delegated_token
    server_first_seen_for_agent: true
    server_in_agent_manifest: false
  false_positives: [Manifest updates lagging a legitimate rollout]
countermeasures:
  mitigations: [AML.M0028, AML.M0032]
  response:
  - action: deny_tool_call
    params: {session: '{{session_id}}'}
  - action: revoke_token
    params: {principal: 'agent:{{agent_id}}'}
  - action: open_incident
    params: {queue: ai-sec, priority: P2}
tests:
- {fixture: tests/fixtures/pack/lm001_attack.jsonl, expect: alert}
- {fixture: tests/fixtures/pack/lm001_benign.jsonl, expect: no_alert}
references: ['https://atlas.mitre.org/techniques/AML.T0091']
