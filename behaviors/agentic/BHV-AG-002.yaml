id: BHV-AG-002
name: Agent runs download-and-execute or encoded shell command
status: test
severity: critical
confidence: high
description: >-
  Agent shell or code-interpreter call pipes a download straight into a shell, decodes base64 into sh, or runs encoded
  PowerShell.
atlas:
  tactics: [AML.TA0005]
  techniques:
  - {id: AML.T0050, relationship: primary}
telemetry:
  required:
  - source: agent_runtime
    fields: [timestamp, session_id, agent_id, tool_name, tool_args]
detection:
  logic: signature
  filters:
    tool_name:
      in: [shell.exec, code_interpreter.run, terminal.run]
  signatures:
  - field: tool_args
    patterns:
    - (?i)\b(curl|wget)\b[^|;]{0,200}\|\s*(ba|z)?sh\b
    - (?i)\bbase64\s+(-d|--decode)\b[^|]{0,80}\|\s*(ba|z)?sh\b
    - (?i)\bchmod\s+\+x\b.{0,80}&&\s*\./
    - (?i)\bpowershell(\.exe)?\s+.{0,40}-(enc|encodedcommand)\b
countermeasures:
  mitigations: [AML.M0029, AML.M0032, AML.M0026]
  response:
  - action: deny_tool_call
    params: {session: '{{session_id}}'}
  - action: kill_session
    params: {session: '{{session_id}}'}
  - action: open_incident
    params: {queue: ai-sec, priority: P2}
