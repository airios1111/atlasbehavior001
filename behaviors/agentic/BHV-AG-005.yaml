id: BHV-AG-005
name: Agent reads credential files
status: test
severity: high
confidence: high
description: >-
  Agent file or shell tools access well-known credential stores: cloud CLI credentials, kubeconfig, .env files,
  SSH private keys, package-registry tokens.
atlas:
  tactics: [AML.TA0013]
  techniques:
  - {id: AML.T0098, relationship: primary}
  - {id: AML.T0083, relationship: secondary}
telemetry:
  required:
  - source: agent_runtime
    fields: [timestamp, session_id, agent_id, tool_name, tool_args]
detection:
  logic: signature
  filters:
    tool_name:
      in: [fs.read, shell.exec, code_interpreter.run, terminal.run]
  signatures:
  - field: tool_args
    patterns:
    - (?i)(\.aws/credentials|\.azure/accessTokens\.json|\.config/gcloud/|\.kube/config|\.docker/config\.json|\.git-credentials|\.npmrc|\.pypirc)
    - (?i)(^|[\s/\"'])\.env(\.[a-z]+)?($|[\s\"'])
    - (?i)\bid_(rsa|ed25519|ecdsa)\b
countermeasures:
  mitigations: [AML.M0026, AML.M0028]
  response:
  - action: deny_tool_call
    params: {session: '{{session_id}}'}
  - action: kill_session
    params: {session: '{{session_id}}'}
  - action: rotate_credentials
    params: {scope: agent-host}
  - action: open_incident
    params: {queue: ai-sec, priority: P2}
tests:
- {fixture: tests/fixtures/pack/ag005_attack.jsonl, expect: alert}
- {fixture: tests/fixtures/pack/ag005_benign.jsonl, expect: no_alert}
