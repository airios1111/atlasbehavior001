# Generated by scripts/gen_behavior_pack.py (behavior pack). Safe to edit by hand.
id: BHV-AG-018
name: Untrusted retrieved or tool-output content reaches a privileged tool call
status: test
severity: high
confidence: medium
description: >-
  Content from an untrusted retrieval source or tool result (public web page, inbound email, external upload) reaches
  a privileged tool call (payments, identity, permissions, configuration, code execution) within 3 hops of the agent's
  span graph: indirect prompt injection turned into action. Computed per trace along parent_span_id and input_span_ids.
  Needs input_origin, source_trust and tool_class from the runtime or gateway (docs/agent-telemetry.md). BHV-AG-008
  is the single-event form for runtimes that can only flag 'untrusted content in context'.
atlas:
  tactics: [AML.TA0005, AML.TA0012]
  techniques:
  - {id: AML.T0053, relationship: primary}
  - {id: AML.T0051.001, relationship: secondary}
telemetry:
  required:
  - source: agent_runtime
    fields:
    - timestamp
    - trace_id
    - span_id
    - parent_span_id
    - input_span_ids
    - session_id
    - agent_id
    - operation
    - tool_name
    - tool_class
    - input_origin
    - source_trust
  - source: mcp_gateway
    fields:
    - timestamp
    - trace_id
    - span_id
    - parent_span_id
    - session_id
    - agent_id
    - server_id
    - mcp_method
    - tool_name
    - tool_class
detection:
  logic: provenance
  provenance:
    source:
      input_origin:
        in: [retrieval, tool_output]
      source_trust: untrusted
    sink: {tool_class: privileged}
    max_hops: 3
  false_positives:
  - Agents built to act on external documents where the human approval happens outside the traced run
countermeasures:
  mitigations: [AML.M0030, AML.M0029, AML.M0026]
  response:
  - action: deny_tool_call
    params: {session: '{{session_id}}', tool: '{{tool_name}}'}
  - action: kill_session
    params: {session: '{{session_id}}'}
  - action: open_incident
    params: {queue: ai-sec, priority: P1}
tests:
- {fixture: tests/fixtures/pack/ag018_attack.jsonl, expect: alert}
- {fixture: tests/fixtures/pack/ag018_benign.jsonl, expect: no_alert}
references: ['https://atlas.mitre.org/techniques/AML.T0053']
