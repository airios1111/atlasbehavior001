id: BHV-CA-001
name: Secrets pasted into an LLM prompt
status: test
severity: high
confidence: medium
description: >-
  A prompt contains live credential material: cloud access keys, GitHub or Slack tokens, API secret keys, private
  keys or connection-string passwords. The secret now sits in gateway and provider logs, outside the vault that
  should hold it.
atlas:
  tactics: [AML.TA0013]
  techniques:
  - {id: AML.T0055, relationship: primary}
attack_bridge: [T1552]
telemetry:
  required:
  - source: llm_gateway
    fields: [timestamp, principal_id, session_id, model_id, prompt]
detection:
  logic: signature
  signatures:
  - field: prompt
    patterns:
    - \b(AKIA|ASIA)[0-9A-Z]{16}\b
    - \bgh[pousr]_[A-Za-z0-9]{36}\b
    - \bxox[abposr]-[A-Za-z0-9-]{10,}
    - '-----BEGIN ([A-Z]+ )?PRIVATE KEY-----'
    - \bsk-(proj-)?[A-Za-z0-9_-]{32,}\b
    - \bAIza[0-9A-Za-z_-]{35}\b
    - (?i)\b(AccountKey|SharedAccessKey|Password|Pwd)=[^;\s<>]{8,}
  false_positives: [Documentation example keys such as AKIAIOSFODNN7EXAMPLE]
countermeasures:
  mitigations: [AML.M0020, AML.M0018]
  response:
  - action: block_request
    params: {session: '{{session_id}}'}
  - action: rotate_credentials
    params: {scope: exposed-in-prompt}
  - action: notify
    params: {channel: secops}
