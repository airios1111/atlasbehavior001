# Generated by scripts/gen_behavior_pack.py (behavior pack). Safe to edit by hand.
id: BHV-CA-002
name: Credentials returned in agent tool output
status: test
severity: high
confidence: medium
description: >-
  A tool result flowing back into an agent's context contains credential material or secret-looking environment
  variables. The agent, and anyone who can steer it, can now read and reuse the secret.
atlas:
  tactics: [AML.TA0013]
  techniques:
  - {id: AML.T0098, relationship: primary}
  - {id: AML.T0055, relationship: secondary}
telemetry:
  required:
  - source: agent_runtime
    fields: [timestamp, session_id, agent_id, tool_name, tool_output]
detection:
  logic: signature
  signatures:
  - field: tool_output
    patterns:
    - \b(AKIA|ASIA)[0-9A-Z]{16}\b
    - \bgh[pousr]_[A-Za-z0-9]{36}\b
    - \bxox[abposr]-[A-Za-z0-9-]{10,}
    - '-----BEGIN ([A-Z]+ )?PRIVATE KEY-----'
    - \bsk-(proj-)?[A-Za-z0-9_-]{32,}\b
    - \bAIza[0-9A-Za-z_-]{35}\b
    - (?i)\b(AccountKey|SharedAccessKey|Password|Pwd)=[^;\s<>]{8,}
    - (?i)\b[A-Z0-9_]*(SECRET|TOKEN|API_KEY|PASSWORD)[A-Z0-9_]*=[^\s]{8,}
  false_positives: [Tools that return masked or placeholder values longer than 8 characters]
countermeasures:
  mitigations: [AML.M0028, AML.M0033]
  response:
  - action: redact_output
    params: {session: '{{session_id}}'}
  - action: deny_tool_call
    params: {session: '{{session_id}}'}
  - action: kill_session
    params: {session: '{{session_id}}'}
  - action: rotate_credentials
    params: {scope: agent-tool-output}
  - action: open_incident
    params: {queue: ai-sec, priority: P2}
tests:
- {fixture: tests/fixtures/pack/ca002_attack.jsonl, expect: alert}
- {fixture: tests/fixtures/pack/ca002_benign.jsonl, expect: no_alert}
references: ['https://atlas.mitre.org/techniques/AML.T0098']
