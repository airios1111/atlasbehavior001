detection:
  logic: signature
  filters:
    tool_name:
      in:
      - web.fetch
      - http.request
      - http.get
      - browser.open
      - shell.exec
      - code_interpreter.run
      - terminal.run
  signatures:
  - field: tool_args
    patterns:
    - 169\.254\.169\.254
    - 169\.254\.170\.2\b
    - (?i)\bmetadata\.google\.internal\b
    - (?i)\bfd00:ec2::254\b
    - 100\.100\.100\.200
  false_positives:
  - Infrastructure agents that read instance metadata by design (use SDK credentials instead)
countermeasures:
  mitigations: [AML.M0032, AML.M0028]
  response:
  - action: deny_tool_call
    params: {session: '{{session_id}}'}
  - action: kill_session
    params: {session: '{{session_id}}'}
  - action: rotate_credentials
    params: {scope: agent-host-role}
  - action: open_incident
    params: {queue: ai-sec, priority: P1}
