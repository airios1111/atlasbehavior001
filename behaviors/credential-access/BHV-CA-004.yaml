id: BHV-CA-004
name: Agent tool requests cloud instance-metadata credentials
status: test
severity: critical
confidence: high
description: >-
  An agent fetch or shell tool targets a cloud instance-metadata or container-credential endpoint (169.254.169.254,
  metadata.google.internal, fd00:ec2::254, 169.254.170.2). This is server-side request forgery through the agent
