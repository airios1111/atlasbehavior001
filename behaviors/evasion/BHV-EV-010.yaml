id: BHV-EV-010
name: Model deployed or loaded after the model scanner could not parse it
status: test
severity: critical
confidence: high
description: >-
  A model is deployed or loaded while its latest scan result is `error` or `unparseable` (latest_scan_status, from
  the registry). Attackers deliberately corrupt malicious model files so scanners fail, while the loader still runs
  the payload before it errors.
atlas:
  tactics: [AML.TA0007]
  techniques:
  - {id: AML.T0076, relationship: primary}
telemetry:
  required:
  - source: model_registry
    fields: [timestamp, artifact_id, principal_id, event_type, latest_scan_status]
detection:
  logic: field_match
  match:
    event_type:
      in: [model_deploy, model_load]
    latest_scan_status:
      in: [error, unparseable]
  false_positives: [Scanner outages; fix the scanner rather than suppress the alert]
countermeasures:
  mitigations: [AML.M0014, AML.M0011]
  response:
  - action: block_deploy
    params: {artifact: '{{artifact_id}}'}
  - action: quarantine_artifact
    params: {artifact: '{{artifact_id}}'}
  - action: open_incident
    params: {queue: ai-sec, priority: P1}
