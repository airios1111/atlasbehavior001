# Generated by scripts/gen_behavior_pack.py (behavior pack). Safe to edit by hand.
id: BHV-EV-008
name: Agent shell tool runs sandbox or virtualization checks
status: test
severity: medium
confidence: medium
description: >-
  An agent's shell or code tool runs commands that test whether it is inside a VM, container or analysis sandbox
  (systemd-detect-virt, /.dockerenv, /proc/1/cgroup, dmidecode product strings, WMI BIOS queries). Malicious payloads
  do this to stay dormant under inspection.
atlas:
  tactics: [AML.TA0007]
  techniques:
  - {id: AML.T0097, relationship: primary}
attack_bridge: [T1497]
telemetry:
  required:
  - source: agent_runtime
    fields: [timestamp, session_id, agent_id, tool_name, tool_args]
detection:
  logic: signature
  filters:
    tool_name:
      in: [shell.exec, code_interpreter.run, terminal.run]
  signatures:
  - field: tool_args
    patterns:
    - (?i)\bsystemd-detect-virt\b
    - (?i)(\b(ls|stat|test\s+-[ef])|\[\s+-[ef])\s+[^|;]{0,10}/\.dockerenv\b
    - (?i)/proc/(1|self)/cgroup\b
    - (?i)\bgrep\b[^|;]{0,20}\bhypervisor\b[^|;]{0,20}/proc/cpuinfo\b
    - (?i)\bdmidecode\b.{0,30}\b(system-product-name|system-manufacturer|bios-vendor)\b
    - (?i)\b(Win32_ComputerSystem|Win32_BIOS)\b.{0,60}\b(Model|Manufacturer|SerialNumber)\b
  false_positives: [Platform agents that legitimately inspect their runtime (scope by agent_id)]
countermeasures:
  mitigations: [AML.M0032, AML.M0028]
  response:
  - action: deny_tool_call
    params: {session: '{{session_id}}'}
  - action: kill_session
    params: {session: '{{session_id}}'}
  - action: notify
    params: {channel: soc}
tests:
- {fixture: tests/fixtures/pack/ev008_attack.jsonl, expect: alert}
- {fixture: tests/fixtures/pack/ev008_benign.jsonl, expect: no_alert}
references: ['https://atlas.mitre.org/techniques/AML.T0097']
