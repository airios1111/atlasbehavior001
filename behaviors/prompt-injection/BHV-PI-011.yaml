id: BHV-PI-011
name: Injection submitted through a public-facing form, review or ticket
status: test
severity: high
confidence: medium
description: >-
  Content from public channels (web forms, product reviews, support tickets) that later reaches an LLM contains
  override phrasing or orders addressed to the assistant.
atlas:
  tactics: [AML.TA0004, AML.TA0006]
  techniques:
  - {id: AML.T0093, relationship: primary}
  - {id: AML.T0051.001, relationship: secondary}
telemetry:
  required:
  - source: llm_gateway
    fields: [timestamp, principal_id, session_id, channel, user_content]
detection:
  logic: signature
  filters:
    channel:
      in: [web_form, product_review, support_ticket]
  signatures:
  - field: user_content
    patterns:
    - (?i)\b(ignore|disregard|override)\b.{0,30}\b(previous|prior|above|system|all)\b.{0,20}\b(instructions?|rules|prompt)\b
    - (?i)\b(ai|assistant|bot|model)\s*[:,]\s*(you\s+must|please)\s+(now\s+)?(approve|escalate|refund|mark|classify|rate)\b
countermeasures:
  mitigations: [AML.M0020, AML.M0015]
  response:
  - action: strip_content
    params: {session: '{{session_id}}'}
  - action: open_incident
    params: {queue: ai-sec, priority: P3}
tests:
- {fixture: tests/fixtures/pack/pi011_attack.jsonl, expect: alert}
- {fixture: tests/fixtures/pack/pi011_benign.jsonl, expect: no_alert}
