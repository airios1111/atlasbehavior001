# Generated by scripts/gen_behavior_pack.py (behavior pack). Safe to edit by hand.
id: BHV-PI-013
name: Injected instructions in agent tool output
status: test
severity: high
confidence: medium
description: >-
  Output returned by an agent tool (web fetch, search, file read) contains override phrasing, fake instruction tags,
  or orders for the agent to call another tool.
atlas:
  tactics: [AML.TA0005]
  techniques:
  - {id: AML.T0051.001, relationship: primary}
  - {id: AML.T0099, relationship: secondary}
telemetry:
  required:
  - source: agent_runtime
    fields: [timestamp, session_id, agent_id, tool_name, tool_output]
detection:
  logic: signature
  signatures:
  - field: tool_output
    patterns:
    - (?i)\b(ignore|disregard)\s+(all\s+|any\s+)?(previous|prior|above|earlier|user)\s+(instructions|requests?|directions)\b
    - (?i)<\s*(instructions?|system|important)\s*>
    - (?i)\b(ai|agent|assistant)\s+(must|should)\s+(now\s+)?(call|invoke|use|run)\s+(the\s+)?[a-z_.]+\s+tool\b
countermeasures:
  mitigations: [AML.M0030, AML.M0033]
  response:
  - action: deny_tool_call
    params: {session: '{{session_id}}'}
  - action: kill_session
    params: {session: '{{session_id}}'}
  - action: open_incident
    params: {queue: ai-sec, priority: P2}
tests:
- {fixture: tests/fixtures/pack/pi013_attack.jsonl, expect: alert}
- {fixture: tests/fixtures/pack/pi013_benign.jsonl, expect: no_alert}
references: ['https://atlas.mitre.org/techniques/AML.T0051']
