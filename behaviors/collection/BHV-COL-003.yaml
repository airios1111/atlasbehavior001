id: BHV-COL-003
name: Agent pulls bulk records from many connected tools in one session
status: test
severity: high
confidence: medium
description: >-
  In 10 minutes an agent session calls at least 4 distinct data-read tools (mail, CRM, drive, calendar) and they
  return at least 5,000 records in total. One task rarely needs everything the agent can reach.
atlas:
  tactics: [AML.TA0009]
  techniques:
  - {id: AML.T0085.001, relationship: primary}
telemetry:
  required:
  - source: agent_runtime
    fields: [timestamp, session_id, agent_id, tool_name, tool_category, records_returned]
detection:
  logic: windowed_threshold
  window: 10m
  group_by: [session_id, agent_id]
  filters: {tool_category: data_read}
  metrics: {distinct_tools: dcount(tool_name), records: sum(records_returned)}
  conditions: [distinct_tools >= 4, records >= 5000]
  false_positives: [Scheduled reporting agents (scope by agent_id)]
countermeasures:
  mitigations: [AML.M0028, AML.M0030]
  response:
  - action: kill_session
    params: {session: '{{session_id}}'}
  - action: open_incident
    params: {queue: ai-sec, priority: P2}
tests:
- {fixture: tests/fixtures/pack/col003_attack.jsonl, expect: alert}
- {fixture: tests/fixtures/pack/col003_benign.jsonl, expect: no_alert}
