id: BHV-DOS-003
name: Unbounded repetition / output-expansion prompt
status: test
severity: medium
confidence: medium
description: >-
  Prompt asks the model to repeat a word or string forever, or to write something thousands of times, which ties
  up decoding capacity (and can leak training data).
atlas:
  tactics: [AML.TA0011]
  techniques:
  - {id: AML.T0029, relationship: primary}
  - {id: AML.T0034.001, relationship: secondary}
  - {id: AML.T0040, relationship: precondition}
telemetry:
  required:
  - source: llm_gateway
    fields: [timestamp, principal_id, session_id, prompt]
detection:
  logic: signature
  signatures:
  - field: prompt
    patterns:
    - (?i)\b(repeat|say|print|output)\s+(the\s+)?(word|phrase|letter|string|this)\b.{0,40}\b(forever|infinitely|endlessly|non-?stop|\d{4,}\s+times)\b
    - (?i)\bwrite\b.{0,30}\b\d{5,}\s+times\b
countermeasures:
  mitigations: [AML.M0004, AML.M0020]
  response:
  - action: cap_tokens
    params: {session: '{{session_id}}', max_output: 512}
  - action: block_request
    params: {session: '{{session_id}}'}
