# Generated by scripts/gen_behavior_pack.py (behavior pack). Safe to edit by hand.
id: BHV-RD-003
name: Newly published agent tool with a name resembling an approved tool
status: experimental
severity: high
confidence: low
description: >-
  An MCP server or agent tool being registered was published less than 14 days ago and its name is at least 85%
  similar to an approved tool (name_similarity_to_approved from the gateway). Typosquatted tools are how poisoned
  agent tools get published. Experimental until the similarity threshold is calibrated.
atlas:
  tactics: [AML.TA0003]
  techniques:
  - {id: AML.T0104, relationship: primary}
  - {id: AML.T0010.005, relationship: secondary}
telemetry:
  required:
  - source: mcp_gateway
    fields:
    - timestamp
    - server_id
    - tool_name
    - event_type
    - package_age_days
    - name_similarity_to_approved
detection:
  logic: field_match
  match:
    event_type: tool_registered
    package_age_days: {lt: 14}
    name_similarity_to_approved: {gte: 0.85}
  false_positives: [New major versions or official forks of an approved tool]
countermeasures:
  mitigations: [AML.M0028, AML.M0023, AML.M0014]
  response:
  - action: disable_tool
    params: {tool: '{{tool_name}}', server: '{{server_id}}'}
  - action: notify
    params: {channel: platform-sec}
tests:
- {fixture: tests/fixtures/pack/rd003_attack.jsonl, expect: alert}
- {fixture: tests/fixtures/pack/rd003_benign.jsonl, expect: no_alert}
references: ['https://atlas.mitre.org/techniques/AML.T0104']
