id: BHV-C2-001
name: Agent beacons to an external host at fixed intervals
status: test
severity: high
confidence: medium
description: >-
  An agent calls the same non-allowlisted destination at least 10 times in an hour at near-constant spacing: inter-arrival
  variance under 4 s² and a mean gap of at least 30 s. inter_arrival_s is the normalizer's seconds since that agent's
  previous call to that destination. A compromised agent is polling for tasking.
atlas:
  tactics: [AML.TA0014]
  techniques:
  - {id: AML.T0108, relationship: primary}
attack_bridge: [T1071.001]
telemetry:
  required:
  - source: agent_runtime
    fields:
    - timestamp
    - agent_id
    - tool_name
    - destination_domain
    - destination_allowlisted
    - inter_arrival_s
detection:
  logic: windowed_threshold
  window: 1h
  group_by: [agent_id, destination_domain]
  filters:
    destination_allowlisted: false
    tool_name:
      in: [web.fetch, http.request, http.get, browser.open]
  metrics:
    calls: count
    interval_variance: variance(inter_arrival_s)
    mean_interval: avg(inter_arrival_s)
  conditions: [calls >= 10, interval_variance < 4, mean_interval >= 30]
  false_positives:
  - Scheduled agents polling a feed that is not yet allowlisted
  - Jittered beacons evade this; pair with destination reputation
countermeasures:
  mitigations: [AML.M0032, AML.M0028]
  response:
  - action: open_incident
    params: {queue: ai-sec, priority: P1}
  - action: notify
    params: {channel: agent-platform}
