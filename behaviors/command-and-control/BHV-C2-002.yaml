id: BHV-C2-002
name: AI service API polled on a fixed schedule by an unregistered host
status: test
severity: high
confidence: medium
description: >-
  A host not registered as an AI workload polls an AI service API at least 10 times an hour at near-constant spacing
  with small payloads. Malware has been seen using hosted assistant threads as a command channel.
atlas:
  tactics: [AML.TA0014]
  techniques:
  - {id: AML.T0096, relationship: primary}
attack_bridge: [T1102.002]
telemetry:
  required:
  - source: llm_gateway
    fields:
    - timestamp
    - client_host
    - api_key_id
    - api_operation
    - workload_registered
    - inter_arrival_s
    - total_tokens
detection:
  logic: windowed_threshold
  window: 1h
  group_by: [client_host, api_key_id]
  filters: {workload_registered: false}
  metrics:
    polls: count
    interval_variance: variance(inter_arrival_s)
    avg_tokens: avg(total_tokens)
  conditions: [polls >= 10, interval_variance < 4, avg_tokens < 300]
  false_positives: [Unregistered automation (cron jobs) that should be registered]
countermeasures:
  mitigations: [AML.M0019, AML.M0024]
  response:
  - action: open_incident
    params: {queue: ai-sec, priority: P1}
  - action: revoke_token
    params: {principal: 'apikey:{{api_key_id}}'}
tests:
- {fixture: tests/fixtures/pack/c2002_attack.jsonl, expect: alert}
- {fixture: tests/fixtures/pack/c2002_benign.jsonl, expect: no_alert}
