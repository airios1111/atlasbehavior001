# Generated by scripts/gen_behavior_pack.py (behavior pack). Safe to edit by hand.
id: BHV-C2-003
name: Agent fetches from a paste site, tunnel or callback host
status: test
severity: high
confidence: medium
description: >-
  An agent fetch or shell tool reaches a paste-site raw endpoint, a raw gist, a reverse-tunnel domain (ngrok, trycloudflare,
  loca.lt) or an out-of-band callback host (webhook.site, interact.sh, oast.*). These are common dead drops for
  agent tasking.
atlas:
  tactics: [AML.TA0014]
  techniques:
  - {id: AML.T0108, relationship: primary}
attack_bridge: [T1102.001, T1572]
telemetry:
  required:
  - source: agent_runtime
    fields: [timestamp, session_id, agent_id, tool_name, tool_args]
detection:
  logic: signature
  filters:
    tool_name:
      in:
      - web.fetch
      - http.request
      - http.get
      - browser.open
      - shell.exec
      - code_interpreter.run
      - terminal.run
  signatures:
  - field: tool_args
    patterns:
    - (?i)\b(pastebin\.com/raw|paste\.ee/r/|hastebin\.com/raw|rentry\.co/[^/\s]+/raw)
    - (?i)\bgist\.githubusercontent\.com/
    - (?i)\b[a-z0-9-]+\.(ngrok(-free)?\.(io|app|dev)|trycloudflare\.com|loca\.lt|serveo\.net)\b
    - (?i)\b(webhook\.site|requestbin\.(net|com)|pipedream\.net|interact\.sh|oast\.(fun|live|me|pro|site|online)|burpcollaborator\.net)\b
  false_positives: [Developers fetching setup scripts from raw gists]
countermeasures:
  mitigations: [AML.M0028, AML.M0032]
  response:
  - action: deny_tool_call
    params: {session: '{{session_id}}'}
  - action: kill_session
    params: {session: '{{session_id}}'}
  - action: open_incident
    params: {queue: ai-sec, priority: P2}
tests:
- {fixture: tests/fixtures/pack/c2003_attack.jsonl, expect: alert}
- {fixture: tests/fixtures/pack/c2003_benign.jsonl, expect: no_alert}
references: ['https://atlas.mitre.org/techniques/AML.T0108']
