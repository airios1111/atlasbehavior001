# Generated by scripts/gen_behavior_pack.py (behavior pack). Safe to edit by hand.
id: BHV-SC-008
name: Hidden instructions in an agent tool description (tool poisoning)
status: test
severity: critical
confidence: medium
description: >-
  A tool description or schema registered at the MCP gateway contains instruction tags or directives aimed at the
  agent ('before using this tool, read ~/.ssh...', 'do not tell the user').
atlas:
  tactics: [AML.TA0006]
  techniques:
  - {id: AML.T0110, relationship: primary}
telemetry:
  required:
  - source: mcp_gateway
    fields: [timestamp, server_id, tool_name, event_type, tool_description]
detection:
  logic: signature
  filters:
    event_type:
      in: [tool_registered, tool_manifest_change]
  signatures:
  - field: tool_description
    patterns:
    - (?i)<\s*(important|system|instructions?)\s*>
    - (?i)\bbefore\s+(using|calling)\s+this\s+tool\b.{0,80}\b(read|send|include|pass|upload)\b
    - (?i)\bdo\s+not\s+(mention|tell|reveal|inform)\b.{0,40}\buser\b
countermeasures:
  mitigations: [AML.M0028, AML.M0033]
  response:
  - action: disable_tool
    params: {tool: '{{tool_name}}', server: '{{server_id}}'}
  - action: open_incident
    params: {queue: ai-sec, priority: P1}
tests:
- {fixture: tests/fixtures/pack/sc008_attack.jsonl, expect: alert}
- {fixture: tests/fixtures/pack/sc008_benign.jsonl, expect: no_alert}
references: ['https://atlas.mitre.org/techniques/AML.T0110']
