# Generated by scripts/gen_behavior_pack.py (behavior pack). Safe to edit by hand.
id: BHV-SC-012
name: MCP tool name advertised by more than one server to the same agent
status: test
severity: high
confidence: medium
description: >-
  Two or more MCP servers advertise a tool with the same name to one agent within an hour. The agent cannot tell
  which implementation it will call, so a malicious server can intercept calls meant for a trusted one or steer
  them through its own tool description (tool shadowing). Needs the gateway to log one tool_advertised event per
  tool in each tools/list result.
atlas:
  tactics: [AML.TA0006]
  techniques:
  - {id: AML.T0110, relationship: primary}
  - {id: AML.T0010.005, relationship: secondary}
telemetry:
  required:
  - source: mcp_gateway
    fields: [timestamp, agent_id, server_id, tool_name, event_type]
detection:
  logic: windowed_threshold
  window: 1h
  group_by: [agent_id, tool_name]
  filters: {event_type: tool_advertised}
  metrics: {servers: dcount(server_id)}
  conditions: [servers >= 2]
  false_positives:
  - Two deployments of one server (for example prod and staging) attached to the same agent
countermeasures:
  mitigations: [AML.M0028, AML.M0014]
  response:
  - action: notify
    params: {channel: platform-sec}
  - action: open_incident
    params: {queue: ai-sec, priority: P2}
tests:
- {fixture: tests/fixtures/pack/sc012_attack.jsonl, expect: alert}
- {fixture: tests/fixtures/pack/sc012_benign.jsonl, expect: no_alert}
references: ['https://atlas.mitre.org/techniques/AML.T0110']
