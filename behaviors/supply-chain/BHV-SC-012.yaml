# Generated by scripts/gen_behavior_pack.py (behavior pack). Safe to edit by hand.
id: BHV-SC-012
name: Loading a model artifact spawns a shell or downloader
status: test
severity: critical
confidence: high
description: >-
  Loading a model in an ML workspace spawns a shell, PowerShell or a download tool as a child process. Model loading
  should never start processes; the artifact is executing code on the host.
atlas:
  tactics: [AML.TA0011]
  techniques:
  - {id: AML.T0112.001, relationship: primary}
telemetry:
  required:
  - source: ml_workspace
    fields:
    - timestamp
    - workspace_id
    - principal_id
    - artifact_id
    - event_type
    - child_process
detection:
  logic: field_match
  match:
    event_type: model_load
    child_process:
      in: [sh, bash, dash, zsh, cmd.exe, powershell.exe, pwsh, curl, wget, nc]
  false_positives: [Custom loaders that shell out by design (fix the loader)]
countermeasures:
  mitigations: [AML.M0011, AML.M0014]
  response:
  - action: quarantine_artifact
    params: {artifact: '{{artifact_id}}'}
  - action: open_incident
    params: {queue: ai-sec, priority: P1}
tests:
- {fixture: tests/fixtures/pack/sc012_attack.jsonl, expect: alert}
- {fixture: tests/fixtures/pack/sc012_benign.jsonl, expect: no_alert}
references: ['https://atlas.mitre.org/techniques/AML.T0112']
