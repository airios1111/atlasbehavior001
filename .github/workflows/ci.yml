name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: abm validate --run-tests
      - run: pytest -q
      - run: abm compile --target all
      - run: abm coverage
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: detections-and-coverage
          path: |
            dist/
            reports/
