name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: abm validate --run-tests
      - run: pytest -q
      - run: python scripts/gen_ocsf_fixtures.py --check
      - run: python scripts/gen_ocsf_mapping_doc.py --check
      - run: abm replay --fixture tests/fixtures/ocsf/llm_gateway.ocsf.jsonl --input-format ocsf --output-format ocsf --validate-ocsf --expect alert
      - run: abm compile --target all
      - run: abm coverage
      - run: abm sentinel-build --check   # integrations/sentinel matches the behaviors
      - run: abm sentinel-validate        # rule YAML + table/DCR/playbook/data-file checks
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: detections-and-coverage
          path: |
            dist/
            reports/

  # Content Hub package: Microsoft's solution packaging tool builds mainTemplate.json and
  # createUiDefinition.json from integrations/sentinel, then arm-ttk tests every ARM template.
  sentinel-package:
    needs: build
    runs-on: ubuntu-latest
    env:
      SOLUTION: Azure-Sentinel/Solutions/ATLAS Behavior Map  # must equal the data file Name
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Azure/Azure-Sentinel
          path: Azure-Sentinel
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Tools/Create-Azure-Sentinel-Solution/
            /Workbooks/WorkbooksMetadata.json
            /Logos/Azure_Sentinel.svg
      - uses: actions/checkout@v4
        with:
          repository: Azure/arm-ttk
          path: arm-ttk
      - name: Build the solution package (createSolutionV3.ps1)
        shell: pwsh
        run: |
          # Tool prerequisites (Tools/Create-Azure-Sentinel-Solution/README.md): powershell-yaml for
          # ConvertFrom-YAML on the analytic rules. Import the arm-ttk checked out above so the tool's
          # own arm-ttk pass uses it instead of downloading another copy.
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module powershell-yaml -Scope CurrentUser -Force
          Import-Module powershell-yaml
          Import-Module ./arm-ttk/arm-ttk/arm-ttk.psd1
          $solution = Join-Path $PWD $env:SOLUTION
          New-Item -ItemType Directory -Force (Split-Path $solution) | Out-Null
          Copy-Item -Recurse integrations/sentinel $solution
          # BasePath in the data file has to point at the copied solution folder
          $dataFile = Join-Path $solution "Data/Solution_ABM.json"
          $data = Get-Content $dataFile -Raw | ConvertFrom-Json
          $data.BasePath = $solution
          $data | ConvertTo-Json -Depth 20 | Set-Content $dataFile
          Push-Location Azure-Sentinel/Tools/Create-Azure-Sentinel-Solution/V3
          # local: version from Data/Solution_ABM.json. The default (catalog) looks the offer up in the
          # marketplace catalog API and loads .script/package-automation/, neither of which applies to
          # an unpublished solution built from a sparse checkout.
          ./createSolutionV3.ps1 -SolutionDataFolderPath (Join-Path $solution "Data") -VersionMode local
          Pop-Location
          Get-ChildItem (Join-Path $solution "Package")
          foreach ($f in "mainTemplate.json", "createUiDefinition.json") {
            if (-not (Test-Path (Join-Path $solution "Package/$f"))) { throw "packaging tool did not produce $f" }
          }
      - name: arm-ttk
        shell: pwsh
        run: |
          Import-Module ./arm-ttk/arm-ttk/arm-ttk.psd1
          $targets = @("$env:SOLUTION/Package")
          $targets += (Get-ChildItem "$env:SOLUTION/Playbooks" -Recurse -Filter azuredeploy.json).FullName
          $targets += (Get-ChildItem "$env:SOLUTION/DataCollection" -Filter *.json).FullName
          $failed = 0
          foreach ($t in $targets) {
            $results = @(Test-AzTemplate -TemplatePath $t)
            $bad = @($results | Where-Object { -not $_.Passed })
            "{0}: {1} test(s), {2} failed" -f $t, $results.Count, $bad.Count
            $bad | Format-List Name, File, Errors
            $failed += $bad.Count
          }
          if ($failed) { throw "$failed arm-ttk test(s) failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-solution-package
          path: ${{ env.SOLUTION }}/Package/
