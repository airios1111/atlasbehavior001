id: d9ad8913-4e9c-5f75-a6f8-e8283a9539a5
name: 'BHV-CH-006: Free-tier account farm from one device'
description: |
  More than 10 accounts sign up from the same device fingerprint in a day to multiply free-tier quota.

  MITRE ATLAS tactics: AML.TA0003. Techniques: AML.T0021 (primary), AML.T0034.000 (secondary). Mitigations: AML.M0019, AML.M0004.
  ABM behavior BHV-CH-006: status test, severity medium, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 1d
queryPeriod: 1d
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-CH-006 | Free-tier account farm from one device
  // ATLAS tactics: AML.TA0003 | techniques: AML.T0021(primary), AML.T0034.000(secondary)
  // severity=medium confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-CH-006.yaml. Do not edit.
  AIIdentityEvents_CL
  | where TimeGenerated > ago(1d)
  | where EventType == "signup"
  | summarize Accounts = dcount(AccountId)
            by DeviceFingerprint, bin(TimeGenerated, 1d)
  | where Accounts > 10
  | extend BehaviorId = "BHV-CH-006", AtlasTechnique = "AML.T0021",
           AtlasTactics = dynamic(["AML.TA0003"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0021,AML.T0034.000"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "step_up_auth", "params", bag_pack("principal", strcat("device:", coalesce(tostring(DeviceFingerprint), "{{device_fingerprint}}"))), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "trust-safety"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
