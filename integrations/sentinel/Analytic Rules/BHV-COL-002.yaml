id: 446cbc44-1de9-5c48-bb40-98bd7d848266
name: 'BHV-COL-002: Agent bulk-reads files from the local file system'
description: |
  An agent session reads at least 100 distinct files through file tools in 10 minutes. Agents working on a task read a focused set of files; sweeping the disk is staging for exfiltration.

  MITRE ATLAS tactics: AML.TA0009. Techniques: AML.T0037 (primary). Mitigations: AML.M0026, AML.M0032.
  ABM behavior BHV-COL-002: status test, severity high, confidence medium.
  False positives: Repository indexing agents (allowlisted by agent_id).
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 10m
queryPeriod: 10m
triggerOperator: gt
triggerThreshold: 0
tactics:
- Collection
relevantTechniques:
- T1005
query: |
  // BHV-COL-002 | Agent bulk-reads files from the local file system
  // ATLAS tactics: AML.TA0009 | techniques: AML.T0037(primary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-COL-002.yaml. Do not edit.
  AIAgentToolCalls_CL
  | where TimeGenerated > ago(10m)
  | where ToolName in ("fs.read", "fs.read_file", "file.read")
  | where AgentId !in ("code-indexer")
  | summarize Reads = count(),
              DistinctFiles = dcount(FilePath)
            by SessionId, AgentId, bin(TimeGenerated, 10m)
  | where DistinctFiles >= 100
  | extend BehaviorId = "BHV-COL-002", AtlasTechnique = "AML.T0037",
           AtlasTactics = dynamic(["AML.TA0009"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0037"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "kill_session", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "session", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "agent-platform"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
