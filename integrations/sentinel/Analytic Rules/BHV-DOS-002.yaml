id: 698225d7-d612-5391-bf7e-a7459981c511
name: 'BHV-DOS-002: Request flood from one principal'
description: |
  More than 600 requests in one minute from a single principal against the LLM gateway.

  MITRE ATLAS tactics: AML.TA0011. Techniques: AML.T0029 (primary). Mitigations: AML.M0004.
  ABM behavior BHV-DOS-002: status test, severity high, confidence high.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 5m
queryPeriod: 5m
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-DOS-002 | Request flood from one principal
  // ATLAS tactics: AML.TA0011 | techniques: AML.T0029(primary)
  // severity=high confidence=high status=test
  // GENERATED by atlas-behavior-map from BHV-DOS-002.yaml. Do not edit.
  AIGatewayLogs_CL
  | where TimeGenerated > ago(5m)
  | summarize Requests = count()
            by PrincipalId, bin(TimeGenerated, 1m)
  | where Requests > 600
  | extend BehaviorId = "BHV-DOS-002", AtlasTechnique = "AML.T0029",
           AtlasTactics = dynamic(["AML.TA0011"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0029"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "rate_limit", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "limit", "60/min", "ttl", "1h"), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
