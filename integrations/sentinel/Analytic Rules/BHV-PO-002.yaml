name: 'BHV-PO-002: Label disagreement spike in an ingested training batch'
description: |
  More than 15% of an ingested batch's labels disagree with a reference model or consensus labelers, consistent with label flipping.

  MITRE ATLAS tactics: AML.TA0003, AML.TA0006. Techniques: AML.T0020 (primary). Mitigations: AML.M0007, AML.M0025.
  ABM behavior BHV-PO-002: status test, severity high, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-PO-002 | Label disagreement spike in an ingested training batch
  // ATLAS tactics: AML.TA0003, AML.TA0006 | techniques: AML.T0020(primary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-PO-002.yaml. Do not edit.
  AITrainingPipelineEvents_CL
  | where EventType == "batch_ingest"
  | where LabelDisagreementRate >= 0.15
  | extend BehaviorId = "BHV-PO-002", AtlasTechnique = "AML.T0020",
           AtlasTactics = dynamic(["AML.TA0003", "AML.TA0006"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0020"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "halt_pipeline", "params", bag_pack("pipeline", coalesce(tostring(PipelineId), "{{pipeline_id}}")), "requires_approval", true, "reversible", true, "blast_radius", "pipeline", "status", "awaiting_approval"),
      bag_pack("action", "quarantine_artifact", "params", bag_pack("artifact", coalesce(tostring(BatchId), "{{batch_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "service", "status", "auto")))
