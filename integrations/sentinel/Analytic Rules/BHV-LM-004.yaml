name: 'BHV-LM-004: Voice clone requested for a protected executive without consent'
description: |
  A voice-cloning request's reference audio matches a protected person (speaker match computed by the voice service) and no consent is on file. This prepares deepfake voice phishing against colleagues of that person.

  MITRE ATLAS tactics: AML.TA0015, AML.TA0004. Techniques: AML.T0052.001 (primary). Mitigations: AML.M0019, AML.M0018.
  ABM behavior BHV-LM-004: status test, severity critical, confidence medium.
  False positives: Consent recorded outside the voice service's consent store.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- DefenseEvasion
relevantTechniques:
- T1656
query: |
  // BHV-LM-004 | Voice clone requested for a protected executive without consent
  // ATLAS tactics: AML.TA0015, AML.TA0004 | techniques: AML.T0052.001(primary)
  // severity=critical confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-LM-004.yaml. Do not edit.
  AIInferenceLogs_CL
  | where Task == "voice_clone"
  | where SpeakerIsProtectedPerson == true
  | where SpeakerConsentOnFile == false
  | extend BehaviorId = "BHV-LM-004", AtlasTechnique = "AML.T0052.001",
           AtlasTactics = dynamic(["AML.TA0015", "AML.TA0004"]), Severity = "critical"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0052.001"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "block_request", "params", bag_pack("request", coalesce(tostring(PrincipalId), "{{principal_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P1"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "exec-protection"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
