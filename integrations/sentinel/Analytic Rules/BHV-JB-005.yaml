id: 01328b0b-371d-5156-94e9-1601ea031a78
name: 'BHV-JB-005: Refusal-suppression instructions'
description: |
  Prompt forbids refusals, forces an affirmative opening ('Start with: Sure, here is') or demands answers without warnings. These patterns are typical of jailbreak templates.

  MITRE ATLAS tactics: AML.TA0012, AML.TA0007. Techniques: AML.T0054 (primary), AML.T0040 (precondition). Mitigations: AML.M0020, AML.M0022.
  ABM behavior BHV-JB-005: status test, severity medium, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-JB-005 | Refusal-suppression instructions
  // ATLAS tactics: AML.TA0012, AML.TA0007 | techniques: AML.T0054(primary), AML.T0040(precondition)
  // severity=medium confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-JB-005.yaml. Do not edit.
  AIGatewayLogs_CL
  | where Prompt matches regex @"(?i)\b(never|do\s+not|don'?t)\s+(refuse|say\s+(you\s+)?(can'?t|cannot))\b"
      or Prompt matches regex @"(?i)\bstart\s+(your\s+)?(response|reply|answer)\s+with\s+[\""']?(sure|absolutely|of\s+course),?\s+here\b"
      or Prompt matches regex @"(?i)\bwithout\s+(any\s+)?(warnings?|disclaimers?|caveats?|moral(i[sz]ing)?)\b.{0,40}\b(explain|give|provide|write|tell)\b"
  | extend BehaviorId = "BHV-JB-005", AtlasTechnique = "AML.T0054",
           AtlasTactics = dynamic(["AML.TA0012", "AML.TA0007"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0054,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "block_request", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "increment_risk", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "delta", 15), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
