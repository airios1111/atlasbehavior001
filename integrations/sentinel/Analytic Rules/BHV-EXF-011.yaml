id: b4639814-6e75-5919-ae5b-378b29bedafe
name: 'BHV-EXF-011: Agent reads a secret and makes external egress in the same session'
description: |
  Within 10 minutes one agent session both reads a secret (vault, credential file, env var) and calls an external network tool, the read-then-send exfiltration chain.

  MITRE ATLAS tactics: AML.TA0010. Techniques: AML.T0086 (primary), AML.T0098 (secondary). Mitigations: AML.M0026, AML.M0029, AML.M0032.
  ABM behavior BHV-EXF-011: status test, severity critical, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 10m
queryPeriod: 10m
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-EXF-011 | Agent reads a secret and makes external egress in the same session
  // ATLAS tactics: AML.TA0010 | techniques: AML.T0086(primary), AML.T0098(secondary)
  // severity=critical confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-EXF-011.yaml. Do not edit.
  AIAgentToolCalls_CL
  | where TimeGenerated > ago(10m)
  | summarize SecretReads = sum(IsSecretRead),
              EgressCalls = sum(IsExternalEgress)
            by SessionId, bin(TimeGenerated, 10m)
  | where SecretReads >= 1 and EgressCalls >= 1
  | extend BehaviorId = "BHV-EXF-011", AtlasTechnique = "AML.T0086",
           AtlasTactics = dynamic(["AML.TA0010"]), Severity = "critical"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0086,AML.T0098"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "kill_session", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "session", "status", "auto"),
      bag_pack("action", "rotate_credentials", "params", bag_pack("scope", strcat("agent-session-", coalesce(tostring(SessionId), "{{session_id}}"))), "requires_approval", true, "reversible", true, "blast_radius", "service", "status", "awaiting_approval"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P1"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
