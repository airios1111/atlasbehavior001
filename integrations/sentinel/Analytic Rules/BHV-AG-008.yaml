id: 9d38242e-7efc-5b92-b861-a49ec3056928
name: 'BHV-AG-008: High-risk tool call after untrusted content without approval'
description: |
  An agent invokes a high-risk tool (payments, email, file write) while its context holds untrusted content, and no human approved the call.

  MITRE ATLAS tactics: AML.TA0005, AML.TA0012. Techniques: AML.T0053 (primary). Mitigations: AML.M0030, AML.M0029.
  ABM behavior BHV-AG-008: status test, severity high, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-AG-008 | High-risk tool call after untrusted content without approval
  // ATLAS tactics: AML.TA0005, AML.TA0012 | techniques: AML.T0053(primary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-AG-008.yaml. Do not edit.
  AIAgentToolCalls_CL
  | where ToolRisk == "high"
  | where ContextHasUntrustedContent == true
  | where HumanApproved == false
  | extend BehaviorId = "BHV-AG-008", AtlasTechnique = "AML.T0053",
           AtlasTactics = dynamic(["AML.TA0005", "AML.TA0012"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0053"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "deny_tool_call", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "agent-platform"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
