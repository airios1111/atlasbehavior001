id: ef5d71e6-2993-50fe-b60f-1317ddf4b4f0
name: 'BHV-CH-001: Abnormal compute spend per principal'
description: |
  A principal's inference spend in a day far exceeds its baseline. Static threshold placeholder until per-principal baselining is implemented.

  MITRE ATLAS tactics: AML.TA0011. Techniques: AML.T0034 (primary). Mitigations: AML.M0004, AML.M0019.
  ABM behavior BHV-CH-001: status experimental, severity medium, confidence low.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 1d
queryPeriod: 1d
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-CH-001 | Abnormal compute spend per principal
  // ATLAS tactics: AML.TA0011 | techniques: AML.T0034(primary)
  // severity=medium confidence=low status=experimental
  // GENERATED by atlas-behavior-map from BHV-CH-001.yaml. Do not edit.
  AIGatewayLogs_CL
  | where TimeGenerated > ago(1d)
  | summarize DailyCostUsd = sum(CostUsd)
            by PrincipalId, bin(TimeGenerated, 1d)
  | where DailyCostUsd > 500
  | extend BehaviorId = "BHV-CH-001", AtlasTechnique = "AML.T0034",
           AtlasTactics = dynamic(["AML.TA0011"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0034"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "enforce_quota", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "finops-soc"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
