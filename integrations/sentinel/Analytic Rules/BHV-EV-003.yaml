id: 274a4af7-8e3c-5046-a04f-02f0c1aeee9f
name: 'BHV-EV-003: Malware-classifier evasion via many variants of one family'
description: |
  One submitter sends more than 50 unique file hashes that all fall into two or fewer fuzzy-hash clusters within an hour, i.e. padded or mutated variants of the same binary.

  MITRE ATLAS tactics: AML.TA0004, AML.TA0007, AML.TA0011. Techniques: AML.T0015 (primary). Mitigations: AML.M0015, AML.M0006.
  ABM behavior BHV-EV-003: status test, severity high, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-EV-003 | Malware-classifier evasion via many variants of one family
  // ATLAS tactics: AML.TA0004, AML.TA0007, AML.TA0011 | techniques: AML.T0015(primary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-EV-003.yaml. Do not edit.
  AIInferenceLogs_CL
  | where TimeGenerated > ago(1h)
  | where ModelId == "malware-clf"
  | summarize Variants = dcount(FileSha256),
              Families = dcount(FuzzyHashCluster)
            by PrincipalId, bin(TimeGenerated, 1h)
  | where Variants > 50 and Families <= 2
  | extend BehaviorId = "BHV-EV-003", AtlasTechnique = "AML.T0015",
           AtlasTactics = dynamic(["AML.TA0004", "AML.TA0007", "AML.TA0011"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0015"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "increment_risk", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "delta", 50), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
