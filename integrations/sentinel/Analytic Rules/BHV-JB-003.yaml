id: 71253f21-c5e0-5a83-b2b9-a37303794e05
name: 'BHV-JB-003: Crescendo: harm score escalating across a session'
description: |
  Within 30 minutes a session's per-turn harm-classifier score climbs to a high peak while staying elevated on average. This is a multi-turn escalation that no single turn reveals.

  MITRE ATLAS tactics: AML.TA0012, AML.TA0007. Techniques: AML.T0054 (primary), AML.T0040 (precondition). Mitigations: AML.M0020, AML.M0022.
  ABM behavior BHV-JB-003: status test, severity high, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 30m
queryPeriod: 30m
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-JB-003 | Crescendo: harm score escalating across a session
  // ATLAS tactics: AML.TA0012, AML.TA0007 | techniques: AML.T0054(primary), AML.T0040(precondition)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-JB-003.yaml. Do not edit.
  AIGatewayLogs_CL
  | where TimeGenerated > ago(30m)
  | summarize Turns = count(),
              MaxHarm = max(HarmScore),
              AvgHarm = avg(HarmScore)
            by SessionId, bin(TimeGenerated, 30m)
  | where Turns >= 6 and MaxHarm > 0.8 and AvgHarm > 0.4
  | extend BehaviorId = "BHV-JB-003", AtlasTechnique = "AML.T0054",
           AtlasTactics = dynamic(["AML.TA0012", "AML.TA0007"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0054,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "kill_session", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "session", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P3"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
