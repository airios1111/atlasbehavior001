id: 87c6b8b6-d5d0-5276-9399-7170861e68b2
name: 'BHV-DSC-007: Harvesting hallucinated package names across sessions'
description: |
  In one hour a principal's completions name at least 8 packages that do not exist on the public index (nonexistent_packages_in_completion, from a package-index lookup on the completion), spread over at least 3 sessions. Repeatedly fishing for hallucinated names is how attackers find package names worth registering. Experimental: single developers can trip it.

  MITRE ATLAS tactics: AML.TA0008. Techniques: AML.T0062 (primary). Mitigations: AML.M0020, AML.M0023.
  ABM behavior BHV-DSC-007: status experimental, severity medium, confidence low.
  False positives: Developers exploring an unfamiliar ecosystem.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-DSC-007 | Harvesting hallucinated package names across sessions
  // ATLAS tactics: AML.TA0008 | techniques: AML.T0062(primary)
  // severity=medium confidence=low status=experimental
  // GENERATED by atlas-behavior-map from BHV-DSC-007.yaml. Do not edit.
  AIGatewayLogs_CL
  | where TimeGenerated > ago(1h)
  | summarize FakePkgs = sum(NonexistentPackagesInCompletion),
              Sessions = dcount(SessionId)
            by PrincipalId, bin(TimeGenerated, 1h)
  | where FakePkgs >= 8 and Sessions >= 3
  | extend BehaviorId = "BHV-DSC-007", AtlasTechnique = "AML.T0062",
           AtlasTactics = dynamic(["AML.TA0008"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0062"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "notify", "params", bag_pack("channel", "soc"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
