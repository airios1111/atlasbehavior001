id: 87ce42c7-f513-5c27-ba90-82568bf2c8af
name: 'BHV-CA-005: User asks the assistant to reveal its own keys or environment'
description: |
  A prompt asks the assistant or agent to print its API keys, tokens or connection strings, or to dump its environment variables. Any credential placed in the agent's context or environment is at risk.

  MITRE ATLAS tactics: AML.TA0013. Techniques: AML.T0083 (primary), AML.T0040 (precondition). Mitigations: AML.M0020, AML.M0026.
  ABM behavior BHV-CA-005: status test, severity high, confidence medium.
  False positives: Developers debugging their own agent in a sandbox.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-CA-005 | User asks the assistant to reveal its own keys or environment
  // ATLAS tactics: AML.TA0013 | techniques: AML.T0083(primary), AML.T0040(precondition)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-CA-005.yaml. Do not edit.
  AIGatewayLogs_CL
  | where Prompt matches regex @"(?i)\b(print|show|reveal|output|display|tell me|what is|what's|give me|echo)\b.{0,30}\b(your|the agent'?s|the assistant'?s|its)\b.{0,20}\b(api[ _-]?keys?|access tokens?|secrets?|credentials|passwords?|bearer tokens?|connection strings?)\b"
      or Prompt matches regex @"(?i)\b(print|dump|list|show|output|echo)\b.{0,20}\b(your|all|the)\b.{0,10}\b(environment variables|env vars|os\.environ|process\.env|\.env file)\b"
  | extend BehaviorId = "BHV-CA-005", AtlasTechnique = "AML.T0083",
           AtlasTactics = dynamic(["AML.TA0013"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0083,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "block_request", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "increment_risk", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "delta", 15), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
