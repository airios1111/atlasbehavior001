id: 8e76b364-dabb-56d8-8657-1da35e309cf4
name: 'BHV-JB-001: Role-play / persona jailbreak attempt in user input'
description: |
  User prompt attempts to bypass model guardrails by assigning an unrestricted persona (DAN, "developer/god mode"), framing a hypothetical that suspends policy, or explicitly asking the model to drop its restrictions.

  MITRE ATLAS tactics: AML.TA0012, AML.TA0007. Techniques: AML.T0054 (primary), AML.T0040 (precondition). Mitigations: AML.M0020, AML.M0021.
  ABM behavior BHV-JB-001: status stable, severity high, confidence medium.
  False positives: Creative-writing role-play without policy-suspension language; Red-team exercises (scope by principal).
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-JB-001 | Role-play / persona jailbreak attempt in user input
  // ATLAS tactics: AML.TA0012, AML.TA0007 | techniques: AML.T0054(primary), AML.T0040(precondition)
  // severity=high confidence=medium status=stable
  // GENERATED by atlas-behavior-map from BHV-JB-001.yaml. Do not edit.
  AIGatewayLogs_CL
  | where Prompt matches regex @"\bDAN\b"
      or Prompt matches regex @"(?i)\bdo\s+anything\s+now\b"
      or Prompt matches regex @"(?i)\b(developer|god|unfiltered|evil|jailbreak)\s+mode\b"
      or Prompt matches regex @"(?i)\b(pretend|act\s+as\s+if|imagine)\s+(you\s+are|you're|to\s+be)\b.{0,60}\b(no|without|free\s+of)\s+(restrictions|rules|filters|limits|guidelines)\b"
      or Prompt matches regex @"(?i)\b(hypothetically|in\s+a\s+fictional\s+world)\b.{0,80}\b(no\s+ethic|ignore\s+(your\s+)?(policy|policies|guidelines|safety))"
      or Prompt matches regex @"(?i)\b(stay\s+in\s+character|never\s+break\s+character)\b.{0,60}\b(no\s+matter|even\s+if)\b"
  | extend BehaviorId = "BHV-JB-001", AtlasTechnique = "AML.T0054",
           AtlasTactics = dynamic(["AML.TA0012", "AML.TA0007"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0054,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "block_request", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "increment_risk", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "delta", 20), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
