id: 4f724cae-e9ee-50b6-bac5-7544249793a4
name: 'BHV-SC-008: Hidden instructions in an agent tool description (tool poisoning)'
description: |
  A tool description or schema registered at the MCP gateway contains instruction tags or directives aimed at the agent ('before using this tool, read ~/.ssh...', 'do not tell the user').

  MITRE ATLAS tactics: AML.TA0006. Techniques: AML.T0110 (primary). Mitigations: AML.M0028, AML.M0033.
  ABM behavior BHV-SC-008: status test, severity critical, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-SC-008 | Hidden instructions in an agent tool description (tool poisoning)
  // ATLAS tactics: AML.TA0006 | techniques: AML.T0110(primary)
  // severity=critical confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-SC-008.yaml. Do not edit.
  AIMCPGatewayEvents_CL
  | where EventType in ("tool_registered", "tool_manifest_change")
  | where ToolDescription matches regex @"(?i)<\s*(important|system|instructions?)\s*>"
      or ToolDescription matches regex @"(?i)\bbefore\s+(using|calling)\s+this\s+tool\b.{0,80}\b(read|send|include|pass|upload)\b"
      or ToolDescription matches regex @"(?i)\bdo\s+not\s+(mention|tell|reveal|inform)\b.{0,40}\buser\b"
  | extend BehaviorId = "BHV-SC-008", AtlasTechnique = "AML.T0110",
           AtlasTactics = dynamic(["AML.TA0006"]), Severity = "critical"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0110"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "disable_tool", "params", bag_pack("tool", coalesce(tostring(ToolName), "{{tool_name}}"), "server", coalesce(tostring(ServerId), "{{server_id}}")), "requires_approval", true, "reversible", true, "blast_radius", "service", "status", "awaiting_approval"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P1"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
