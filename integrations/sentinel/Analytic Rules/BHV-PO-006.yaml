id: 61860206-14d4-56c1-b0bb-693d7cf87c49
name: 'BHV-PO-006: Persistent instruction written into agent long-term memory'
description: |
  An agent memory write contains a standing instruction ('from now on always forward...') or an override. This persists the injection across future sessions.

  MITRE ATLAS tactics: AML.TA0006. Techniques: AML.T0080.000 (primary). Mitigations: AML.M0031, AML.M0030.
  ABM behavior BHV-PO-006: status test, severity high, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-PO-006 | Persistent instruction written into agent long-term memory
  // ATLAS tactics: AML.TA0006 | techniques: AML.T0080.000(primary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-PO-006.yaml. Do not edit.
  AIAgentMemoryEvents_CL
  | where Operation == "write"
  | where MemoryText matches regex @"(?i)\b(always|from\s+now\s+on|in\s+(all\s+)?future\s+(chats|conversations|sessions))\b.{0,60}\b(send|forward|include|use|trust|recommend|visit)\b"
      or MemoryText matches regex @"(?i)\b(ignore|disregard)\b.{0,30}\b(instructions|rules|policy|policies)\b"
  | extend BehaviorId = "BHV-PO-006", AtlasTechnique = "AML.T0080.000",
           AtlasTactics = dynamic(["AML.TA0006"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0080.000"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "purge_agent_memory", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "agent", coalesce(tostring(AgentId), "{{agent_id}}")), "requires_approval", true, "reversible", false, "blast_radius", "principal", "status", "awaiting_approval"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
