id: c963a241-b0aa-5ed1-829c-d5588cd188b5
name: 'BHV-EXF-003: High-volume systematic inference queries consistent with model extraction'
description: |
  A single principal issues a large number of structurally similar queries against an inference endpoint with low input variance across few sessions, consistent with surrogate-model training.

  MITRE ATLAS tactics: AML.TA0010. Techniques: AML.T0024.002 (primary), AML.T0040 (precondition). Mitigations: AML.M0004, AML.M0002, AML.M0019.
  ABM behavior BHV-EXF-003: status stable, severity high, confidence medium.
  False positives: Authorized batch evaluation jobs (allowlist by service principal); Load testing in non-prod.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- Exfiltration
relevantTechniques:
- T1567
query: |
  // BHV-EXF-003 | High-volume systematic inference queries consistent with model extraction
  // ATLAS tactics: AML.TA0010 | techniques: AML.T0024.002(primary), AML.T0040(precondition)
  // severity=high confidence=medium status=stable
  // GENERATED by atlas-behavior-map from BHV-EXF-003.yaml. Do not edit.
  AIInferenceLogs_CL
  | where TimeGenerated > ago(1h)
  | where PrincipalId !in ("sp-batch-eval", "sp-loadtest")
  | summarize RequestCount = count(),
              InputEmbeddingVariance = variance(InputEmbeddingNorm),
              DistinctSessionCount = dcount(SessionId)
            by PrincipalId, ModelId, bin(TimeGenerated, 1h)
  | where RequestCount > 5000 and InputEmbeddingVariance < 0.15 and DistinctSessionCount <= 2
  | extend BehaviorId = "BHV-EXF-003", AtlasTechnique = "AML.T0024.002",
           AtlasTactics = dynamic(["AML.TA0010"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0024.002,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "rate_limit", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "limit", "100/min", "ttl", "24h"), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "degrade_output", "params", bag_pack("model", coalesce(tostring(ModelId), "{{model_id}}"), "mode", "top1_label_only"), "requires_approval", false, "reversible", true, "blast_radius", "model", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto"),
      bag_pack("action", "revoke_token", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}")), "requires_approval", true, "reversible", true, "blast_radius", "principal", "status", "awaiting_approval")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
