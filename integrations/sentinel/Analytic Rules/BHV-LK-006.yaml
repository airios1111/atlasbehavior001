id: 3f2de4f8-fca0-59e2-b9a0-f8e03d6d222b
name: 'BHV-LK-006: Bulk email addresses in a single completion'
description: |
  One completion lists five or more email addresses. This is consistent with directory or CRM data being dumped through the model.

  MITRE ATLAS tactics: AML.TA0010. Techniques: AML.T0057 (primary). Mitigations: AML.M0020, AML.M0019.
  ABM behavior BHV-LK-006: status test, severity high, confidence medium.
  False positives: Users asking the model to format their own contact list.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-LK-006 | Bulk email addresses in a single completion
  // ATLAS tactics: AML.TA0010 | techniques: AML.T0057(primary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-LK-006.yaml. Do not edit.
  AIGatewayLogs_CL
  | where Completion matches regex @"([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}[^@]{0,120}){5,}"
  | extend BehaviorId = "BHV-LK-006", AtlasTechnique = "AML.T0057",
           AtlasTactics = dynamic(["AML.TA0010"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0057"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "redact_output", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "privacy-office"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
