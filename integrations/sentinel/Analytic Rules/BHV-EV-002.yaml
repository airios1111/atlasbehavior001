id: 89db05fd-ee90-54c9-a22d-274e961103a1
name: 'BHV-EV-002: Black-box adversarial search: near-duplicate inputs flipping predictions'
description: |
  More than 300 nearly identical inputs (similarity above 0.97) in an hour that produce at least two different labels. Someone is searching for the decision boundary.

  MITRE ATLAS tactics: AML.TA0001. Techniques: AML.T0043.001 (primary), AML.T0015 (secondary), AML.T0040 (precondition). Mitigations: AML.M0015, AML.M0004, AML.M0003.
  ABM behavior BHV-EV-002: status test, severity high, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-EV-002 | Black-box adversarial search: near-duplicate inputs flipping predictions
  // ATLAS tactics: AML.TA0001 | techniques: AML.T0043.001(primary), AML.T0015(secondary), AML.T0040(precondition)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-EV-002.yaml. Do not edit.
  AIInferenceLogs_CL
  | where TimeGenerated > ago(1h)
  | summarize Requests = count(),
              AvgSimilarity = avg(InputSimilarityToPrev),
              Labels = dcount(PredictedLabel)
            by PrincipalId, ModelId, bin(TimeGenerated, 1h)
  | where Requests > 300 and AvgSimilarity > 0.97 and Labels >= 2
  | extend BehaviorId = "BHV-EV-002", AtlasTechnique = "AML.T0043.001",
           AtlasTactics = dynamic(["AML.TA0001"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0043.001,AML.T0015,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "rate_limit", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "limit", "10/min", "ttl", "24h"), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "degrade_output", "params", bag_pack("model", coalesce(tostring(ModelId), "{{model_id}}"), "mode", "top1_label_only"), "requires_approval", false, "reversible", true, "blast_radius", "model", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
