id: 8f43859e-138b-5ef8-a518-3c0ce6569c66
name: 'BHV-DSC-003: Probing for the agent''s activation triggers'
description: |
  A prompt asks which phrases, events or conditions make the agent call a tool, act on its own or start a workflow. Those triggers are what an attacker plants in an email or document to set the agent off without the user noticing.

  MITRE ATLAS tactics: AML.TA0008. Techniques: AML.T0084.002 (primary), AML.T0040 (precondition). Mitigations: AML.M0020, AML.M0030.
  ABM behavior BHV-DSC-003: status test, severity medium, confidence medium.
  False positives: Agent builders testing their own trigger configuration.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-DSC-003 | Probing for the agent's activation triggers
  // ATLAS tactics: AML.TA0008 | techniques: AML.T0084.002(primary), AML.T0040(precondition)
  // severity=medium confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-DSC-003.yaml. Do not edit.
  AIGatewayLogs_CL
  | where Prompt matches regex @"(?i)\b(what|which)\b.{0,30}\b(keywords?|phrases?|conditions?|events?|triggers?|inputs?)\b.{0,30}\b(make|cause|trigger|activate|wake)\b.{0,10}\byou\b.{0,20}\b(to\s+)?(call|invoke|run|use|execute|send|act|take\s+action)"
      or Prompt matches regex @"(?i)\b(what|when)\b.{0,40}\b(triggers?|activates|wakes\s+up)\b.{0,10}\b(you|your\s+(tools?|actions?|workflows?|automations?))\b"
  | extend BehaviorId = "BHV-DSC-003", AtlasTechnique = "AML.T0084.002",
           AtlasTactics = dynamic(["AML.TA0008"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0084.002,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "increment_risk", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "delta", 15), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
