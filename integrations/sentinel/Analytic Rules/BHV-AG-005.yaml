id: 1f836106-29b9-5d81-8c56-69ce666b9e2d
name: 'BHV-AG-005: Agent reads credential files'
description: |
  Agent file or shell tools access well-known credential stores: cloud CLI credentials, kubeconfig, .env files, SSH private keys, package-registry tokens.

  MITRE ATLAS tactics: AML.TA0013. Techniques: AML.T0098 (primary), AML.T0083 (secondary). Mitigations: AML.M0026, AML.M0028.
  ABM behavior BHV-AG-005: status test, severity high, confidence high.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-AG-005 | Agent reads credential files
  // ATLAS tactics: AML.TA0013 | techniques: AML.T0098(primary), AML.T0083(secondary)
  // severity=high confidence=high status=test
  // GENERATED by atlas-behavior-map from BHV-AG-005.yaml. Do not edit.
  AIAgentToolCalls_CL
  | where ToolName in ("fs.read", "shell.exec", "code_interpreter.run", "terminal.run")
  | where ToolArgs matches regex @"(?i)(\.aws/credentials|\.azure/accessTokens\.json|\.config/gcloud/|\.kube/config|\.docker/config\.json|\.git-credentials|\.npmrc|\.pypirc)"
      or ToolArgs matches regex @"(?i)(^|[\s/\""'])\.env(\.[a-z]+)?($|[\s\""'])"
      or ToolArgs matches regex @"(?i)\bid_(rsa|ed25519|ecdsa)\b"
  | extend BehaviorId = "BHV-AG-005", AtlasTechnique = "AML.T0098",
           AtlasTactics = dynamic(["AML.TA0013"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0098,AML.T0083"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "deny_tool_call", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "kill_session", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "session", "status", "auto"),
      bag_pack("action", "rotate_credentials", "params", bag_pack("scope", "agent-host"), "requires_approval", true, "reversible", true, "blast_radius", "service", "status", "awaiting_approval"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
