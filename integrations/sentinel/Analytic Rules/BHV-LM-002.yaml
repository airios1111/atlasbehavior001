id: 93245f4a-8f9d-55db-a0e2-0941e3caf15c
name: 'BHV-LM-002: One access token used from several devices and networks'
description: |
  Within an hour the same token identifier is presented from at least two devices on at least two networks (ASNs). The token was copied off the machine it was issued to and replayed.

  MITRE ATLAS tactics: AML.TA0015. Techniques: AML.T0091.000 (primary). Mitigations: AML.M0019, AML.M0026.
  ABM behavior BHV-LM-002: status test, severity high, confidence medium.
  False positives: Token brokers that legitimately share one token across a device pair.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- DefenseEvasion
- LateralMovement
relevantTechniques:
- T1550.001
query: |
  // BHV-LM-002 | One access token used from several devices and networks
  // ATLAS tactics: AML.TA0015 | techniques: AML.T0091.000(primary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-LM-002.yaml. Do not edit.
  AIIdentityEvents_CL
  | where TimeGenerated > ago(1h)
  | summarize Devices = dcount(DeviceId),
              Asns = dcount(ClientAsn)
            by TokenId, bin(TimeGenerated, 1h)
  | where Devices >= 2 and Asns >= 2
  | extend BehaviorId = "BHV-LM-002", AtlasTechnique = "AML.T0091.000",
           AtlasTactics = dynamic(["AML.TA0015"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0091.000"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "revoke_token", "params", bag_pack("principal", strcat("token:", coalesce(tostring(TokenId), "{{token_id}}"))), "requires_approval", true, "reversible", true, "blast_radius", "principal", "status", "awaiting_approval"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
