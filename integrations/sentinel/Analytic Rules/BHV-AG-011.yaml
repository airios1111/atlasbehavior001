id: aa397157-56e7-56f4-9025-179f6634272c
name: 'BHV-AG-011: Browsing agent clicks into a download, login form or OAuth consent on an untrusted page'
description: |
  A browsing agent on an untrusted page clicks an element that starts a file download, credential form or OAuth consent. This is the AI-agent clickbait pattern.

  MITRE ATLAS tactics: AML.TA0005. Techniques: AML.T0100 (primary). Mitigations: AML.M0029, AML.M0030.
  ABM behavior BHV-AG-011: status test, severity high, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-AG-011 | Browsing agent clicks into a download, login form or OAuth consent on an untrusted page
  // ATLAS tactics: AML.TA0005 | techniques: AML.T0100(primary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-AG-011.yaml. Do not edit.
  AIAgentToolCalls_CL
  | where ToolName == "browser.click"
  | where PageTrust == "untrusted"
  | where TargetCategory in ("file_download", "credential_form", "oauth_consent")
  | extend BehaviorId = "BHV-AG-011", AtlasTechnique = "AML.T0100",
           AtlasTactics = dynamic(["AML.TA0005"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0100"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "deny_tool_call", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "agent-platform"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
