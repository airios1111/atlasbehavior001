id: fd505928-c185-50a9-9669-e502d42e610f
name: 'BHV-MA-003: Product channel request carries raw model controls the product never sends'
description: |
  A request arriving from a product front-end asks for log-probabilities, logit bias or echo. The shipped client never sends these, so someone is scripting the product's backend API to reach the underlying model's raw interface.

  MITRE ATLAS tactics: AML.TA0000. Techniques: AML.T0047 (primary). Mitigations: AML.M0019, AML.M0002.
  ABM behavior BHV-MA-003: status test, severity high, confidence medium.
  False positives: A new product release that starts sending these parameters.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-MA-003 | Product channel request carries raw model controls the product never sends
  // ATLAS tactics: AML.TA0000 | techniques: AML.T0047(primary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-MA-003.yaml. Do not edit.
  AIGatewayLogs_CL
  | where ClientApp in ("support-web", "support-mobile")
  | where RequestParamKeys matches regex @"(^|,)\s*(logprobs|top_logprobs|logit_bias|echo)\s*(,|$)"
  | extend BehaviorId = "BHV-MA-003", AtlasTechnique = "AML.T0047",
           AtlasTactics = dynamic(["AML.TA0000"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0047"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "block_request", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "increment_risk", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "delta", 15), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
