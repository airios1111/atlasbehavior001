id: d24e3402-d2be-58cd-84d3-c1de2219503d
name: 'BHV-AG-004: Sandbox escape attempt from agent'
description: |
  Agent commands touch the container runtime socket, enter the host PID namespace, read /proc/1/root or mount host block devices.

  MITRE ATLAS tactics: AML.TA0012. Techniques: AML.T0105 (primary). Mitigations: AML.M0032, AML.M0026.
  ABM behavior BHV-AG-004: status test, severity critical, confidence high.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-AG-004 | Sandbox escape attempt from agent
  // ATLAS tactics: AML.TA0012 | techniques: AML.T0105(primary)
  // severity=critical confidence=high status=test
  // GENERATED by atlas-behavior-map from BHV-AG-004.yaml. Do not edit.
  AIAgentToolCalls_CL
  | where ToolArgs matches regex @"/var/run/docker\.sock"
      or ToolArgs matches regex @"(?i)\bnsenter\s+(-t\s+1|--target\s+1)\b"
      or ToolArgs matches regex @"/proc/1/root"
      or ToolArgs matches regex @"(?i)\bmount\s+.{0,40}/dev/(sd|nvme|xvd)"
  | extend BehaviorId = "BHV-AG-004", AtlasTechnique = "AML.T0105",
           AtlasTactics = dynamic(["AML.TA0012"]), Severity = "critical"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0105"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "deny_tool_call", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "kill_session", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "session", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P1"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
