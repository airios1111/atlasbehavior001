id: 3b9a1fa0-0900-5118-aeae-9a2535ee8000
name: 'BHV-CH-005: Unapproved large GPU training job'
description: |
  A training job requesting more than 500 GPU-hours is submitted without budget approval.

  MITRE ATLAS tactics: AML.TA0011. Techniques: AML.T0034.001 (primary). Mitigations: AML.M0019.
  ABM behavior BHV-CH-005: status test, severity medium, confidence high.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-CH-005 | Unapproved large GPU training job
  // ATLAS tactics: AML.TA0011 | techniques: AML.T0034.001(primary)
  // severity=medium confidence=high status=test
  // GENERATED by atlas-behavior-map from BHV-CH-005.yaml. Do not edit.
  AITrainingPipelineEvents_CL
  | where EventType == "training_job_submit"
  | where RequestedGpuHours > 500
  | where BudgetApproved == false
  | extend BehaviorId = "BHV-CH-005", AtlasTechnique = "AML.T0034.001",
           AtlasTactics = dynamic(["AML.TA0011"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0034.001"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "halt_pipeline", "params", bag_pack("pipeline", coalesce(tostring(JobId), "{{job_id}}")), "requires_approval", true, "reversible", true, "blast_radius", "pipeline", "status", "awaiting_approval"),
      bag_pack("action", "notify", "params", bag_pack("channel", "finops-soc"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
