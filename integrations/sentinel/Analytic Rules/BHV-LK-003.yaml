name: 'BHV-LK-003: System-prompt discovery questions'
description: |
  Prompt asks the model to print, repeat or reveal its system prompt or hidden instructions, including the 'repeat the words above starting with You are' trick.

  MITRE ATLAS tactics: AML.TA0008. Techniques: AML.T0069.002 (primary), AML.T0056 (secondary), AML.T0040 (precondition). Mitigations: AML.M0020, AML.M0021.
  ABM behavior BHV-LK-003: status test, severity medium, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-LK-003 | System-prompt discovery questions
  // ATLAS tactics: AML.TA0008 | techniques: AML.T0069.002(primary), AML.T0056(secondary), AML.T0040(precondition)
  // severity=medium confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-LK-003.yaml. Do not edit.
  AIGatewayLogs_CL
  | where Prompt matches regex @"(?i)\b(what|repeat|print|show|output|display|reveal)\b.{0,30}\b(your|the)\s+(system\s+prompt|initial\s+instructions|hidden\s+(rules|instructions)|developer\s+message|pre-?prompt)\b"
      or Prompt matches regex @"(?i)\brepeat\s+(all\s+)?(the\s+)?(words|text|everything)\s+above\b"
      or Prompt matches regex @"(?i)\bstart(ing)?\s+with\s+[\""']?you\s+are\b"
  | extend BehaviorId = "BHV-LK-003", AtlasTechnique = "AML.T0069.002",
           AtlasTactics = dynamic(["AML.TA0008"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0069.002,AML.T0056,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "increment_risk", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "delta", 10), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
