id: 03c51933-e9ca-5035-946f-2a436af0a2b4
name: 'BHV-CA-004: Agent tool requests cloud instance-metadata credentials'
description: |
  An agent fetch or shell tool targets a cloud instance-metadata or container-credential endpoint (169.254.169.254, metadata.google.internal, fd00:ec2::254, 169.254.170.2). This is server-side request forgery through the agent to steal the host's role credentials.

  MITRE ATLAS tactics: AML.TA0013. Techniques: AML.T0106 (primary). Mitigations: AML.M0032, AML.M0028.
  ABM behavior BHV-CA-004: status test, severity critical, confidence high.
  False positives: Infrastructure agents that read instance metadata by design (use SDK credentials instead).
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- CredentialAccess
relevantTechniques:
- T1552.005
query: |
  // BHV-CA-004 | Agent tool requests cloud instance-metadata credentials
  // ATLAS tactics: AML.TA0013 | techniques: AML.T0106(primary)
  // severity=critical confidence=high status=test
  // GENERATED by atlas-behavior-map from BHV-CA-004.yaml. Do not edit.
  AIAgentToolCalls_CL
  | where ToolName in ("web.fetch", "http.request", "http.get", "browser.open", "shell.exec", "code_interpreter.run", "terminal.run")
  | where ToolArgs matches regex @"169\.254\.169\.254"
      or ToolArgs matches regex @"169\.254\.170\.2\b"
      or ToolArgs matches regex @"(?i)\bmetadata\.google\.internal\b"
      or ToolArgs matches regex @"(?i)\bfd00:ec2::254\b"
      or ToolArgs matches regex @"100\.100\.100\.200"
  | extend BehaviorId = "BHV-CA-004", AtlasTechnique = "AML.T0106",
           AtlasTactics = dynamic(["AML.TA0013"]), Severity = "critical"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0106"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "deny_tool_call", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "kill_session", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "session", "status", "auto"),
      bag_pack("action", "rotate_credentials", "params", bag_pack("scope", "agent-host-role"), "requires_approval", true, "reversible", true, "blast_radius", "service", "status", "awaiting_approval"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P1"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
