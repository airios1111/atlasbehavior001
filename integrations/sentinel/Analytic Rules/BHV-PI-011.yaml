id: 416fc767-4643-515c-9afc-bc4995e4d9ff
name: 'BHV-PI-011: Injection submitted through a public-facing form, review or ticket'
description: |
  Content from public channels (web forms, product reviews, support tickets) that later reaches an LLM contains override phrasing or orders addressed to the assistant.

  MITRE ATLAS tactics: AML.TA0004, AML.TA0006. Techniques: AML.T0093 (primary), AML.T0051.001 (secondary). Mitigations: AML.M0020, AML.M0015.
  ABM behavior BHV-PI-011: status test, severity high, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-PI-011 | Injection submitted through a public-facing form, review or ticket
  // ATLAS tactics: AML.TA0004, AML.TA0006 | techniques: AML.T0093(primary), AML.T0051.001(secondary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-PI-011.yaml. Do not edit.
  AIGatewayLogs_CL
  | where Channel in ("web_form", "product_review", "support_ticket")
  | where UserContent matches regex @"(?i)\b(ignore|disregard|override)\b.{0,30}\b(previous|prior|above|system|all)\b.{0,20}\b(instructions?|rules|prompt)\b"
      or UserContent matches regex @"(?i)\b(ai|assistant|bot|model)\s*[:,]\s*(you\s+must|please)\s+(now\s+)?(approve|escalate|refund|mark|classify|rate)\b"
  | extend BehaviorId = "BHV-PI-011", AtlasTechnique = "AML.T0093",
           AtlasTactics = dynamic(["AML.TA0004", "AML.TA0006"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0093,AML.T0051.001"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "strip_content", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P3"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
