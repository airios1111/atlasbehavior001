id: f16ef204-8ce7-5b35-aab4-fa89ff312c1e
name: 'BHV-DSC-006: Inference request asks for hidden model outputs (scores, logits, hidden states)'
description: |
  A request to a model-serving endpoint asks for outputs the client application never uses: raw scores, logits, probabilities, hidden states, attentions or debug output. Those extra outputs are what model-extraction and inversion attacks need.

  MITRE ATLAS tactics: AML.TA0008. Techniques: AML.T0063 (primary). Mitigations: AML.M0002, AML.M0019.
  ABM behavior BHV-DSC-006: status test, severity high, confidence medium.
  False positives: New client releases that legitimately consume scores.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-DSC-006 | Inference request asks for hidden model outputs (scores, logits, hidden states)
  // ATLAS tactics: AML.TA0008 | techniques: AML.T0063(primary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-DSC-006.yaml. Do not edit.
  AIInferenceLogs_CL
  | where ClientApp !in ("ml-eval", "model-monitoring")
  | where RequestParamKeys matches regex @"(?i)(^|,)\s*(return_(logits|scores|probabilities|hidden_states|attentions|embeddings)|output_(scores|logits|hidden_states|attentions)|include_(scores|probabilities|debug)|debug|verbose_output|raw_scores)\s*(,|$)"
  | extend BehaviorId = "BHV-DSC-006", AtlasTechnique = "AML.T0063",
           AtlasTactics = dynamic(["AML.TA0008"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0063"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "degrade_output", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "mode", "label_only", "ttl", "24h"), "requires_approval", false, "reversible", true, "blast_radius", "model", "status", "auto"),
      bag_pack("action", "increment_risk", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "delta", 15), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
