id: 6466923c-7fde-567a-8e08-85c0ae5bd74a
name: 'BHV-CA-001: Secrets pasted into an LLM prompt'
description: |
  A prompt contains live credential material: cloud access keys, GitHub or Slack tokens, API secret keys, private keys or connection-string passwords. The secret now sits in gateway and provider logs, outside the vault that should hold it.

  MITRE ATLAS tactics: AML.TA0013. Techniques: AML.T0055 (primary). Mitigations: AML.M0020, AML.M0018.
  ABM behavior BHV-CA-001: status test, severity high, confidence medium.
  False positives: Documentation example keys such as AKIAIOSFODNN7EXAMPLE.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- CredentialAccess
relevantTechniques:
- T1552
query: |
  // BHV-CA-001 | Secrets pasted into an LLM prompt
  // ATLAS tactics: AML.TA0013 | techniques: AML.T0055(primary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-CA-001.yaml. Do not edit.
  AIGatewayLogs_CL
  | where Prompt matches regex @"\b(AKIA|ASIA)[0-9A-Z]{16}\b"
      or Prompt matches regex @"\bgh[pousr]_[A-Za-z0-9]{36}\b"
      or Prompt matches regex @"\bxox[abposr]-[A-Za-z0-9-]{10,}"
      or Prompt matches regex @"-----BEGIN ([A-Z]+ )?PRIVATE KEY-----"
      or Prompt matches regex @"\bsk-(proj-)?[A-Za-z0-9_-]{32,}\b"
      or Prompt matches regex @"\bAIza[0-9A-Za-z_-]{35}\b"
      or Prompt matches regex @"(?i)\b(AccountKey|SharedAccessKey|Password|Pwd)=[^;\s<>]{8,}"
  | extend BehaviorId = "BHV-CA-001", AtlasTechnique = "AML.T0055",
           AtlasTactics = dynamic(["AML.TA0013"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0055"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "block_request", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "rotate_credentials", "params", bag_pack("scope", "exposed-in-prompt"), "requires_approval", true, "reversible", true, "blast_radius", "service", "status", "awaiting_approval"),
      bag_pack("action", "notify", "params", bag_pack("channel", "secops"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
