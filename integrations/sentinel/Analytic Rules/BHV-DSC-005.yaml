id: dfd6aaa1-9ed6-5492-aa94-383097df88bf
name: 'BHV-DSC-005: One principal enumerates many AI artifacts in an hour'
description: |
  In one hour a principal lists or describes at least 25 distinct models, model versions, datasets or endpoints through the cloud control plane. Someone is mapping what AI assets exist before choosing what to steal or tamper with.

  MITRE ATLAS tactics: AML.TA0008. Techniques: AML.T0007 (primary). Mitigations: AML.M0005, AML.M0019.
  ABM behavior BHV-DSC-005: status test, severity medium, confidence medium.
  False positives: Inventory, FinOps or CSPM scanners (allowlist their principals).
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- Discovery
relevantTechniques:
- T1526
query: |
  // BHV-DSC-005 | One principal enumerates many AI artifacts in an hour
  // ATLAS tactics: AML.TA0008 | techniques: AML.T0007(primary)
  // severity=medium confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-DSC-005.yaml. Do not edit.
  AICloudAuditEvents_CL
  | where TimeGenerated > ago(1h)
  | where Operation in ("list", "describe", "get_metadata")
  | where ResourceType in ("model", "model_version", "dataset", "endpoint", "training_job")
  | summarize Calls = count(),
              DistinctResources = dcount(ResourceId)
            by PrincipalId, bin(TimeGenerated, 1h)
  | where DistinctResources >= 25
  | extend BehaviorId = "BHV-DSC-005", AtlasTechnique = "AML.T0007",
           AtlasTactics = dynamic(["AML.TA0008"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0007"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "increment_risk", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "delta", 15), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "soc"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
