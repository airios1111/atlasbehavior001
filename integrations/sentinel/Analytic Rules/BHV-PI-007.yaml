id: 523b9995-b212-58e9-ba5d-7776eab30332
name: 'BHV-PI-007: Hidden HTML text carrying instructions in retrieved page'
description: |
  Retrieved HTML hides instruction-bearing text with CSS (display:none, zero font size, zero opacity) or HTML comments, so the model reads text the user never sees.

  MITRE ATLAS tactics: AML.TA0005. Techniques: AML.T0051.001 (primary), AML.T0066 (secondary). Mitigations: AML.M0020, AML.M0030.
  ABM behavior BHV-PI-007: status test, severity high, confidence medium.
  False positives: Accessibility text hidden for screen readers that mentions 'assistant'.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-PI-007 | Hidden HTML text carrying instructions in retrieved page
  // ATLAS tactics: AML.TA0005 | techniques: AML.T0051.001(primary), AML.T0066(secondary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-PI-007.yaml. Do not edit.
  AIRetrievalLogs_CL
  | where RawHtml matches regex @"(?i)style\s*=\s*""[^""]*(display\s*:\s*none|font-size\s*:\s*0|opacity\s*:\s*0)[^""]*""[^>]*>[^<]{0,300}\b(ignore|instructions?|assistant|you\s+must)\b"
      or RawHtml matches regex @"(?i)<!--[^>]{0,300}\b(ignore\s+(all|previous|prior)|assistant\s*:|system\s*:)"
  | extend BehaviorId = "BHV-PI-007", AtlasTechnique = "AML.T0051.001",
           AtlasTactics = dynamic(["AML.TA0005"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0051.001,AML.T0066"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "strip_content", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "quarantine_source", "params", bag_pack("source", coalesce(tostring(SourceUri), "{{source_uri}}")), "requires_approval", true, "reversible", true, "blast_radius", "source", "status", "awaiting_approval")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
