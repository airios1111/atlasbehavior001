id: 95ffbba2-3fba-564b-83d0-ad99157e02e9
name: 'BHV-COL-004: Bulk export of all users'' AI chat histories'
description: |
  An admin operation exports conversation history for all users of an AI service, run by a principal outside the compliance and e-discovery roles. Chat logs hold pasted documents, secrets and personal data.

  MITRE ATLAS tactics: AML.TA0009. Techniques: AML.T0085 (primary). Mitigations: AML.M0019, AML.M0005.
  ABM behavior BHV-COL-004: status test, severity high, confidence high.
  False positives: Legal-hold exports by a compliance role not yet in the list.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-COL-004 | Bulk export of all users' AI chat histories
  // ATLAS tactics: AML.TA0009 | techniques: AML.T0085(primary)
  // severity=high confidence=high status=test
  // GENERATED by atlas-behavior-map from BHV-COL-004.yaml. Do not edit.
  AICloudAuditEvents_CL
  | where Operation in ("conversations.export", "chat_history.export", "compliance.export")
  | where Scope == "all_users"
  | where PrincipalRole !in ("compliance-officer", "ediscovery-admin")
  | extend BehaviorId = "BHV-COL-004", AtlasTechnique = "AML.T0085",
           AtlasTactics = dynamic(["AML.TA0009"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0085"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "revoke_token", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}")), "requires_approval", true, "reversible", true, "blast_radius", "principal", "status", "awaiting_approval"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P1"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
