id: a6e70b08-68a7-5cd8-b27c-07b75d3b60ce
name: 'BHV-AG-006: Agent issues destructive data operations'
description: |
  Agent SQL or shell calls drop or truncate tables, delete without a WHERE clause, or rm -rf broad paths.

  MITRE ATLAS tactics: AML.TA0011. Techniques: AML.T0101 (primary). Mitigations: AML.M0029, AML.M0026.
  ABM behavior BHV-AG-006: status test, severity critical, confidence high.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-AG-006 | Agent issues destructive data operations
  // ATLAS tactics: AML.TA0011 | techniques: AML.T0101(primary)
  // severity=critical confidence=high status=test
  // GENERATED by atlas-behavior-map from BHV-AG-006.yaml. Do not edit.
  AIAgentToolCalls_CL
  | where ToolName in ("sql.execute", "db.query", "shell.exec", "code_interpreter.run", "terminal.run")
  | where ToolArgs matches regex @"(?i)\bdrop\s+(table|database|schema)\b"
      or ToolArgs matches regex @"(?i)\btruncate\s+(table\s+)?\w+"
      or ToolArgs matches regex @"(?i)\bdelete\s+from\s+[\w.\""]+\s*;?\s*$"
      or ToolArgs matches regex @"(?i)\brm\s+-(rf|fr)\s+(/|~|\*|\.)"
  | extend BehaviorId = "BHV-AG-006", AtlasTechnique = "AML.T0101",
           AtlasTactics = dynamic(["AML.TA0011"]), Severity = "critical"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0101"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "deny_tool_call", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "kill_session", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "session", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P1"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
