id: 3815b28d-a4b6-5ab2-b803-635fab12e12c
name: 'BHV-DOS-003: Unbounded repetition / output-expansion prompt'
description: |
  Prompt asks the model to repeat a word or string forever, or to write something thousands of times, which ties up decoding capacity (and can leak training data).

  MITRE ATLAS tactics: AML.TA0011. Techniques: AML.T0029 (primary), AML.T0034.001 (secondary), AML.T0040 (precondition). Mitigations: AML.M0004, AML.M0020.
  ABM behavior BHV-DOS-003: status test, severity medium, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-DOS-003 | Unbounded repetition / output-expansion prompt
  // ATLAS tactics: AML.TA0011 | techniques: AML.T0029(primary), AML.T0034.001(secondary), AML.T0040(precondition)
  // severity=medium confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-DOS-003.yaml. Do not edit.
  AIGatewayLogs_CL
  | where Prompt matches regex @"(?i)\b(repeat|say|print|output)\s+(the\s+)?(word|phrase|letter|string|this)\b.{0,40}\b(forever|infinitely|endlessly|non-?stop|\d{4,}\s+times)\b"
      or Prompt matches regex @"(?i)\bwrite\b.{0,30}\b\d{5,}\s+times\b"
  | extend BehaviorId = "BHV-DOS-003", AtlasTechnique = "AML.T0029",
           AtlasTactics = dynamic(["AML.TA0011"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0029,AML.T0034.001,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "cap_tokens", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}"), "max_output", 512), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "block_request", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto")))
