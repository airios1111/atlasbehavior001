id: b889c09d-f545-585b-a636-a1a04e56b0bb
name: 'BHV-CH-002: API key spending from several networks at once'
description: |
  One API key spends more than $50 in an hour from three or more distinct ASNs, which fits a stolen key being used to harvest compute.

  MITRE ATLAS tactics: AML.TA0011. Techniques: AML.T0034.000 (primary), AML.T0012 (secondary). Mitigations: AML.M0004, AML.M0019.
  ABM behavior BHV-CH-002: status test, severity high, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-CH-002 | API key spending from several networks at once
  // ATLAS tactics: AML.TA0011 | techniques: AML.T0034.000(primary), AML.T0012(secondary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-CH-002.yaml. Do not edit.
  AIGatewayLogs_CL
  | where TimeGenerated > ago(1h)
  | summarize SpendUsd = sum(CostUsd),
              Asns = dcount(ClientAsn)
            by PrincipalId, bin(TimeGenerated, 1h)
  | where SpendUsd > 50 and Asns >= 3
  | extend BehaviorId = "BHV-CH-002", AtlasTechnique = "AML.T0034.000",
           AtlasTactics = dynamic(["AML.TA0011"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0034.000,AML.T0012"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "revoke_token", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}")), "requires_approval", true, "reversible", true, "blast_radius", "principal", "status", "awaiting_approval"),
      bag_pack("action", "notify", "params", bag_pack("channel", "finops-soc"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
