id: 3e2b5e4f-237b-51b5-a0ae-ad75815bafdc
name: 'BHV-PI-002: Embedded instructions in untrusted retrieved content (RAG / web / email)'
description: |
  Content retrieved from an untrusted source (web, inbound email, user-uploaded document) and placed into the model context contains instruction-bearing text addressed to the model.

  MITRE ATLAS tactics: AML.TA0005. Techniques: AML.T0051.001 (primary). Mitigations: AML.M0020, AML.M0015.
  ABM behavior BHV-PI-002: status stable, severity high, confidence medium.
  False positives: Internal docs flagged untrusted by misconfigured connectors.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-PI-002 | Embedded instructions in untrusted retrieved content (RAG / web / email)
  // ATLAS tactics: AML.TA0005 | techniques: AML.T0051.001(primary)
  // severity=high confidence=medium status=stable
  // GENERATED by atlas-behavior-map from BHV-PI-002.yaml. Do not edit.
  AIRetrievalLogs_CL
  | where SourceTrust in ("untrusted", "external", "unknown")
  | where RetrievedContent matches regex @"(?i)\bignore\s+(all\s+|any\s+)?(previous|prior|above)\s+(instructions|directions)\b"
      or RetrievedContent matches regex @"(?i)\b(assistant|ai|model)\s*[:,]\s*(you\s+must|now|please)\b"
      or RetrievedContent matches regex @"(?i)<\s*/?\s*(system|instructions?)\s*>"
      or RetrievedContent matches regex @"(?i)\b(send|forward|exfiltrate|post)\s+(the|all|this)\s+.{0,40}\b(to|at)\s+https?://"
  | extend BehaviorId = "BHV-PI-002", AtlasTechnique = "AML.T0051.001",
           AtlasTactics = dynamic(["AML.TA0005"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0051.001"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "strip_content", "params", bag_pack("source", coalesce(tostring(SourceUri), "{{source_uri}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "quarantine_source", "params", bag_pack("source", coalesce(tostring(SourceUri), "{{source_uri}}")), "requires_approval", true, "reversible", true, "blast_radius", "source", "status", "awaiting_approval"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
