id: d003d19e-9cb0-5a71-8e7a-71406421a2af
name: 'BHV-RC-001: AI endpoint path enumeration from one client'
description: |
  One client IP gets 401/403/404/405 responses on at least 15 distinct AI-serving paths (OpenAI-compatible, Ollama, Triton, SageMaker, Gradio) within 10 minutes. Someone is scanning for exposed model servers.

  MITRE ATLAS tactics: AML.TA0002. Techniques: AML.T0006 (primary). Mitigations: AML.M0019, AML.M0004.
  ABM behavior BHV-RC-001: status test, severity medium, confidence medium.
  False positives: External attack-surface scanners you run (allowlist their IPs).
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 10m
queryPeriod: 10m
triggerOperator: gt
triggerThreshold: 0
tactics:
- Reconnaissance
relevantTechniques:
- T1595.003
query: |
  // BHV-RC-001 | AI endpoint path enumeration from one client
  // ATLAS tactics: AML.TA0002 | techniques: AML.T0006(primary)
  // severity=medium confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-RC-001.yaml. Do not edit.
  AIInferenceLogs_CL
  | where TimeGenerated > ago(10m)
  | where StatusCode in (401, 403, 404, 405)
  | summarize Errors = count(),
              DistinctPaths = dcount(RequestPath)
            by ClientIp, bin(TimeGenerated, 10m)
  | where DistinctPaths >= 15 and Errors >= 30
  | extend BehaviorId = "BHV-RC-001", AtlasTechnique = "AML.T0006",
           AtlasTactics = dynamic(["AML.TA0002"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0006"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "rate_limit", "params", bag_pack("principal", strcat("ip:", coalesce(tostring(ClientIp), "{{client_ip}}")), "limit", "0/min", "ttl", "24h"), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "soc"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: ClientIp
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
