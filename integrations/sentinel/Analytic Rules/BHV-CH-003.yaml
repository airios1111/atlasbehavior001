id: dd0b4695-0058-5494-9db5-d7fc802bb731
name: 'BHV-CH-003: API key fanned out to many client IPs (proxy resale)'
description: |
  More than 500 requests from more than 50 client IPs on one key within an hour. The key is being resold through an AI service proxy (LLMjacking).

  MITRE ATLAS tactics: AML.TA0011. Techniques: AML.T0034.000 (primary), AML.T0008.005 (secondary). Mitigations: AML.M0004, AML.M0019.
  ABM behavior BHV-CH-003: status test, severity high, confidence medium.
  False positives: Browser-side apps calling the gateway directly (use per-user keys).
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-CH-003 | API key fanned out to many client IPs (proxy resale)
  // ATLAS tactics: AML.TA0011 | techniques: AML.T0034.000(primary), AML.T0008.005(secondary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-CH-003.yaml. Do not edit.
  AIGatewayLogs_CL
  | where TimeGenerated > ago(1h)
  | summarize Requests = count(),
              ClientIps = dcount(ClientIp)
            by PrincipalId, bin(TimeGenerated, 1h)
  | where Requests > 500 and ClientIps > 50
  | extend BehaviorId = "BHV-CH-003", AtlasTechnique = "AML.T0034.000",
           AtlasTactics = dynamic(["AML.TA0011"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0034.000,AML.T0008.005"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "revoke_token", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}")), "requires_approval", true, "reversible", true, "blast_radius", "principal", "status", "awaiting_approval"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
