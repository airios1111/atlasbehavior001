id: d5c5fdcb-2b0b-5914-9328-99a2bc8ee300
name: 'BHV-PO-001: Training data distribution shift at ingest'
description: |
  A dataset batch entering a training pipeline shows significant distribution shift (PSI) against the reference snapshot, consistent with injected or manipulated training samples.

  MITRE ATLAS tactics: AML.TA0003, AML.TA0006. Techniques: AML.T0020 (primary). Mitigations: AML.M0007, AML.M0014.
  ABM behavior BHV-PO-001: status test, severity high, confidence medium.
  False positives: Legitimate seasonal or product-driven data drift (correlate with change tickets).
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-PO-001 | Training data distribution shift at ingest
  // ATLAS tactics: AML.TA0003, AML.TA0006 | techniques: AML.T0020(primary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-PO-001.yaml. Do not edit.
  AITrainingPipelineEvents_CL
  | where EventType == "dataset_ingest"
  | where DistributionShiftPsi > 0.25
  | extend BehaviorId = "BHV-PO-001", AtlasTechnique = "AML.T0020",
           AtlasTactics = dynamic(["AML.TA0003", "AML.TA0006"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0020"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "halt_pipeline", "params", bag_pack("pipeline", coalesce(tostring(PipelineId), "{{pipeline_id}}"), "batch", coalesce(tostring(BatchId), "{{batch_id}}")), "requires_approval", true, "reversible", true, "blast_radius", "pipeline", "status", "awaiting_approval"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "ml-platform"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
