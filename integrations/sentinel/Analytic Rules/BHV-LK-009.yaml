id: ac4b25b2-648c-573f-b464-fdff909878af
name: 'BHV-LK-009: RAG index enumeration by one principal'
description: |
  In one hour a principal's queries retrieve more than 200 distinct documents across more than 50 queries. Someone is systematically walking the index.

  MITRE ATLAS tactics: AML.TA0009. Techniques: AML.T0085.000 (primary), AML.T0064 (secondary). Mitigations: AML.M0004, AML.M0019.
  ABM behavior BHV-LK-009: status test, severity high, confidence medium.
  False positives: Indexing / evaluation service accounts.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-LK-009 | RAG index enumeration by one principal
  // ATLAS tactics: AML.TA0009 | techniques: AML.T0085.000(primary), AML.T0064(secondary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-LK-009.yaml. Do not edit.
  AIRetrievalLogs_CL
  | where TimeGenerated > ago(1h)
  | summarize Queries = dcount(QueryId),
              DistinctDocs = dcount(DocId)
            by PrincipalId, bin(TimeGenerated, 1h)
  | where Queries > 50 and DistinctDocs > 200
  | extend BehaviorId = "BHV-LK-009", AtlasTechnique = "AML.T0085.000",
           AtlasTactics = dynamic(["AML.TA0009"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0085.000,AML.T0064"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "rate_limit", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "limit", "10/min", "ttl", "12h"), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P3"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
