id: 807fa24f-95da-5d0a-999c-105f961a2ccb
name: 'BHV-C2-001: Agent beacons to an external host at fixed intervals'
description: |
  An agent calls the same non-allowlisted destination at least 10 times in an hour at near-constant spacing: inter-arrival variance under 4 s² and a mean gap of at least 30 s. inter_arrival_s is the normalizer's seconds since that agent's previous call to that destination. A compromised agent is polling for tasking.

  MITRE ATLAS tactics: AML.TA0014. Techniques: AML.T0108 (primary). Mitigations: AML.M0032, AML.M0028.
  ABM behavior BHV-C2-001: status test, severity high, confidence medium.
  False positives: Scheduled agents polling a feed that is not yet allowlisted; Jittered beacons evade this; pair with destination reputation.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- CommandAndControl
relevantTechniques:
- T1071.001
query: |
  // BHV-C2-001 | Agent beacons to an external host at fixed intervals
  // ATLAS tactics: AML.TA0014 | techniques: AML.T0108(primary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-C2-001.yaml. Do not edit.
  AIAgentToolCalls_CL
  | where TimeGenerated > ago(1h)
  | where DestinationAllowlisted == false
  | where ToolName in ("web.fetch", "http.request", "http.get", "browser.open")
  | summarize Calls = count(),
              IntervalVariance = variance(InterArrivalS),
              MeanInterval = avg(InterArrivalS)
            by AgentId, DestinationDomain, bin(TimeGenerated, 1h)
  | where Calls >= 10 and IntervalVariance < 4 and MeanInterval >= 30
  | extend BehaviorId = "BHV-C2-001", AtlasTechnique = "AML.T0108",
           AtlasTactics = dynamic(["AML.TA0014"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0108"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P1"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "agent-platform"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
customDetails:
  BehaviorId: BehaviorId
