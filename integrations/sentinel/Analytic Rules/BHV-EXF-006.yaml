id: 899407b4-3b9a-5414-85ee-29c6f9467b06
name: 'BHV-EXF-006: Bulk model-weight downloads by one principal'
description: |
  One principal downloads more than 20 GB of model weights from the registry within an hour. The deployment service account is excluded.

  MITRE ATLAS tactics: AML.TA0010. Techniques: AML.T0025 (primary), AML.T0035 (secondary). Mitigations: AML.M0005, AML.M0001.
  ABM behavior BHV-EXF-006: status test, severity high, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-EXF-006 | Bulk model-weight downloads by one principal
  // ATLAS tactics: AML.TA0010 | techniques: AML.T0025(primary), AML.T0035(secondary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-EXF-006.yaml. Do not edit.
  AIModelRegistryEvents_CL
  | where TimeGenerated > ago(1h)
  | where EventType == "artifact_download"
  | where ArtifactType == "model_weights"
  | where PrincipalId !in ("svc-model-deployer")
  | summarize Downloads = count(),
              TotalGb = sum(SizeGb)
            by PrincipalId, bin(TimeGenerated, 1h)
  | where TotalGb > 20
  | extend BehaviorId = "BHV-EXF-006", AtlasTechnique = "AML.T0025",
           AtlasTactics = dynamic(["AML.TA0010"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0025,AML.T0035"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "revoke_token", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}")), "requires_approval", true, "reversible", true, "blast_radius", "principal", "status", "awaiting_approval"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
