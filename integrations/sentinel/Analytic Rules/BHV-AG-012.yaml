id: 71eb729d-5cad-5ca8-8c0a-eb880d441b52
name: 'BHV-AG-012: Agent enumerates cloud services'
description: |
  Within 15 minutes an agent session calls more than 20 distinct cloud CLI/API list or describe operations, mapping the cloud estate.

  MITRE ATLAS tactics: AML.TA0008. Techniques: AML.T0075 (primary). Mitigations: AML.M0026, AML.M0032.
  ABM behavior BHV-AG-012: status test, severity medium, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 15m
queryPeriod: 15m
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-AG-012 | Agent enumerates cloud services
  // ATLAS tactics: AML.TA0008 | techniques: AML.T0075(primary)
  // severity=medium confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-AG-012.yaml. Do not edit.
  AIAgentToolCalls_CL
  | where TimeGenerated > ago(15m)
  | where ToolName in ("cloud.cli", "aws.cli", "az.cli", "gcloud.cli")
  | summarize Calls = count(),
              DistinctApis = dcount(CloudApi)
            by SessionId, bin(TimeGenerated, 15m)
  | where DistinctApis > 20
  | extend BehaviorId = "BHV-AG-012", AtlasTechnique = "AML.T0075",
           AtlasTactics = dynamic(["AML.TA0008"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0075"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "kill_session", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "session", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
