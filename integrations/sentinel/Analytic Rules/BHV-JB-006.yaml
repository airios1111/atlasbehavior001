id: aec50293-e2d9-5556-b2e0-94ce66fcee1f
name: 'BHV-JB-006: Fiction or hypothetical framing for prohibited instructions'
description: |
  Prompt wraps a request for step-by-step harmful instructions (weapons, malware, drug synthesis) in a hypothetical or fictional frame.

  MITRE ATLAS tactics: AML.TA0012, AML.TA0007. Techniques: AML.T0054 (primary), AML.T0040 (precondition). Mitigations: AML.M0020, AML.M0022.
  ABM behavior BHV-JB-006: status test, severity high, confidence low.
  False positives: Creative-writing apps; pair with a harm classifier.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-JB-006 | Fiction or hypothetical framing for prohibited instructions
  // ATLAS tactics: AML.TA0012, AML.TA0007 | techniques: AML.T0054(primary), AML.T0040(precondition)
  // severity=high confidence=low status=test
  // GENERATED by atlas-behavior-map from BHV-JB-006.yaml. Do not edit.
  AIGatewayLogs_CL
  | where Prompt matches regex @"(?i)\b(hypothetical(ly)?|in\s+a\s+fictional\s+(world|story)|for\s+a\s+(novel|screenplay))\b.{0,80}\b(step[- ]by[- ]step|detailed\s+instructions|exact\s+recipe)\b.{0,60}\b(weapon|explosive|malware|ransomware|synthesi[sz]e|meth)"
  | extend BehaviorId = "BHV-JB-006", AtlasTechnique = "AML.T0054",
           AtlasTactics = dynamic(["AML.TA0012", "AML.TA0007"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0054,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "block_request", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "increment_risk", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "delta", 15), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
