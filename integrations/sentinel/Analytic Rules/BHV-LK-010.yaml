name: 'BHV-LK-010: Credential-harvesting queries against the RAG index'
description: |
  Retrieval queries ask to list or dump passwords, API keys, secrets or connection strings stored in indexed documents.

  MITRE ATLAS tactics: AML.TA0013. Techniques: AML.T0082 (primary). Mitigations: AML.M0019, AML.M0012.
  ABM behavior BHV-LK-010: status test, severity high, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-LK-010 | Credential-harvesting queries against the RAG index
  // ATLAS tactics: AML.TA0013 | techniques: AML.T0082(primary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-LK-010.yaml. Do not edit.
  AIRetrievalLogs_CL
  | where Query matches regex @"(?i)\b(list|dump|find\s+all|show\s+all|give\s+me\s+all|extract)\b.{0,40}\b(passwords|api[\s_-]?keys|secrets|credentials|access\s+tokens|private\s+keys|connection\s+strings)\b"
  | extend BehaviorId = "BHV-LK-010", AtlasTechnique = "AML.T0082",
           AtlasTactics = dynamic(["AML.TA0013"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0082"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "block_request", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "increment_risk", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "delta", 30), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
