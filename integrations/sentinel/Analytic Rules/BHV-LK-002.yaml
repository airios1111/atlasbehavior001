id: a6d7126c-db9d-5895-855f-614be9864f84
name: 'BHV-LK-002: Sensitive data (PII / secrets) in model completion'
description: |
  Model output contains high-signal sensitive data patterns: US SSN, payment card numbers, cloud access keys or private key material. Signature floor; production should chain a DLP service with checksum (Luhn) validation.

  MITRE ATLAS tactics: AML.TA0010. Techniques: AML.T0057 (primary). Mitigations: AML.M0020, AML.M0019.
  ABM behavior BHV-LK-002: status stable, severity critical, confidence medium.
  False positives: Documented test values (e.g. 4111 1111 1111 1111) in developer-assist sessions; Formatted IDs that resemble SSNs (scope by app).
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-LK-002 | Sensitive data (PII / secrets) in model completion
  // ATLAS tactics: AML.TA0010 | techniques: AML.T0057(primary)
  // severity=critical confidence=medium status=stable
  // GENERATED by atlas-behavior-map from BHV-LK-002.yaml. Do not edit.
  AIGatewayLogs_CL
  | where Completion matches regex @"\b\d{3}-\d{2}-\d{4}\b"
      or Completion matches regex @"\b(4\d{3}|5[1-5]\d{2}|3[47]\d{2})[ -]?\d{4}[ -]?\d{4}[ -]?\d{3,4}\b"
      or Completion matches regex @"\b(AKIA|ASIA)[0-9A-Z]{16}\b"
      or Completion matches regex @"-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----"
      or Completion matches regex @"\bxox[baprs]-[0-9A-Za-z-]{10,}\b"
  | extend BehaviorId = "BHV-LK-002", AtlasTechnique = "AML.T0057",
           AtlasTactics = dynamic(["AML.TA0010"]), Severity = "critical"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0057"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "redact_output", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P1"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "privacy-office"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
