id: b5cff618-8e84-5503-a77f-6473daa560cc
name: 'BHV-RD-004: Public model imported from a namespace that mimics a trusted publisher'
description: |
  A model imported from a public hub comes from a publisher that is not allowlisted but whose name is at least 85% similar to an allowlisted publisher (for example a homoglyph of a well-known lab). Poisoned models are published under lookalike names. Experimental until the similarity threshold is calibrated.

  MITRE ATLAS tactics: AML.TA0003. Techniques: AML.T0058 (primary), AML.T0010.003 (secondary). Mitigations: AML.M0014, AML.M0023.
  ABM behavior BHV-RD-004: status experimental, severity high, confidence low.
  False positives: Unrelated publishers with naturally similar names.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-RD-004 | Public model imported from a namespace that mimics a trusted publisher
  // ATLAS tactics: AML.TA0003 | techniques: AML.T0058(primary), AML.T0010.003(secondary)
  // severity=high confidence=low status=experimental
  // GENERATED by atlas-behavior-map from BHV-RD-004.yaml. Do not edit.
  AIModelRegistryEvents_CL
  | where EventType == "model_import"
  | where PublisherAllowlisted == false
  | where PublisherSimilarityToAllowlisted >= 0.85
  | extend BehaviorId = "BHV-RD-004", AtlasTechnique = "AML.T0058",
           AtlasTactics = dynamic(["AML.TA0003"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0058,AML.T0010.003"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "block_deploy", "params", bag_pack("artifact", coalesce(tostring(ArtifactId), "{{artifact_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "service", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "ml-platform"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
