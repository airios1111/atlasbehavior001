name: 'BHV-SC-005: Unsigned container image deployed for inference'
description: |
  An inference workload is deployed from a container image whose signature is missing or invalid.

  MITRE ATLAS tactics: AML.TA0004. Techniques: AML.T0010.004 (primary). Mitigations: AML.M0013, AML.M0014.
  ABM behavior BHV-SC-005: status test, severity high, confidence high.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-SC-005 | Unsigned container image deployed for inference
  // ATLAS tactics: AML.TA0004 | techniques: AML.T0010.004(primary)
  // severity=high confidence=high status=test
  // GENERATED by atlas-behavior-map from BHV-SC-005.yaml. Do not edit.
  AICloudAuditEvents_CL
  | where EventType == "container_deploy"
  | where WorkloadType == "inference"
  | where ImageSignatureStatus != "valid"
  | extend BehaviorId = "BHV-SC-005", AtlasTechnique = "AML.T0010.004",
           AtlasTactics = dynamic(["AML.TA0004"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0010.004"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "block_deploy", "params", bag_pack("artifact", coalesce(tostring(Image), "{{image}}")), "requires_approval", false, "reversible", true, "blast_radius", "service", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "platform-sec"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
