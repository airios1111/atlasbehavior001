id: 136bc913-f60f-5630-a90b-2e7e065debc1
name: 'BHV-EXF-010: Hyperlink in completion carrying encoded data'
description: |
  Completion contains a markdown link whose query string holds a 40+ character encoded value. If the user clicks it, conversation data leaves the environment.

  MITRE ATLAS tactics: AML.TA0010. Techniques: AML.T0077 (primary). Mitigations: AML.M0020, AML.M0033.
  ABM behavior BHV-EXF-010: status test, severity high, confidence medium.
  False positives: Long tracking parameters in legitimate links (allowlist domains).
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-EXF-010 | Hyperlink in completion carrying encoded data
  // ATLAS tactics: AML.TA0010 | techniques: AML.T0077(primary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-EXF-010.yaml. Do not edit.
  AIGatewayLogs_CL
  | where Completion matches regex @"(^|[^!])\[[^\]]+\]\(https?://[^)\s]*[?&][A-Za-z_]+=[A-Za-z0-9+/=%_-]{40,}\)"
  | extend BehaviorId = "BHV-EXF-010", AtlasTechnique = "AML.T0077",
           AtlasTactics = dynamic(["AML.TA0010"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0077"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "redact_output", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
