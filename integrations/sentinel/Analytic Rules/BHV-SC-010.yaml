name: 'BHV-SC-010: External dataset imported without signed provenance'
description: |
  A dataset from an external source enters the training pipeline without a signed provenance record.

  MITRE ATLAS tactics: AML.TA0004. Techniques: AML.T0010.002 (primary). Mitigations: AML.M0025, AML.M0023.
  ABM behavior BHV-SC-010: status test, severity medium, confidence high.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-SC-010 | External dataset imported without signed provenance
  // ATLAS tactics: AML.TA0004 | techniques: AML.T0010.002(primary)
  // severity=medium confidence=high status=test
  // GENERATED by atlas-behavior-map from BHV-SC-010.yaml. Do not edit.
  AITrainingPipelineEvents_CL
  | where EventType == "dataset_import"
  | where SourceExternal == true
  | where ProvenanceSigned == false
  | extend BehaviorId = "BHV-SC-010", AtlasTechnique = "AML.T0010.002",
           AtlasTactics = dynamic(["AML.TA0004"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0010.002"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "quarantine_artifact", "params", bag_pack("artifact", coalesce(tostring(DatasetId), "{{dataset_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "service", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "ml-data"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
customDetails:
  BehaviorId: BehaviorId
