id: 83563834-08ff-5bbd-8d4e-86ed5e3fc03c
name: 'BHV-EXF-012: Embedding inversion probing with near-identical inputs'
description: |
  More than 500 embedding requests in an hour whose inputs are almost identical to the previous one (similarity above 0.95). Systematic perturbation like this is used to invert embeddings back to text.

  MITRE ATLAS tactics: AML.TA0010. Techniques: AML.T0024.001 (primary), AML.T0040 (precondition). Mitigations: AML.M0002, AML.M0004.
  ABM behavior BHV-EXF-012: status test, severity medium, confidence low.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-EXF-012 | Embedding inversion probing with near-identical inputs
  // ATLAS tactics: AML.TA0010 | techniques: AML.T0024.001(primary), AML.T0040(precondition)
  // severity=medium confidence=low status=test
  // GENERATED by atlas-behavior-map from BHV-EXF-012.yaml. Do not edit.
  AIInferenceLogs_CL
  | where TimeGenerated > ago(1h)
  | where Endpoint == "embeddings"
  | summarize Requests = count(),
              AvgSimilarity = avg(InputSimilarityToPrev)
            by PrincipalId, bin(TimeGenerated, 1h)
  | where Requests > 500 and AvgSimilarity > 0.95
  | extend BehaviorId = "BHV-EXF-012", AtlasTechnique = "AML.T0024.001",
           AtlasTactics = dynamic(["AML.TA0010"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0024.001,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "rate_limit", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "limit", "30/min", "ttl", "12h"), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "ai-sec"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
