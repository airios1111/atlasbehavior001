id: bdef407b-f99a-5c29-a85c-53fb82463c94
name: 'BHV-AG-001: Agent tool invocation outside declared scope'
description: |
  An agent invokes a tool not in its declared manifest, or with a target outside its granted scope, typically following injected instructions.

  MITRE ATLAS tactics: AML.TA0005, AML.TA0012. Techniques: AML.T0053 (primary), AML.T0051.001 (precondition). Mitigations: AML.M0019, AML.M0020.
  ABM behavior BHV-AG-001: status test, severity high, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-AG-001 | Agent tool invocation outside declared scope
  // ATLAS tactics: AML.TA0005, AML.TA0012 | techniques: AML.T0053(primary), AML.T0051.001(precondition)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-AG-001.yaml. Do not edit.
  AIAgentToolCalls_CL
  | where ToolInScope == false
  | extend BehaviorId = "BHV-AG-001", AtlasTechnique = "AML.T0053",
           AtlasTactics = dynamic(["AML.TA0005", "AML.TA0012"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0053,AML.T0051.001"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "deny_tool_call", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}"), "tool", coalesce(tostring(ToolName), "{{tool_name}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "kill_session", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "session", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
