id: dbd8e832-7739-5d58-a7ac-889365a59a41
name: 'BHV-EXF-001: Membership-inference probing via repeated confidence queries'
description: |
  A principal repeatedly queries a small set of candidate records while requesting confidence scores / logprobs, consistent with testing whether specific records were in the training set.

  MITRE ATLAS tactics: AML.TA0010. Techniques: AML.T0024.000 (primary), AML.T0040 (precondition). Mitigations: AML.M0002, AML.M0004.
  ABM behavior BHV-EXF-001: status test, severity high, confidence low.
  False positives: Calibration / regression test suites re-scoring a fixed golden set.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-EXF-001 | Membership-inference probing via repeated confidence queries
  // ATLAS tactics: AML.TA0010 | techniques: AML.T0024.000(primary), AML.T0040(precondition)
  // severity=high confidence=low status=test
  // GENERATED by atlas-behavior-map from BHV-EXF-001.yaml. Do not edit.
  AIInferenceLogs_CL
  | where TimeGenerated > ago(1h)
  | summarize RequestCount = count(),
              DistinctInputs = dcount(InputHash),
              ConfidenceRatio = avg(ReturnConfidence)
            by PrincipalId, ModelId, bin(TimeGenerated, 1h)
  | where RequestCount > 500 and DistinctInputs < 50 and ConfidenceRatio > 0.9
  | extend BehaviorId = "BHV-EXF-001", AtlasTechnique = "AML.T0024.000",
           AtlasTactics = dynamic(["AML.TA0010"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0024.000,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "degrade_output", "params", bag_pack("model", coalesce(tostring(ModelId), "{{model_id}}"), "mode", "label_only_no_scores"), "requires_approval", false, "reversible", true, "blast_radius", "model", "status", "auto"),
      bag_pack("action", "rate_limit", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "limit", "30/min", "ttl", "12h"), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P3"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
