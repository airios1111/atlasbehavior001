id: d7f1160f-756e-5b46-8cd4-fd7ec55506c1
name: 'BHV-EV-009: Model registered under an approved model''s name by a non-owner'
description: |
  A model is registered with a name that matches an approved production model (name_matches_approved_artifact, from the registry) by a principal outside that model's owner group. A malicious model is being dressed up as the trusted one.

  MITRE ATLAS tactics: AML.TA0007. Techniques: AML.T0074 (primary). Mitigations: AML.M0014, AML.M0023.
  ABM behavior BHV-EV-009: status test, severity high, confidence medium.
  False positives: Ownership changes not yet reflected in the registry.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- DefenseEvasion
relevantTechniques:
- T1036
query: |
  // BHV-EV-009 | Model registered under an approved model's name by a non-owner
  // ATLAS tactics: AML.TA0007 | techniques: AML.T0074(primary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-EV-009.yaml. Do not edit.
  AIModelRegistryEvents_CL
  | where EventType == "model_register"
  | where NameMatchesApprovedArtifact == true
  | where RegistrantInOwnerGroup == false
  | extend BehaviorId = "BHV-EV-009", AtlasTechnique = "AML.T0074",
           AtlasTactics = dynamic(["AML.TA0007"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0074"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "block_deploy", "params", bag_pack("artifact", coalesce(tostring(ArtifactId), "{{artifact_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "service", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "ml-platform"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
