id: 9fed1ad0-aace-5b0f-806f-3f5e9691090f
name: 'BHV-COL-001: Bulk reads across several enterprise repositories in one session'
description: |
  In 15 minutes one session's retrievals pull at least 60 distinct documents from at least 3 source systems (SharePoint, Confluence, Jira, Drive). This is broad collection through the assistant's connectors; normal questions touch a handful of documents in one or two systems.

  MITRE ATLAS tactics: AML.TA0009. Techniques: AML.T0036 (primary). Mitigations: AML.M0019, AML.M0004.
  ABM behavior BHV-COL-001: status test, severity high, confidence medium.
  False positives: Migration or e-discovery jobs running through the assistant.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 15m
queryPeriod: 15m
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-COL-001 | Bulk reads across several enterprise repositories in one session
  // ATLAS tactics: AML.TA0009 | techniques: AML.T0036(primary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-COL-001.yaml. Do not edit.
  AIRetrievalLogs_CL
  | where TimeGenerated > ago(15m)
  | summarize DistinctDocs = dcount(DocId),
              Systems = dcount(SourceSystem)
            by PrincipalId, SessionId, bin(TimeGenerated, 15m)
  | where DistinctDocs >= 60 and Systems >= 3
  | extend BehaviorId = "BHV-COL-001", AtlasTechnique = "AML.T0036",
           AtlasTactics = dynamic(["AML.TA0009"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0036"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "rate_limit", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "limit", "5/min", "ttl", "6h"), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P3"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
