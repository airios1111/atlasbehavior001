id: 6e5798d1-e2c6-5305-a37b-a1396d705c32
name: 'BHV-PI-006: Instructions addressed to the assistant inside processed email'
description: |
  Email content retrieved for summarization or triage addresses the AI assistant directly or asks it to hide actions from the user.

  MITRE ATLAS tactics: AML.TA0005. Techniques: AML.T0051.001 (primary). Mitigations: AML.M0020, AML.M0030.
  ABM behavior BHV-PI-006: status test, severity high, confidence medium.
  False positives: Newsletters about AI assistants that quote example prompts.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-PI-006 | Instructions addressed to the assistant inside processed email
  // ATLAS tactics: AML.TA0005 | techniques: AML.T0051.001(primary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-PI-006.yaml. Do not edit.
  AIRetrievalLogs_CL
  | where SourceType == "email"
  | where RetrievedContent matches regex @"(?i)\b(assistant|ai|copilot|agent)\b.{0,40}\b(when|while|if)\s+(you\s+)?(read|process|summari[sz]e)s?\s+this\b"
      or RetrievedContent matches regex @"(?i)\bdo\s+not\s+(tell|inform|mention\s+this\s+to)\s+the\s+(user|recipient)\b"
  | extend BehaviorId = "BHV-PI-006", AtlasTechnique = "AML.T0051.001",
           AtlasTactics = dynamic(["AML.TA0005"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0051.001"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "strip_content", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "quarantine_source", "params", bag_pack("source", coalesce(tostring(SourceUri), "{{source_uri}}")), "requires_approval", true, "reversible", true, "blast_radius", "source", "status", "awaiting_approval"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
