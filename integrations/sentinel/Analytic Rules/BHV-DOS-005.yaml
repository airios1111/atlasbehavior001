id: b678e28f-edb2-5cc5-9d39-ec8ede5c9c7f
name: 'BHV-DOS-005: Inference timeouts concentrated on one principal'
description: |
  One principal causes more than 50 inference timeouts in 10 minutes, consistent with crafted slow inputs exhausting workers.

  MITRE ATLAS tactics: AML.TA0011. Techniques: AML.T0029 (primary). Mitigations: AML.M0004, AML.M0015.
  ABM behavior BHV-DOS-005: status test, severity medium, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 10m
queryPeriod: 10m
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-DOS-005 | Inference timeouts concentrated on one principal
  // ATLAS tactics: AML.TA0011 | techniques: AML.T0029(primary)
  // severity=medium confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-DOS-005.yaml. Do not edit.
  AIInferenceLogs_CL
  | where TimeGenerated > ago(10m)
  | summarize Requests = count(),
              Timeouts = sum(IsTimeout)
            by PrincipalId, bin(TimeGenerated, 10m)
  | where Timeouts > 50 and Requests > 60
  | extend BehaviorId = "BHV-DOS-005", AtlasTechnique = "AML.T0029",
           AtlasTactics = dynamic(["AML.TA0011"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0029"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "rate_limit", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "limit", "5/min", "ttl", "2h"), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "sre"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
