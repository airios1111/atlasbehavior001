id: 69539d09-03e6-538a-a9be-087450dd830c
name: 'BHV-SC-013: MCP tool name advertised by more than one server to the same agent'
description: |
  Two or more MCP servers advertise a tool with the same name to one agent within an hour. The agent cannot tell which implementation it will call, so a malicious server can intercept calls meant for a trusted one or steer them through its own tool description (tool shadowing). Needs the gateway to log one tool_advertised event per tool in each tools/list result.

  MITRE ATLAS tactics: AML.TA0006. Techniques: AML.T0110 (primary), AML.T0010.005 (secondary). Mitigations: AML.M0028, AML.M0014.
  ABM behavior BHV-SC-013: status test, severity high, confidence medium.
  False positives: Two deployments of one server (for example prod and staging) attached to the same agent.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-SC-013 | MCP tool name advertised by more than one server to the same agent
  // ATLAS tactics: AML.TA0006 | techniques: AML.T0110(primary), AML.T0010.005(secondary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-SC-013.yaml. Do not edit.
  AIMCPGatewayEvents_CL
  | where TimeGenerated > ago(1h)
  | where EventType == "tool_advertised"
  | summarize Servers = dcount(ServerId)
            by AgentId, ToolName, bin(TimeGenerated, 1h)
  | where Servers >= 2
  | extend BehaviorId = "BHV-SC-013", AtlasTechnique = "AML.T0110",
           AtlasTactics = dynamic(["AML.TA0006"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0110,AML.T0010.005"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "notify", "params", bag_pack("channel", "platform-sec"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
