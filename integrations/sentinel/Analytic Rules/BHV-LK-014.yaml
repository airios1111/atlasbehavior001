name: 'BHV-LK-014: Agent tool-definition disclosure request'
description: |
  Prompt asks the agent to list its tools or functions with full schemas or parameters verbatim, which exposes the attack surface for tool abuse.

  MITRE ATLAS tactics: AML.TA0008. Techniques: AML.T0084.001 (primary), AML.T0040 (precondition). Mitigations: AML.M0020, AML.M0028.
  ABM behavior BHV-LK-014: status test, severity medium, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-LK-014 | Agent tool-definition disclosure request
  // ATLAS tactics: AML.TA0008 | techniques: AML.T0084.001(primary), AML.T0040(precondition)
  // severity=medium confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-LK-014.yaml. Do not edit.
  AIGatewayLogs_CL
  | where Prompt matches regex @"(?i)\b(list|show|print|output|dump|describe)\b.{0,30}\b(all\s+)?(your|the|available)\s+(tools|functions|plugins|tool\s+schemas?|function\s+definitions?)\b.{0,40}\b(json|schema|parameters|verbatim|exactly)\b"
  | extend BehaviorId = "BHV-LK-014", AtlasTechnique = "AML.T0084.001",
           AtlasTactics = dynamic(["AML.TA0008"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0084.001,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "increment_risk", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "delta", 10), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
