name: 'BHV-EXF-002: Model-inversion probing against a single output class'
description: |
  High-volume, confidence-returning queries whose predictions concentrate on a single target class while inputs are iteratively perturbed, consistent with reconstructing a representative training input for that class.

  MITRE ATLAS tactics: AML.TA0010. Techniques: AML.T0024.001 (primary), AML.T0040 (precondition). Mitigations: AML.M0002, AML.M0004.
  ABM behavior BHV-EXF-002: status test, severity high, confidence low.
  False positives: Single-class batch scoring jobs (allowlist service principals).
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-EXF-002 | Model-inversion probing against a single output class
  // ATLAS tactics: AML.TA0010 | techniques: AML.T0024.001(primary), AML.T0040(precondition)
  // severity=high confidence=low status=test
  // GENERATED by atlas-behavior-map from BHV-EXF-002.yaml. Do not edit.
  AIInferenceLogs_CL
  | where TimeGenerated > ago(1h)
  | summarize RequestCount = count(),
              DistinctClasses = dcount(PredictedClass),
              ConfidenceRatio = avg(ReturnConfidence),
              InputVariance = variance(InputEmbeddingNorm)
            by PrincipalId, ModelId, bin(TimeGenerated, 1h)
  | where RequestCount > 1000 and DistinctClasses <= 1 and ConfidenceRatio > 0.9 and InputVariance < 0.05
  | extend BehaviorId = "BHV-EXF-002", AtlasTechnique = "AML.T0024.001",
           AtlasTactics = dynamic(["AML.TA0010"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0024.001,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "degrade_output", "params", bag_pack("model", coalesce(tostring(ModelId), "{{model_id}}"), "mode", "label_only_no_scores"), "requires_approval", false, "reversible", true, "blast_radius", "model", "status", "auto"),
      bag_pack("action", "rate_limit", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "limit", "30/min", "ttl", "12h"), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
