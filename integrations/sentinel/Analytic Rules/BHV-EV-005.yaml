  MITRE ATLAS tactics: AML.TA0004, AML.TA0007, AML.TA0011. Techniques: AML.T0015 (primary), AML.T0068 (secondary). Mitigations: AML.M0010, AML.M0015.
  ABM behavior BHV-EV-005: status test, severity medium, confidence medium.
