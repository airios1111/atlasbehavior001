id: c75d40aa-ecfc-5dae-a2e4-2c886d77f4d3
name: 'BHV-DSC-004: Request to map the agent''s tool and sub-agent call chain'
description: |
  A prompt asks the agent to describe the exact order of tools, API calls or sub-agents it uses for a task, or which agent it hands off to next. The call chain shows where injected content will flow and which downstream component to target.

  MITRE ATLAS tactics: AML.TA0008. Techniques: AML.T0084.003 (primary), AML.T0040 (precondition). Mitigations: AML.M0020, AML.M0032.
  ABM behavior BHV-DSC-004: status test, severity medium, confidence medium.
  False positives: Developers debugging their own multi-agent workflow.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-DSC-004 | Request to map the agent's tool and sub-agent call chain
  // ATLAS tactics: AML.TA0008 | techniques: AML.T0084.003(primary), AML.T0040(precondition)
  // severity=medium confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-DSC-004.yaml. Do not edit.
  AIGatewayLogs_CL
  | where Prompt matches regex @"(?i)\b(describe|explain|list|show|walk\s+me\s+through|draw|map)\b.{0,30}\b(the\s+)?(exact\s+)?(sequence|order|chain|flow|graph|pipeline)\s+of\s+(tools?|function\s+calls?|tool\s+calls?|agents?|sub-?agents?|api\s+calls?)\b.{0,40}\b(you|your)\b"
      or Prompt matches regex @"(?i)\bwhich\s+(other\s+)?(tools?|agents?|sub-?agents?|services?)\s+(do|does|will)\s+(you|your\s+\w+)\s+(call|invoke|hand\s+off\s+to|delegate\s+to)\s+(after|before|next|when)\b"
  | extend BehaviorId = "BHV-DSC-004", AtlasTechnique = "AML.T0084.003",
           AtlasTactics = dynamic(["AML.TA0008"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0084.003,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "increment_risk", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "delta", 15), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
