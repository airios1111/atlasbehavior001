id: 06ff309a-bc57-5b23-a174-670fa219bf82
name: 'BHV-RD-001: Offensive AI-testing framework fingerprint from a non-red-team principal'
description: |
  The user agent names an adversarial-ML or LLM red-teaming framework (garak, PyRIT, TextAttack, promptmap, llm-attacks, Counterfit, DeepTeam). This shows the obtained capability being used, not its acquisition, and tools that keep a default SDK user agent are invisible. Experimental until tuned.

  MITRE ATLAS tactics: AML.TA0003. Techniques: AML.T0016.000 (primary). Mitigations: AML.M0015, AML.M0004.
  ABM behavior BHV-RD-001: status experimental, severity medium, confidence low.
  False positives: Internal red teams not yet on the allowlist.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-RD-001 | Offensive AI-testing framework fingerprint from a non-red-team principal
  // ATLAS tactics: AML.TA0003 | techniques: AML.T0016.000(primary)
  // severity=medium confidence=low status=experimental
  // GENERATED by atlas-behavior-map from BHV-RD-001.yaml. Do not edit.
  AIGatewayLogs_CL
  | where PrincipalId !in ("sp-redteam", "sp-llm-eval")
  | where UserAgent matches regex @"(?i)\b(garak|pyrit|textattack|promptmap|llm-attacks|counterfit|deepteam)\b"
  | extend BehaviorId = "BHV-RD-001", AtlasTechnique = "AML.T0016.000",
           AtlasTactics = dynamic(["AML.TA0003"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0016.000"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "increment_risk", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "delta", 15), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "soc"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
