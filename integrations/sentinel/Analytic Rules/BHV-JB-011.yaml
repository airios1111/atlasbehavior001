name: 'BHV-JB-011: Jailbreak acknowledgement markers in completion'
description: |
  Model output contains persona markers of a successful jailbreak ('DAN Mode enabled', 'As an unfiltered AI', '[JAILBREAK]'). The model has accepted the jailbreak.

  MITRE ATLAS tactics: AML.TA0012, AML.TA0007. Techniques: AML.T0054 (primary). Mitigations: AML.M0020, AML.M0022.
  ABM behavior BHV-JB-011: status test, severity high, confidence high.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-JB-011 | Jailbreak acknowledgement markers in completion
  // ATLAS tactics: AML.TA0012, AML.TA0007 | techniques: AML.T0054(primary)
  // severity=high confidence=high status=test
  // GENERATED by atlas-behavior-map from BHV-JB-011.yaml. Do not edit.
  AIGatewayLogs_CL
  | where Completion matches regex @"(?i)\b(DAN|jailbreak|unfiltered)\s+mode\s+(enabled|activated|on)\b"
      or Completion matches regex @"(?i)\bas\s+an?\s+(unfiltered|unrestricted|uncensored|jailbroken)\s+(ai|model|assistant)\b"
      or Completion matches regex @"\[(🔓\s*)?(JAILBREAK|DAN)\]"
  | extend BehaviorId = "BHV-JB-011", AtlasTechnique = "AML.T0054",
           AtlasTactics = dynamic(["AML.TA0012", "AML.TA0007"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0054"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "redact_output", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "kill_session", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "session", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
