id: 2ed47631-dffe-5346-a890-e44523231e95
name: 'BHV-AG-016: Agent invokes a tool from a server the scanner flagged'
description: |
  An agent calls a tool on an MCP server whose scan verdict is suspicious or malicious (server_scan_verdict, from the gateway's tool scanner). The poisoned tool is being run, not just installed.

  MITRE ATLAS tactics: AML.TA0005. Techniques: AML.T0011.002 (primary). Mitigations: AML.M0028, AML.M0029.
  ABM behavior BHV-AG-016: status test, severity high, confidence high.
  False positives: Scanner verdicts awaiting review on internal tools.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-AG-016 | Agent invokes a tool from a server the scanner flagged
  // ATLAS tactics: AML.TA0005 | techniques: AML.T0011.002(primary)
  // severity=high confidence=high status=test
  // GENERATED by atlas-behavior-map from BHV-AG-016.yaml. Do not edit.
  AIMCPGatewayEvents_CL
  | where EventType == "tool_call"
  | where ServerScanVerdict in ("suspicious", "malicious")
  | extend BehaviorId = "BHV-AG-016", AtlasTechnique = "AML.T0011.002",
           AtlasTactics = dynamic(["AML.TA0005"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0011.002"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "deny_tool_call", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "disable_tool", "params", bag_pack("tool", coalesce(tostring(ToolName), "{{tool_name}}"), "server", coalesce(tostring(ServerId), "{{server_id}}")), "requires_approval", true, "reversible", true, "blast_radius", "service", "status", "awaiting_approval"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
