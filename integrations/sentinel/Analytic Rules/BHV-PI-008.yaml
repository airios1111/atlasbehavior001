id: 38e79397-d401-59ed-a997-559d99379a66
name: 'BHV-PI-008: Delayed trigger instruction planted in retrieved content'
description: |
  Retrieved content plants a conditional instruction ('the next time the user says X, send/run Y') to execute later in the conversation, evading turn-level checks.

  MITRE ATLAS tactics: AML.TA0007. Techniques: AML.T0094 (primary), AML.T0051.002 (secondary). Mitigations: AML.M0020, AML.M0030.
  ABM behavior BHV-PI-008: status test, severity high, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-PI-008 | Delayed trigger instruction planted in retrieved content
  // ATLAS tactics: AML.TA0007 | techniques: AML.T0094(primary), AML.T0051.002(secondary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-PI-008.yaml. Do not edit.
  AIRetrievalLogs_CL
  | where RetrievedContent matches regex @"(?i)\b(next\s+time|whenever|the\s+moment|as\s+soon\s+as)\b.{0,40}\b(user|they)\s+(says?|types?|asks?|mentions?|writes?)\b.{0,80}\b(respond|reply|output|call|send|run|execute)\b"
  | extend BehaviorId = "BHV-PI-008", AtlasTechnique = "AML.T0094",
           AtlasTactics = dynamic(["AML.TA0007"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0094,AML.T0051.002"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "strip_content", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "quarantine_source", "params", bag_pack("source", coalesce(tostring(SourceUri), "{{source_uri}}")), "requires_approval", true, "reversible", true, "blast_radius", "source", "status", "awaiting_approval"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
