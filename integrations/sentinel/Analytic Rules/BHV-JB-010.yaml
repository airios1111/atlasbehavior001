id: 341b3a88-a70f-5533-8c88-8c21bc9c1a63
name: 'BHV-JB-010: Authority impersonation or fake debug-mode unlock'
description: |
  User claims to be the model's developer or administrator, supplies an 'override code', or asks the model to switch into an unrestricted mode.

  MITRE ATLAS tactics: AML.TA0012, AML.TA0007. Techniques: AML.T0054 (primary), AML.T0073 (secondary), AML.T0040 (precondition). Mitigations: AML.M0020, AML.M0022.
  ABM behavior BHV-JB-010: status test, severity high, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-JB-010 | Authority impersonation or fake debug-mode unlock
  // ATLAS tactics: AML.TA0012, AML.TA0007 | techniques: AML.T0054(primary), AML.T0073(secondary), AML.T0040(precondition)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-JB-010.yaml. Do not edit.
  AIGatewayLogs_CL
  | where Prompt matches regex @"(?i)\b(enable|activate|enter|switch\s+to)\s+(your\s+)?(developer|dev|debug|god|sudo|unrestricted)\s+mode\b.{0,40}\b(you|your|restrictions?|filters?|rules)\b"
      or Prompt matches regex @"(?i)\b(admin|override|authori[sz]ation)\s+code\s*[:=]?\s*[A-Z0-9-]{4,}\b"
      or Prompt matches regex @"(?i)\bi\s+am\s+(your|an?)\s+(developer|creator|system\s+administrator)\b"
  | extend BehaviorId = "BHV-JB-010", AtlasTechnique = "AML.T0054",
           AtlasTactics = dynamic(["AML.TA0012", "AML.TA0007"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0054,AML.T0073,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "block_request", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "increment_risk", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "delta", 15), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto")))
