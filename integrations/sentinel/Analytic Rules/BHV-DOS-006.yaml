name: 'BHV-DOS-006: Oversized top-k vector search'
description: |
  A vector-store query asks for more than 1,000 nearest neighbours, which degrades search latency for every tenant.

  MITRE ATLAS tactics: AML.TA0011. Techniques: AML.T0029 (primary). Mitigations: AML.M0004.
  ABM behavior BHV-DOS-006: status test, severity medium, confidence high.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-DOS-006 | Oversized top-k vector search
  // ATLAS tactics: AML.TA0011 | techniques: AML.T0029(primary)
  // severity=medium confidence=high status=test
  // GENERATED by atlas-behavior-map from BHV-DOS-006.yaml. Do not edit.
  AIVectorStoreEvents_CL
  | where Operation == "query"
  | where TopK > 1000
  | extend BehaviorId = "BHV-DOS-006", AtlasTechnique = "AML.T0029",
           AtlasTactics = dynamic(["AML.TA0011"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0029"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "block_request", "params", bag_pack("request", coalesce(tostring(PrincipalId), "{{principal_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "sre"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
