id: 2e1d715d-f833-597d-b21c-c9f375afbb0c
name: 'BHV-EV-008: Agent shell tool runs sandbox or virtualization checks'
description: |
  An agent's shell or code tool runs commands that test whether it is inside a VM, container or analysis sandbox (systemd-detect-virt, /.dockerenv, /proc/1/cgroup, dmidecode product strings, WMI BIOS queries). Malicious payloads do this to stay dormant under inspection.

  MITRE ATLAS tactics: AML.TA0007. Techniques: AML.T0097 (primary). Mitigations: AML.M0032, AML.M0028.
  ABM behavior BHV-EV-008: status test, severity medium, confidence medium.
  False positives: Platform agents that legitimately inspect their runtime (scope by agent_id).
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- DefenseEvasion
- Discovery
relevantTechniques:
- T1497
query: |
  // BHV-EV-008 | Agent shell tool runs sandbox or virtualization checks
  // ATLAS tactics: AML.TA0007 | techniques: AML.T0097(primary)
  // severity=medium confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-EV-008.yaml. Do not edit.
  AIAgentToolCalls_CL
  | where ToolName in ("shell.exec", "code_interpreter.run", "terminal.run")
  | where ToolArgs matches regex @"(?i)\bsystemd-detect-virt\b"
      or ToolArgs matches regex @"(?i)(\b(ls|stat|test\s+-[ef])|\[\s+-[ef])\s+[^|;]{0,10}/\.dockerenv\b"
      or ToolArgs matches regex @"(?i)/proc/(1|self)/cgroup\b"
      or ToolArgs matches regex @"(?i)\bgrep\b[^|;]{0,20}\bhypervisor\b[^|;]{0,20}/proc/cpuinfo\b"
      or ToolArgs matches regex @"(?i)\bdmidecode\b.{0,30}\b(system-product-name|system-manufacturer|bios-vendor)\b"
      or ToolArgs matches regex @"(?i)\b(Win32_ComputerSystem|Win32_BIOS)\b.{0,60}\b(Model|Manufacturer|SerialNumber)\b"
  | extend BehaviorId = "BHV-EV-008", AtlasTechnique = "AML.T0097",
           AtlasTactics = dynamic(["AML.TA0007"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0097"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "deny_tool_call", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "kill_session", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "session", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "soc"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
