id: 83ef2570-becc-5281-93cd-153ddb6eed4e
name: 'BHV-RC-003: Prompt enumerating employees, admins or org structure'
description: |
  A user asks an internal assistant to list staff, usernames or email addresses across the organization, to name who holds admin rights, or for the full org chart. This is target selection for phishing or privilege abuse.

  MITRE ATLAS tactics: AML.TA0002. Techniques: AML.T0087 (primary), AML.T0040 (precondition). Mitigations: AML.M0020, AML.M0019.
  ABM behavior BHV-RC-003: status test, severity medium, confidence medium.
  False positives: HR and IT staff with a real need (scope by app or group).
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- Reconnaissance
relevantTechniques:
- T1589
- T1591
query: |
  // BHV-RC-003 | Prompt enumerating employees, admins or org structure
  // ATLAS tactics: AML.TA0002 | techniques: AML.T0087(primary), AML.T0040(precondition)
  // severity=medium confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-RC-003.yaml. Do not edit.
  AIGatewayLogs_CL
  | where Prompt matches regex @"(?i)\b(list|enumerate|dump|export|give me)\b.{0,40}\b(employees|staff|users|admins|administrators|email addresses|usernames)\b.{0,40}\b(in|at|of|across|from)\s+(the\s+|our\s+|this\s+)?(company|organi[sz]ation|org|tenant|domain|directory|active directory|entra|azure ad|okta)\b"
      or Prompt matches regex @"(?i)\bwho\s+(has|have|holds?)\b.{0,30}\b(admin|administrator|root|privileged|global admin|domain admin)\b.{0,20}\b(access|rights|roles?|privileges)\b"
      or Prompt matches regex @"(?i)\b(full|complete|entire)\s+(org(ani[sz]ational)?\s+chart|staff\s+directory|employee\s+directory)\b"
  | extend BehaviorId = "BHV-RC-003", AtlasTechnique = "AML.T0087",
           AtlasTactics = dynamic(["AML.TA0002"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0087,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "increment_risk", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "delta", 15), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "soc"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
