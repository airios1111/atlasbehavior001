name: 'BHV-EV-001: Adversarially perturbed input to a production classifier'
description: |
  An adversarial-input detector scores a classifier input as likely perturbed and the model's decision margin is near the boundary, consistent with a crafted evasion sample.

  MITRE ATLAS tactics: AML.TA0007. Techniques: AML.T0015 (primary), AML.T0043 (secondary). Mitigations: AML.M0015, AML.M0003.
  ABM behavior BHV-EV-001: status test, severity high, confidence medium.
  False positives: Out-of-distribution but legitimate inputs (sensor noise, new document formats).
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-EV-001 | Adversarially perturbed input to a production classifier
  // ATLAS tactics: AML.TA0007 | techniques: AML.T0015(primary), AML.T0043(secondary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-EV-001.yaml. Do not edit.
  AIInferenceLogs_CL
  | where AdvDetectorScore >= 0.85
  | where DecisionMargin < 0.05
  | extend BehaviorId = "BHV-EV-001", AtlasTechnique = "AML.T0015",
           AtlasTactics = dynamic(["AML.TA0007"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0015,AML.T0043"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "block_request", "params", bag_pack("request", coalesce(tostring(RequestId), "{{request_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "increment_risk", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "delta", 15), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "ml-review", "request", coalesce(tostring(RequestId), "{{request_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
