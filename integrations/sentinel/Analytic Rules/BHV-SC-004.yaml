  MITRE ATLAS tactics: AML.TA0005. Techniques: AML.T0011.001 (primary), AML.T0010.001 (secondary). Mitigations: AML.M0016, AML.M0011.
  ABM behavior BHV-SC-004: status test, severity high, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
