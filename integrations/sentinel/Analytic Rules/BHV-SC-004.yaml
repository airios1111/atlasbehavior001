query: |
  // BHV-SC-004 | Typosquatted ML package installed in a workspace
  // ATLAS tactics: AML.TA0005 | techniques: AML.T0011.001(primary), AML.T0010.001(secondary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-SC-004.yaml. Do not edit.
