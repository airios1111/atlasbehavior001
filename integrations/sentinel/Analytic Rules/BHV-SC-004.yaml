      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", coalesce(tostring(WorkspaceId), "{{workspace_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
