id: 5d63a31d-d97c-5b3f-88cc-ec197137b096
name: 'BHV-RC-002: Network scanner fingerprint against AI endpoints'
description: |
  The user agent on an inference endpoint request belongs to a network or web scanner (nuclei, zgrab, masscan, Nmap NSE, ffuf, gobuster, feroxbuster, sqlmap, Censys, Expanse).

  MITRE ATLAS tactics: AML.TA0002. Techniques: AML.T0006 (primary). Mitigations: AML.M0019, AML.M0024.
  ABM behavior BHV-RC-002: status test, severity low, confidence high.
  False positives: Your own attack-surface management scanners.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Low
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- Reconnaissance
relevantTechniques:
- T1595.002
query: |
  // BHV-RC-002 | Network scanner fingerprint against AI endpoints
  // ATLAS tactics: AML.TA0002 | techniques: AML.T0006(primary)
  // severity=low confidence=high status=test
  // GENERATED by atlas-behavior-map from BHV-RC-002.yaml. Do not edit.
  AIInferenceLogs_CL
  | where UserAgent matches regex @"(?i)\b(nuclei|zgrab2?|masscan|sqlmap|gobuster|feroxbuster|dirbuster)\b"
      or UserAgent matches regex @"(?i)\bNmap Scripting Engine\b"
      or UserAgent matches regex @"(?i)\bFuzz Faster U Fool\b|\bffuf\b"
      or UserAgent matches regex @"(?i)\b(CensysInspect|Expanse|InternetMeasurement)\b"
  | extend BehaviorId = "BHV-RC-002", AtlasTechnique = "AML.T0006",
           AtlasTactics = dynamic(["AML.TA0002"]), Severity = "low"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0006"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "rate_limit", "params", bag_pack("principal", strcat("ip:", coalesce(tostring(ClientIp), "{{client_ip}}")), "limit", "0/min", "ttl", "24h"), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "soc"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: ClientIp
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
