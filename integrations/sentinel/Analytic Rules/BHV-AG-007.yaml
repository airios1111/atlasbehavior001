id: 4fbe90bf-ce57-56f0-932d-fced98f48dc6
name: 'BHV-AG-007: Runaway agent loop'
description: |
  An agent session makes more than 200 tool calls in 10 minutes while cycling through three or fewer tools, a stuck or induced loop that burns compute.

  MITRE ATLAS tactics: AML.TA0011. Techniques: AML.T0034.002 (primary). Mitigations: AML.M0004, AML.M0029.
  ABM behavior BHV-AG-007: status test, severity medium, confidence high.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 10m
queryPeriod: 10m
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-AG-007 | Runaway agent loop
  // ATLAS tactics: AML.TA0011 | techniques: AML.T0034.002(primary)
  // severity=medium confidence=high status=test
  // GENERATED by atlas-behavior-map from BHV-AG-007.yaml. Do not edit.
  AIAgentToolCalls_CL
  | where TimeGenerated > ago(10m)
  | summarize ToolCalls = count(),
              DistinctTools = dcount(ToolName)
            by SessionId, bin(TimeGenerated, 10m)
  | where ToolCalls > 200 and DistinctTools <= 3
  | extend BehaviorId = "BHV-AG-007", AtlasTechnique = "AML.T0034.002",
           AtlasTactics = dynamic(["AML.TA0011"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0034.002"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "kill_session", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "session", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "agent-platform"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
