id: 7e3d9f68-60ba-5e71-b40d-fbc18004a0ea
name: 'BHV-MA-002: One principal sweeps many model endpoints'
description: |
  In one hour a principal sends at least 20 requests spread over 10 or more distinct models or deployments. Legitimate apps call a few fixed models; sweeping the catalog means someone is probing for whatever their credential can reach.

  MITRE ATLAS tactics: AML.TA0000. Techniques: AML.T0040 (primary). Mitigations: AML.M0004, AML.M0019.
  ABM behavior BHV-MA-002: status test, severity medium, confidence medium.
  False positives: Evaluation and monitoring service principals (allowlisted).
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-MA-002 | One principal sweeps many model endpoints
  // ATLAS tactics: AML.TA0000 | techniques: AML.T0040(primary)
  // severity=medium confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-MA-002.yaml. Do not edit.
  AIInferenceLogs_CL
  | where TimeGenerated > ago(1h)
  | where PrincipalId !in ("sp-model-eval", "sp-canary-monitor")
  | summarize Requests = count(),
              DistinctModels = dcount(ModelId)
            by PrincipalId, bin(TimeGenerated, 1h)
  | where DistinctModels >= 10 and Requests >= 20
  | extend BehaviorId = "BHV-MA-002", AtlasTechnique = "AML.T0040",
           AtlasTactics = dynamic(["AML.TA0000"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "rate_limit", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "limit", "10/min", "ttl", "6h"), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P3"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
