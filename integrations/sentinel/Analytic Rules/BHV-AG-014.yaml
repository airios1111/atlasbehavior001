id: 0d644e6f-ee10-5ecb-9bdc-1bb5dec57b81
name: 'BHV-AG-014: Agent application token used from a new network location'
description: |
  An agent's application access token signs in from an ASN never seen for that agent and through a client other than the agent runtime. The token was likely stolen and replayed.

  MITRE ATLAS tactics: AML.TA0015. Techniques: AML.T0091.000 (primary). Mitigations: AML.M0026, AML.M0019.
  ABM behavior BHV-AG-014: status test, severity high, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-AG-014 | Agent application token used from a new network location
  // ATLAS tactics: AML.TA0015 | techniques: AML.T0091.000(primary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-AG-014.yaml. Do not edit.
  AIIdentityEvents_CL
  | where TokenType == "agent_app_token"
  | where SignInAsnSeenBefore == false
  | where ClientApp != "agent-runtime"
  | extend BehaviorId = "BHV-AG-014", AtlasTechnique = "AML.T0091.000",
           AtlasTactics = dynamic(["AML.TA0015"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0091.000"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "revoke_token", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}")), "requires_approval", true, "reversible", true, "blast_radius", "principal", "status", "awaiting_approval"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
