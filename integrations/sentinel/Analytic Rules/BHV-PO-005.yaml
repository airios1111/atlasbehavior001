id: 2514543a-d426-543d-b13b-02a2efc31be4
name: 'BHV-PO-005: Near-duplicate document flood into the RAG index'
description: |
  One uploader writes more than 100 documents in an hour with an average near-duplicate score above 0.9. These are false entries crafted to dominate retrieval for a topic.

  MITRE ATLAS tactics: AML.TA0007. Techniques: AML.T0071 (primary). Mitigations: AML.M0025, AML.M0004.
  ABM behavior BHV-PO-005: status test, severity medium, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-PO-005 | Near-duplicate document flood into the RAG index
  // ATLAS tactics: AML.TA0007 | techniques: AML.T0071(primary)
  // severity=medium confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-PO-005.yaml. Do not edit.
  AIVectorStoreEvents_CL
  | where TimeGenerated > ago(1h)
  | where Operation == "upsert"
  | summarize Upserts = count(),
              AvgDup = avg(NearDuplicateScore)
            by UploaderId, bin(TimeGenerated, 1h)
  | where Upserts > 100 and AvgDup > 0.9
  | extend BehaviorId = "BHV-PO-005", AtlasTechnique = "AML.T0071",
           AtlasTactics = dynamic(["AML.TA0007"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0071"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "quarantine_vector_records", "params", bag_pack("doc", strcat("uploader:", coalesce(tostring(UploaderId), "{{uploader_id}}"))), "requires_approval", false, "reversible", true, "blast_radius", "source", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "kb-admins"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
