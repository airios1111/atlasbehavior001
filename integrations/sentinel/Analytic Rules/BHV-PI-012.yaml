id: ab4bf56e-111a-599f-8490-6898d6ebc37a
name: 'BHV-PI-012: Repeated prompt-injection attempts by one principal'
description: |
  One principal triggers the gateway's prompt-injection guardrail five or more times across at least two sessions within an hour, indicating deliberate probing rather than an accident.

  MITRE ATLAS tactics: AML.TA0005. Techniques: AML.T0051.000 (primary), AML.T0040 (precondition). Mitigations: AML.M0020, AML.M0004.
  ABM behavior BHV-PI-012: status test, severity medium, confidence medium.
  False positives: Authorized red-team accounts (add to a not_in filter).
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-PI-012 | Repeated prompt-injection attempts by one principal
  // ATLAS tactics: AML.TA0005 | techniques: AML.T0051.000(primary), AML.T0040(precondition)
  // severity=medium confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-PI-012.yaml. Do not edit.
  AIGatewayLogs_CL
  | where TimeGenerated > ago(1h)
  | where GuardrailVerdict == "prompt_injection"
  | summarize Attempts = count(),
              Sessions = dcount(SessionId)
            by PrincipalId, bin(TimeGenerated, 1h)
  | where Attempts >= 5 and Sessions >= 2
  | extend BehaviorId = "BHV-PI-012", AtlasTechnique = "AML.T0051.000",
           AtlasTactics = dynamic(["AML.TA0005"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0051.000,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "increment_risk", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "delta", 40), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "step_up_auth", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "rate_limit", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "limit", "20/min", "ttl", "6h"), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
