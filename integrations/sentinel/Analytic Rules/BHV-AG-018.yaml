id: 3e37f6ad-ff2d-514c-a0b6-9f916ae54623
name: 'BHV-AG-018: Untrusted retrieved or tool-output content reaches a privileged tool call'
description: |
  Content from an untrusted retrieval source or tool result (public web page, inbound email, external upload) reaches a privileged tool call (payments, identity, permissions, configuration, code execution) within 3 hops of the agent's span graph: indirect prompt injection turned into action. Computed per trace along parent_span_id and input_span_ids. Needs input_origin, source_trust and tool_class from the runtime or gateway (docs/agent-telemetry.md). BHV-AG-008 is the single-event form for runtimes that can only flag 'untrusted content in context'.

  MITRE ATLAS tactics: AML.TA0005, AML.TA0012. Techniques: AML.T0053 (primary), AML.T0051.001 (secondary). Mitigations: AML.M0030, AML.M0029, AML.M0026.
  ABM behavior BHV-AG-018: status test, severity high, confidence medium.
  False positives: Agents built to act on external documents where the human approval happens outside the traced run.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-AG-018 | Untrusted retrieved or tool-output content reaches a privileged tool call
  // ATLAS tactics: AML.TA0005, AML.TA0012 | techniques: AML.T0053(primary), AML.T0051.001(secondary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-AG-018.yaml. Do not edit.
  // Provenance: taint from source spans along ParentSpanId and InputSpanIds edges, up to 3 hop(s),
  // as unrolled self-joins. Only spans inside the rule's query period are joined: set the lookback
  // to cover a whole agent run, or a trace that straddles the boundary is missed.
  // Spans ingested straight from OpenTelemetry have no InputSpanIds unless ingestion adds them; the
  // rule then follows parent chains only (see docs/agent-telemetry.md, Limits).
  let Spans = materialize(union isfuzzy=true AIAgentToolCalls_CL, AIMCPGatewayEvents_CL
      | where isnotempty(TraceId) and isnotempty(SpanId)
      | extend InputSpanIds = todynamic(column_ifexists("InputSpanIds", "")));
  let Edges = union
      (Spans | where isnotempty(ParentSpanId)
          | project TraceId, FromSpanId = ParentSpanId, ToSpanId = SpanId, Edge = "parent"),
      (Spans | mv-expand FromSpanId = InputSpanIds to typeof(string) | where isnotempty(FromSpanId)
          | project TraceId, FromSpanId, ToSpanId = SpanId, Edge = "input")
      | where FromSpanId != ToSpanId  // self-references are malformed; the engine ignores them
      | summarize Edge = take_any(Edge) by TraceId, FromSpanId, ToSpanId;
  let Sources = Spans
      | where InputOrigin in ("retrieval", "tool_output")
      | where SourceTrust == "untrusted"
      | project TraceId, SourceSpanId = SpanId
      | distinct TraceId, SourceSpanId;
  let Hop1 = Sources
      | join kind=inner Edges on $left.TraceId == $right.TraceId, $left.SourceSpanId == $right.FromSpanId
      | project TraceId, SourceSpanId, ReachedSpanId = ToSpanId, Hops = 1,
                Path = strcat(SourceSpanId, " -", Edge, "-> ", ToSpanId)
      | summarize Path = take_any(Path) by TraceId, SourceSpanId, ReachedSpanId, Hops;
  let Hop2 = Hop1
      | join kind=inner Edges on $left.TraceId == $right.TraceId, $left.ReachedSpanId == $right.FromSpanId
      | project TraceId, SourceSpanId, ReachedSpanId = ToSpanId, Hops = 2,
                Path = strcat(Path, " -", Edge, "-> ", ToSpanId)
      | summarize Path = take_any(Path) by TraceId, SourceSpanId, ReachedSpanId, Hops;
  let Hop3 = Hop2
      | join kind=inner Edges on $left.TraceId == $right.TraceId, $left.ReachedSpanId == $right.FromSpanId
      | project TraceId, SourceSpanId, ReachedSpanId = ToSpanId, Hops = 3,
                Path = strcat(Path, " -", Edge, "-> ", ToSpanId)
      | summarize Path = take_any(Path) by TraceId, SourceSpanId, ReachedSpanId, Hops;
  union Hop1, Hop2, Hop3
  | summarize arg_min(Hops, SourceSpanId, Path) by TraceId, ReachedSpanId
  | join kind=inner (Spans
          | where ToolClass == "privileged"
      ) on $left.TraceId == $right.TraceId, $left.ReachedSpanId == $right.SpanId
  | project-away TraceId1, ReachedSpanId
  | extend BehaviorId = "BHV-AG-018", AtlasTechnique = "AML.T0053",
           AtlasTactics = dynamic(["AML.TA0005", "AML.TA0012"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0053,AML.T0051.001"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "deny_tool_call", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}"), "tool", coalesce(tostring(ToolName), "{{tool_name}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "kill_session", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "session", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P1"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
