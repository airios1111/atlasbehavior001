id: a7253472-f424-5f70-a08c-26712095730e
name: 'BHV-CA-003: Agent runs OS credential-dumping commands'
description: |
  Agent shell arguments invoke credential-dumping tooling or techniques: mimikatz/pypykatz, secretsdump, LaZagne, an LSASS memory dump, saving the SAM/SECURITY hives, or reading /etc/shadow.

  MITRE ATLAS tactics: AML.TA0013. Techniques: AML.T0090 (primary). Mitigations: AML.M0032, AML.M0026.
  ABM behavior BHV-CA-003: status test, severity critical, confidence high.
  False positives: Authorized penetration-testing agents (scope by agent_id).
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- CredentialAccess
relevantTechniques:
- T1003
query: |
  // BHV-CA-003 | Agent runs OS credential-dumping commands
  // ATLAS tactics: AML.TA0013 | techniques: AML.T0090(primary)
  // severity=critical confidence=high status=test
  // GENERATED by atlas-behavior-map from BHV-CA-003.yaml. Do not edit.
  AIAgentToolCalls_CL
  | where ToolName in ("shell.exec", "code_interpreter.run", "terminal.run")
  | where ToolArgs matches regex @"(?i)\b(mimikatz|sekurlsa|lsadump|secretsdump(\.py)?|pypykatz|lazagne)\b"
      or ToolArgs matches regex @"(?i)\bprocdump(64)?(\.exe)?\b.{0,60}\blsass\b"
      or ToolArgs matches regex @"(?i)\bcomsvcs(\.dll)?[, ]+#?(24|MiniDump)\b"
      or ToolArgs matches regex @"(?i)\breg(\.exe)?\s+save\s+hklm\\(sam|system|security)\b"
      or ToolArgs matches regex @"(?i)\b(cat|cp|tar|less|head|strings|base64)\s+[^|;]{0,20}/etc/shadow\b"
  | extend BehaviorId = "BHV-CA-003", AtlasTechnique = "AML.T0090",
           AtlasTactics = dynamic(["AML.TA0013"]), Severity = "critical"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0090"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "deny_tool_call", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "kill_session", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "session", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P1"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
