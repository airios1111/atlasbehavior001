id: 87b5aab9-c6df-5089-9c8a-0f0e1ed6bd9f
name: 'BHV-SC-006: Agent tool manifest changed after approval (rug pull)'
description: |
  An approved MCP server or agent tool changes its manifest (description, schema, endpoint) to a version whose hash was never approved.

  MITRE ATLAS tactics: AML.TA0007. Techniques: AML.T0109 (primary). Mitigations: AML.M0028, AML.M0014.
  ABM behavior BHV-SC-006: status test, severity critical, confidence high.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-SC-006 | Agent tool manifest changed after approval (rug pull)
  // ATLAS tactics: AML.TA0007 | techniques: AML.T0109(primary)
  // severity=critical confidence=high status=test
  // GENERATED by atlas-behavior-map from BHV-SC-006.yaml. Do not edit.
  AIMCPGatewayEvents_CL
  | where EventType == "tool_manifest_change"
  | where ManifestHashApproved == false
  | extend BehaviorId = "BHV-SC-006", AtlasTechnique = "AML.T0109",
           AtlasTactics = dynamic(["AML.TA0007"]), Severity = "critical"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0109"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "disable_tool", "params", bag_pack("tool", coalesce(tostring(ToolName), "{{tool_name}}"), "server", coalesce(tostring(ServerId), "{{server_id}}")), "requires_approval", true, "reversible", true, "blast_radius", "service", "status", "awaiting_approval"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
customDetails:
