id: 5db436f7-05e6-5a5e-8531-faf514045ca4
name: 'BHV-EXF-007: Restricted training dataset downloaded outside its ACL'
description: |
  A restricted or confidential dataset is downloaded by a principal that is not on the dataset's access list.

  MITRE ATLAS tactics: AML.TA0009. Techniques: AML.T0035 (primary). Mitigations: AML.M0005, AML.M0025.
  ABM behavior BHV-EXF-007: status test, severity high, confidence high.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-EXF-007 | Restricted training dataset downloaded outside its ACL
  // ATLAS tactics: AML.TA0009 | techniques: AML.T0035(primary)
  // severity=high confidence=high status=test
  // GENERATED by atlas-behavior-map from BHV-EXF-007.yaml. Do not edit.
  AITrainingPipelineEvents_CL
  | where EventType == "dataset_download"
  | where DatasetSensitivity in ("restricted", "confidential")
  | where PrincipalInDatasetAcl == false
  | extend BehaviorId = "BHV-EXF-007", AtlasTechnique = "AML.T0035",
           AtlasTactics = dynamic(["AML.TA0009"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0035"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "revoke_token", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}")), "requires_approval", true, "reversible", true, "blast_radius", "principal", "status", "awaiting_approval"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
