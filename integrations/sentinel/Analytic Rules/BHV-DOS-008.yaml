id: ee0a868a-111d-510f-abb3-36628fa5e312
name: 'BHV-DOS-008: Reasoning-token exhaustion'
description: |
  In one hour a principal consumes more than 2M reasoning tokens at over 20k per request. Prompts are crafted to make reasoning models think for a long time.

  MITRE ATLAS tactics: AML.TA0011. Techniques: AML.T0029 (primary), AML.T0034.001 (secondary). Mitigations: AML.M0004.
  ABM behavior BHV-DOS-008: status test, severity medium, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-DOS-008 | Reasoning-token exhaustion
  // ATLAS tactics: AML.TA0011 | techniques: AML.T0029(primary), AML.T0034.001(secondary)
  // severity=medium confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-DOS-008.yaml. Do not edit.
  AIGatewayLogs_CL
  | where TimeGenerated > ago(1h)
  | summarize Requests = count(),
              ReasoningTotal = sum(ReasoningTokens),
              ReasoningAvg = avg(ReasoningTokens)
            by PrincipalId, bin(TimeGenerated, 1h)
  | where ReasoningTotal > 2e+06 and ReasoningAvg > 20000
  | extend BehaviorId = "BHV-DOS-008", AtlasTechnique = "AML.T0029",
           AtlasTactics = dynamic(["AML.TA0011"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0029,AML.T0034.001"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "cap_tokens", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "max_reasoning", 8000), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "finops-soc"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
