id: 4d4eac18-8429-5631-b6ac-3816d82b63d6
name: 'BHV-AG-017: Local AI agent configuration changed outside the agent'
description: |
  A local coding or desktop agent's MCP server list, auto-approve settings, allowed commands or hooks change, and the change did not come from the agent's own UI or managed policy (change_origin, from the agent host). Malware rewrites these files to turn the user's agent into its own.

  MITRE ATLAS tactics: AML.TA0011. Techniques: AML.T0112.000 (primary). Mitigations: AML.M0026, AML.M0032.
  ABM behavior BHV-AG-017: status test, severity high, confidence medium.
  False positives: Users hand-editing their own agent config files.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-AG-017 | Local AI agent configuration changed outside the agent
  // ATLAS tactics: AML.TA0011 | techniques: AML.T0112.000(primary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-AG-017.yaml. Do not edit.
  AIAgentToolCalls_CL
  | where EventType == "config_change"
  | where ConfigKey in ("mcp_servers", "auto_approve", "allowed_commands", "hooks")
  | where ChangeOrigin !in ("agent_ui", "managed_policy")
  | extend BehaviorId = "BHV-AG-017", AtlasTechnique = "AML.T0112.000",
           AtlasTactics = dynamic(["AML.TA0011"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0112.000"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "notify", "params", bag_pack("channel", "soc"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
