id: 155c890d-7540-5814-925c-992ef6b0837a
name: 'BHV-DOS-004: Repeated context-window saturation'
description: |
  More than 20 requests in 10 minutes average above 95% context-window use, saturating capacity on long-context inference.

  MITRE ATLAS tactics: AML.TA0011. Techniques: AML.T0029 (primary), AML.T0034.001 (secondary). Mitigations: AML.M0004.
  ABM behavior BHV-DOS-004: status test, severity medium, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 10m
queryPeriod: 10m
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-DOS-004 | Repeated context-window saturation
  // ATLAS tactics: AML.TA0011 | techniques: AML.T0029(primary), AML.T0034.001(secondary)
  // severity=medium confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-DOS-004.yaml. Do not edit.
  AIGatewayLogs_CL
  | where TimeGenerated > ago(10m)
  | summarize Requests = count(),
              AvgCtx = avg(ContextUtilization)
            by PrincipalId, bin(TimeGenerated, 10m)
  | where Requests > 20 and AvgCtx > 0.95
  | extend BehaviorId = "BHV-DOS-004", AtlasTechnique = "AML.T0029",
           AtlasTactics = dynamic(["AML.TA0011"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0029,AML.T0034.001"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "cap_tokens", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "max_input", 32000), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "rate_limit", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "limit", "5/min", "ttl", "1h"), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
