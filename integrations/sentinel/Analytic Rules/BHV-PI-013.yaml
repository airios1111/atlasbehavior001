id: 80898571-eaad-5d30-b196-8ebe201e8323
name: 'BHV-PI-013: Injected instructions in agent tool output'
description: |
  Output returned by an agent tool (web fetch, search, file read) contains override phrasing, fake instruction tags, or orders for the agent to call another tool.

  MITRE ATLAS tactics: AML.TA0005. Techniques: AML.T0051.001 (primary), AML.T0099 (secondary). Mitigations: AML.M0030, AML.M0033.
  ABM behavior BHV-PI-013: status test, severity high, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-PI-013 | Injected instructions in agent tool output
  // ATLAS tactics: AML.TA0005 | techniques: AML.T0051.001(primary), AML.T0099(secondary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-PI-013.yaml. Do not edit.
  AIAgentToolCalls_CL
  | where ToolOutput matches regex @"(?i)\b(ignore|disregard)\s+(all\s+|any\s+)?(previous|prior|above|earlier|user)\s+(instructions|requests?|directions)\b"
      or ToolOutput matches regex @"(?i)<\s*(instructions?|system|important)\s*>"
      or ToolOutput matches regex @"(?i)\b(ai|agent|assistant)\s+(must|should)\s+(now\s+)?(call|invoke|use|run)\s+(the\s+)?[a-z_.]+\s+tool\b"
  | extend BehaviorId = "BHV-PI-013", AtlasTechnique = "AML.T0051.001",
           AtlasTactics = dynamic(["AML.TA0005"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0051.001,AML.T0099"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "deny_tool_call", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "kill_session", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "session", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
