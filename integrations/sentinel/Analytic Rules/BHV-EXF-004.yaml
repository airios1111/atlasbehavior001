id: 605e3c63-4901-54c7-b0cf-8b25caaaaa99
name: 'BHV-EXF-004: Agent sends data to a non-allowlisted external endpoint'
description: |
  An agent HTTP or webhook tool posts more than 2 KB to a destination outside the egress allowlist, which matches tool-based data exfiltration.

  MITRE ATLAS tactics: AML.TA0010. Techniques: AML.T0086 (primary). Mitigations: AML.M0028, AML.M0029.
  ABM behavior BHV-EXF-004: status test, severity high, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-EXF-004 | Agent sends data to a non-allowlisted external endpoint
  // ATLAS tactics: AML.TA0010 | techniques: AML.T0086(primary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-EXF-004.yaml. Do not edit.
  AIAgentToolCalls_CL
  | where ToolName in ("http.request", "web.post", "webhook.send")
  | where DestinationAllowlisted == false
  | where RequestBytes > 2048
  | extend BehaviorId = "BHV-EXF-004", AtlasTechnique = "AML.T0086",
           AtlasTactics = dynamic(["AML.TA0010"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0086"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "deny_tool_call", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "kill_session", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "session", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
