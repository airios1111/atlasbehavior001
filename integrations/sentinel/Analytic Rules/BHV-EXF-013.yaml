id: 69a48c8f-8738-5a1c-87ec-c95bd50742af
name: 'BHV-EXF-013: Vector store bulk export or full scan'
description: |
  An export, scan or list-all operation returns more than 10,000 records from a vector store, enough to copy the whole knowledge base.

  MITRE ATLAS tactics: AML.TA0009. Techniques: AML.T0085.000 (primary). Mitigations: AML.M0005, AML.M0019.
  ABM behavior BHV-EXF-013: status test, severity high, confidence high.
  False positives: Scheduled backups (scope by service principal).
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-EXF-013 | Vector store bulk export or full scan
  // ATLAS tactics: AML.TA0009 | techniques: AML.T0085.000(primary)
  // severity=high confidence=high status=test
  // GENERATED by atlas-behavior-map from BHV-EXF-013.yaml. Do not edit.
  AIVectorStoreEvents_CL
  | where Operation in ("export", "scan", "list_all")
  | where RecordsReturned > 10000
  | extend BehaviorId = "BHV-EXF-013", AtlasTechnique = "AML.T0085.000",
           AtlasTactics = dynamic(["AML.TA0009"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0085.000"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "revoke_token", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}")), "requires_approval", true, "reversible", true, "blast_radius", "principal", "status", "awaiting_approval"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
