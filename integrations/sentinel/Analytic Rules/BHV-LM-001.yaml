id: aaa84cc4-5806-5f6c-a8c9-ce13ca8d3cb4
name: 'BHV-LM-001: Agent presents its delegated token to an MCP server outside its baseline'
description: |
  An agent calls an MCP server for the first time (server_first_seen_for_agent, computed by the gateway) using its delegated OAuth token, and the server is not in the agent's manifest. The agent's identity is being used to reach systems it was never set up for.

  MITRE ATLAS tactics: AML.TA0015. Techniques: AML.T0091.000 (primary). Mitigations: AML.M0028, AML.M0032.
  ABM behavior BHV-LM-001: status test, severity high, confidence medium.
  False positives: Manifest updates lagging a legitimate rollout.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-LM-001 | Agent presents its delegated token to an MCP server outside its baseline
  // ATLAS tactics: AML.TA0015 | techniques: AML.T0091.000(primary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-LM-001.yaml. Do not edit.
  AIMCPGatewayEvents_CL
  | where AuthType == "delegated_token"
  | where ServerFirstSeenForAgent == true
  | where ServerInAgentManifest == false
  | extend BehaviorId = "BHV-LM-001", AtlasTechnique = "AML.T0091.000",
           AtlasTactics = dynamic(["AML.TA0015"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0091.000"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "deny_tool_call", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "revoke_token", "params", bag_pack("principal", strcat("agent:", coalesce(tostring(AgentId), "{{agent_id}}"))), "requires_approval", true, "reversible", true, "blast_radius", "principal", "status", "awaiting_approval"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
