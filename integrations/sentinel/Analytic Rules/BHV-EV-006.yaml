id: 720266cf-c017-557e-b81b-ff33082a1ba1
name: 'BHV-EV-006: Chaff flooding of a detection model'
description: |
  More than 500 low-quality inputs in 10 minutes from one source, flooding a detection model with chaff to bury real events or skew its online statistics.

  MITRE ATLAS tactics: AML.TA0011. Techniques: AML.T0046 (primary). Mitigations: AML.M0004, AML.M0015.
  ABM behavior BHV-EV-006: status test, severity medium, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 10m
queryPeriod: 10m
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-EV-006 | Chaff flooding of a detection model
  // ATLAS tactics: AML.TA0011 | techniques: AML.T0046(primary)
  // severity=medium confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-EV-006.yaml. Do not edit.
  AIInferenceLogs_CL
  | where TimeGenerated > ago(10m)
  | summarize Requests = count(),
              AvgQuality = avg(InputQualityScore)
            by PrincipalId, bin(TimeGenerated, 10m)
  | where Requests > 500 and AvgQuality < 0.2
  | extend BehaviorId = "BHV-EV-006", AtlasTechnique = "AML.T0046",
           AtlasTactics = dynamic(["AML.TA0011"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0046"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "rate_limit", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "limit", "10/min", "ttl", "1h"), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "soc"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
