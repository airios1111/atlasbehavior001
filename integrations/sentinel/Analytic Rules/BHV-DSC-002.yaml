id: 22f2d641-4f4f-5e51-9096-117b31806914
name: 'BHV-DSC-002: Request to enumerate the assistant''s knowledge base or data sources'
description: |
  A prompt asks the assistant to list every file, document or data source in its knowledge base, retrieval index or uploaded context. Knowing what is embedded lets the attacker target it for extraction or poisoning.

  MITRE ATLAS tactics: AML.TA0008. Techniques: AML.T0084.000 (primary), AML.T0040 (precondition). Mitigations: AML.M0020, AML.M0019.
  ABM behavior BHV-DSC-002: status test, severity medium, confidence medium.
  False positives: Knowledge-base owners auditing their own assistant.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-DSC-002 | Request to enumerate the assistant's knowledge base or data sources
  // ATLAS tactics: AML.TA0008 | techniques: AML.T0084.000(primary), AML.T0040(precondition)
  // severity=medium confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-DSC-002.yaml. Do not edit.
  AIGatewayLogs_CL
  | where Prompt matches regex @"(?i)\b(list|enumerate|name|show|print|dump|output)\b.{0,30}\b(all|every|each)\b.{0,20}\b(files?|documents?|sources?|data\s*sources|knowledge\s+(base|files?|sources?)|uploaded\s+files|attachments)\b.{0,40}\b(you\s+(have|were\s+given|can\s+access)|in\s+your\s+(knowledge|context|memory|index|vector\s+store)|available\s+to\s+you|your\s+(knowledge\s+base|retrieval|rag))\b"
  | extend BehaviorId = "BHV-DSC-002", AtlasTechnique = "AML.T0084.000",
           AtlasTactics = dynamic(["AML.TA0008"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0084.000,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "increment_risk", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "delta", 15), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
