id: a6f3ac78-4de0-56df-9dbe-488ae8b9e634
name: 'BHV-EXF-009: Daily output volume consistent with proxy-model replication'
description: |
  In one day an API key makes more than 1,000 requests and receives more than 1M output tokens. That is enough synthetic data to train a replica model.

  MITRE ATLAS tactics: AML.TA0001. Techniques: AML.T0005.001 (primary), AML.T0024.002 (secondary), AML.T0040 (precondition). Mitigations: AML.M0004, AML.M0019.
  ABM behavior BHV-EXF-009: status test, severity high, confidence low.
  False positives: High-volume production integrations (baseline per key).
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1d
queryPeriod: 1d
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-EXF-009 | Daily output volume consistent with proxy-model replication
  // ATLAS tactics: AML.TA0001 | techniques: AML.T0005.001(primary), AML.T0024.002(secondary), AML.T0040(precondition)
  // severity=high confidence=low status=test
  // GENERATED by atlas-behavior-map from BHV-EXF-009.yaml. Do not edit.
  AIGatewayLogs_CL
  | where TimeGenerated > ago(1d)
  | summarize Requests = count(),
              OutputTokensTotal = sum(OutputTokens)
            by PrincipalId, bin(TimeGenerated, 1d)
  | where Requests > 1000 and OutputTokensTotal > 1e+06
  | extend BehaviorId = "BHV-EXF-009", AtlasTechnique = "AML.T0005.001",
           AtlasTactics = dynamic(["AML.TA0001"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0005.001,AML.T0024.002,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "rate_limit", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "limit", "10/min", "ttl", "24h"), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "ai-sec"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
