name: 'BHV-EXF-008: Logprob harvesting across many unique prompts (distillation)'
description: |
  More than 800 requests with logprobs in an hour, over more than 700 unique prompts. A dense soft-label signal like this is enough to distill the model.

  MITRE ATLAS tactics: AML.TA0010. Techniques: AML.T0024.002 (primary), AML.T0005.001 (secondary), AML.T0040 (precondition). Mitigations: AML.M0002, AML.M0004.
  ABM behavior BHV-EXF-008: status test, severity high, confidence medium.
  False positives: Evaluation harnesses scoring large benchmark suites.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-EXF-008 | Logprob harvesting across many unique prompts (distillation)
  // ATLAS tactics: AML.TA0010 | techniques: AML.T0024.002(primary), AML.T0005.001(secondary), AML.T0040(precondition)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-EXF-008.yaml. Do not edit.
  AIGatewayLogs_CL
  | where TimeGenerated > ago(1h)
  | where LogprobsRequested == true
  | summarize Requests = count(),
              DistinctPrompts = dcount(PromptHash)
            by PrincipalId, bin(TimeGenerated, 1h)
  | where Requests > 800 and DistinctPrompts > 700
  | extend BehaviorId = "BHV-EXF-008", AtlasTechnique = "AML.T0024.002",
           AtlasTactics = dynamic(["AML.TA0010"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0024.002,AML.T0005.001,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "degrade_output", "params", bag_pack("model", "assistant-prod", "mode", "no_logprobs"), "requires_approval", false, "reversible", true, "blast_radius", "model", "status", "auto"),
      bag_pack("action", "rate_limit", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "limit", "20/min", "ttl", "24h"), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
