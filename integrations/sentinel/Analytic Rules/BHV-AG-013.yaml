id: d7da743b-b474-57c3-a15c-f826f4695bf6
name: 'BHV-AG-013: Agent performs process discovery'
description: |
  An agent shell call lists running processes (ps aux, tasklist, Get-Process), often to find security tooling before acting.

  MITRE ATLAS tactics: AML.TA0008. Techniques: AML.T0089 (primary). Mitigations: AML.M0032, AML.M0024.
  ABM behavior BHV-AG-013: status test, severity low, confidence medium.
  False positives: Debugging sessions in developer sandboxes.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Low
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-AG-013 | Agent performs process discovery
  // ATLAS tactics: AML.TA0008 | techniques: AML.T0089(primary)
  // severity=low confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-AG-013.yaml. Do not edit.
  AIAgentToolCalls_CL
  | where ToolName in ("shell.exec", "code_interpreter.run", "terminal.run")
  | where ToolArgs matches regex @"(?i)(^|[;&|]\s*)(ps\s+(-ef|aux|-e)|tasklist|get-process|top\s+-b)\b"
  | extend BehaviorId = "BHV-AG-013", AtlasTechnique = "AML.T0089",
           AtlasTactics = dynamic(["AML.TA0008"]), Severity = "low"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0089"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "notify", "params", bag_pack("channel", "agent-platform"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
