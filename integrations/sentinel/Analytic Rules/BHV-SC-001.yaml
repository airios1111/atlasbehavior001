id: 01afa57c-9317-5e9c-975b-4e6c9c810301
name: 'BHV-SC-001: Unsigned or hash-mismatched model artifact loaded'
description: |
  A model artifact is loaded or promoted for serving without a valid signature, or its digest does not match the registry record.

  MITRE ATLAS tactics: AML.TA0004. Techniques: AML.T0010.003 (primary), AML.T0018 (secondary). Mitigations: AML.M0014, AML.M0016.
  ABM behavior BHV-SC-001: status stable, severity critical, confidence high.
  False positives: Local dev loads in sandbox registries (scope by environment).
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-SC-001 | Unsigned or hash-mismatched model artifact loaded
  // ATLAS tactics: AML.TA0004 | techniques: AML.T0010.003(primary), AML.T0018(secondary)
  // severity=critical confidence=high status=stable
  // GENERATED by atlas-behavior-map from BHV-SC-001.yaml. Do not edit.
  AIModelRegistryEvents_CL
  | where EventType in ("model_load", "model_promote")
  | where SignatureStatus in ("unsigned", "invalid", "expired")
  | extend BehaviorId = "BHV-SC-001", AtlasTechnique = "AML.T0010.003",
           AtlasTactics = dynamic(["AML.TA0004"]), Severity = "critical"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0010.003,AML.T0018"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "block_deploy", "params", bag_pack("artifact", coalesce(tostring(ArtifactId), "{{artifact_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "service", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P1"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto"),
      bag_pack("action", "pull_model", "params", bag_pack("model", coalesce(tostring(ModelId), "{{model_id}}"), "rollback_to", "last_signed"), "requires_approval", true, "reversible", true, "blast_radius", "service", "status", "awaiting_approval")))
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
