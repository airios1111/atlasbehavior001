name: 'BHV-PI-015: Completion presents a link with a malicious reputation'
description: |
  A completion shown to the user contains a link whose URL-reputation verdict is malicious or phishing (completion_link_reputation, the worst verdict among links in the completion). Injected content often makes the model hand the user a malicious link to click.

  MITRE ATLAS tactics: AML.TA0005. Techniques: AML.T0011.003 (primary), AML.T0051.001 (secondary). Mitigations: AML.M0020, AML.M0018.
  ABM behavior BHV-PI-015: status test, severity high, confidence medium.
  False positives: Reputation-feed false positives on newly re-hosted legitimate domains.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-PI-015 | Completion presents a link with a malicious reputation
  // ATLAS tactics: AML.TA0005 | techniques: AML.T0011.003(primary), AML.T0051.001(secondary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-PI-015.yaml. Do not edit.
  AIGatewayLogs_CL
  | where CompletionLinkReputation in ("malicious", "phishing")
  | extend BehaviorId = "BHV-PI-015", AtlasTechnique = "AML.T0011.003",
           AtlasTactics = dynamic(["AML.TA0005"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0011.003,AML.T0051.001"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "redact_output", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "soc"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
