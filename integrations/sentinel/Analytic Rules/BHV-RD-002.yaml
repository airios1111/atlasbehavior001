id: 1f69e1f1-8d83-559b-b9da-23b34f9c3db9
name: 'BHV-RD-002: Untrusted retrieval source on a newly registered domain'
description: |
  Retrieved content comes from an untrusted domain registered less than 30 days ago (source_domain_age_days from WHOIS or threat-intel enrichment). Freshly bought domains are typical staging for crafted retrieval content. Experimental: domain age alone is a weak signal.

  MITRE ATLAS tactics: AML.TA0003. Techniques: AML.T0008.002 (primary), AML.T0066 (secondary). Mitigations: AML.M0030, AML.M0020.
  ABM behavior BHV-RD-002: status experimental, severity medium, confidence low.
  False positives: New legitimate vendor or campaign microsites.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-RD-002 | Untrusted retrieval source on a newly registered domain
  // ATLAS tactics: AML.TA0003 | techniques: AML.T0008.002(primary), AML.T0066(secondary)
  // severity=medium confidence=low status=experimental
  // GENERATED by atlas-behavior-map from BHV-RD-002.yaml. Do not edit.
  AIRetrievalLogs_CL
  | where SourceTrust == "untrusted"
  | where SourceDomainAgeDays < 30
  | extend BehaviorId = "BHV-RD-002", AtlasTechnique = "AML.T0008.002",
           AtlasTactics = dynamic(["AML.TA0003"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0008.002,AML.T0066"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "quarantine_source", "params", bag_pack("source", coalesce(tostring(SourceUri), "{{source_uri}}")), "requires_approval", true, "reversible", true, "blast_radius", "source", "status", "awaiting_approval"),
      bag_pack("action", "notify", "params", bag_pack("channel", "soc"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
