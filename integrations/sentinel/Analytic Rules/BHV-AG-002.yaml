id: 7b38bb72-2cd4-536b-84ec-ebd51e701ff0
name: 'BHV-AG-002: Agent runs download-and-execute or encoded shell command'
description: |
  Agent shell or code-interpreter call pipes a download straight into a shell, decodes base64 into sh, or runs encoded PowerShell.

  MITRE ATLAS tactics: AML.TA0005. Techniques: AML.T0050 (primary). Mitigations: AML.M0029, AML.M0032, AML.M0026.
  ABM behavior BHV-AG-002: status test, severity critical, confidence high.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-AG-002 | Agent runs download-and-execute or encoded shell command
  // ATLAS tactics: AML.TA0005 | techniques: AML.T0050(primary)
  // severity=critical confidence=high status=test
  // GENERATED by atlas-behavior-map from BHV-AG-002.yaml. Do not edit.
  AIAgentToolCalls_CL
  | where ToolName in ("shell.exec", "code_interpreter.run", "terminal.run")
  | where ToolArgs matches regex @"(?i)\b(curl|wget)\b[^|;]{0,200}\|\s*(ba|z)?sh\b"
      or ToolArgs matches regex @"(?i)\bbase64\s+(-d|--decode)\b[^|]{0,80}\|\s*(ba|z)?sh\b"
      or ToolArgs matches regex @"(?i)\bchmod\s+\+x\b.{0,80}&&\s*\./"
      or ToolArgs matches regex @"(?i)\bpowershell(\.exe)?\s+.{0,40}-(enc|encodedcommand)\b"
  | extend BehaviorId = "BHV-AG-002", AtlasTechnique = "AML.T0050",
           AtlasTactics = dynamic(["AML.TA0005"]), Severity = "critical"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0050"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "deny_tool_call", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "kill_session", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "session", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
