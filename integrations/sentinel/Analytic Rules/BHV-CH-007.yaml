id: 2b0c765b-22cf-53ef-889a-1a55653ccf0d
name: 'BHV-CH-007: Agent session spend exceeds budget'
description: |
  A single agent session spends more than $20 in an hour, a runaway or induced agentic resource drain.

  MITRE ATLAS tactics: AML.TA0011. Techniques: AML.T0034.002 (primary). Mitigations: AML.M0004, AML.M0029.
  ABM behavior BHV-CH-007: status test, severity medium, confidence high.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-CH-007 | Agent session spend exceeds budget
  // ATLAS tactics: AML.TA0011 | techniques: AML.T0034.002(primary)
  // severity=medium confidence=high status=test
  // GENERATED by atlas-behavior-map from BHV-CH-007.yaml. Do not edit.
  AIAgentToolCalls_CL
  | where TimeGenerated > ago(1h)
  | summarize Steps = count(),
              SpendUsd = sum(CostUsd)
            by SessionId, bin(TimeGenerated, 1h)
  | where SpendUsd > 20
  | extend BehaviorId = "BHV-CH-007", AtlasTechnique = "AML.T0034.002",
           AtlasTactics = dynamic(["AML.TA0011"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0034.002"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "kill_session", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "session", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "finops-soc"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
