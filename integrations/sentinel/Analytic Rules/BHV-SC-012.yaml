id: d1531098-3116-5df8-920c-3bb523e1cca9
name: 'BHV-SC-012: Loading a model artifact spawns a shell or downloader'
description: |
  Loading a model in an ML workspace spawns a shell, PowerShell or a download tool as a child process. Model loading should never start processes; the artifact is executing code on the host.

  MITRE ATLAS tactics: AML.TA0011. Techniques: AML.T0112.001 (primary). Mitigations: AML.M0011, AML.M0014.
  ABM behavior BHV-SC-012: status test, severity critical, confidence high.
  False positives: Custom loaders that shell out by design (fix the loader).
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-SC-012 | Loading a model artifact spawns a shell or downloader
  // ATLAS tactics: AML.TA0011 | techniques: AML.T0112.001(primary)
  // severity=critical confidence=high status=test
  // GENERATED by atlas-behavior-map from BHV-SC-012.yaml. Do not edit.
  AIMLWorkspaceEvents_CL
  | where EventType == "model_load"
  | where ChildProcess in ("sh", "bash", "dash", "zsh", "cmd.exe", "powershell.exe", "pwsh", "curl", "wget", "nc")
  | extend BehaviorId = "BHV-SC-012", AtlasTechnique = "AML.T0112.001",
           AtlasTactics = dynamic(["AML.TA0011"]), Severity = "critical"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0112.001"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "quarantine_artifact", "params", bag_pack("artifact", coalesce(tostring(ArtifactId), "{{artifact_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "service", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P1"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
