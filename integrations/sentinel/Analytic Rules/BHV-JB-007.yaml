name: 'BHV-JB-007: Optimized adversarial suffix appended to prompt'
description: |
  The gateway measures a long, high-perplexity token suffix on the prompt, characteristic of gradient-optimized (GCG-style) jailbreak suffixes.

  MITRE ATLAS tactics: AML.TA0012, AML.TA0007. Techniques: AML.T0054 (primary), AML.T0043.000 (secondary), AML.T0040 (precondition). Mitigations: AML.M0015, AML.M0020.
  ABM behavior BHV-JB-007: status test, severity high, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
