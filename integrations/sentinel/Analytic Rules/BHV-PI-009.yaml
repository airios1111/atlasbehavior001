id: d55768a4-09be-5ab8-b43a-16f251680727
name: 'BHV-PI-009: Markdown image in completion leaking data via URL parameters'
description: |
  Completion renders a markdown or HTML image whose URL carries a long query parameter. When the client renders it, data is sent to the attacker's server with no click needed.

  MITRE ATLAS tactics: AML.TA0010. Techniques: AML.T0077 (primary), AML.T0051.001 (secondary). Mitigations: AML.M0020, AML.M0033.
  ABM behavior BHV-PI-009: status test, severity high, confidence high.
  False positives: Signed CDN image URLs with long tokens (allowlist CDN domains).
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-PI-009 | Markdown image in completion leaking data via URL parameters
  // ATLAS tactics: AML.TA0010 | techniques: AML.T0077(primary), AML.T0051.001(secondary)
  // severity=high confidence=high status=test
  // GENERATED by atlas-behavior-map from BHV-PI-009.yaml. Do not edit.
  AIGatewayLogs_CL
  | where Completion matches regex @"!\[[^\]]*\]\(https?://[^)\s]+[?&][A-Za-z_]+=[^)\s]{16,}\)"
      or Completion matches regex @"(?i)<img[^>]+src\s*=\s*""https?://[^""]+[?&][a-z_]+=[^""]{16,}"""
  | extend BehaviorId = "BHV-PI-009", AtlasTechnique = "AML.T0077",
           AtlasTactics = dynamic(["AML.TA0010"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0077,AML.T0051.001"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "redact_output", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
