id: c89c6e7c-6b1d-520d-b4eb-4670aa2900e7
name: 'BHV-SC-003: Public-hub model from non-allowlisted publisher imported to prod'
description: |
  A model pulled from a public hub (Hugging Face, ModelScope, Civitai) by a publisher not on the allowlist is imported into a production registry.

  MITRE ATLAS tactics: AML.TA0004. Techniques: AML.T0010.003 (primary). Mitigations: AML.M0014, AML.M0023.
  ABM behavior BHV-SC-003: status test, severity high, confidence high.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-SC-003 | Public-hub model from non-allowlisted publisher imported to prod
  // ATLAS tactics: AML.TA0004 | techniques: AML.T0010.003(primary)
  // severity=high confidence=high status=test
  // GENERATED by atlas-behavior-map from BHV-SC-003.yaml. Do not edit.
  AIModelRegistryEvents_CL
  | where EventType == "model_import"
  | where SourceHub in ("huggingface", "modelscope", "civitai")
  | where PublisherAllowlisted == false
  | where Environment == "prod"
  | extend BehaviorId = "BHV-SC-003", AtlasTechnique = "AML.T0010.003",
           AtlasTactics = dynamic(["AML.TA0004"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0010.003"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "block_deploy", "params", bag_pack("artifact", coalesce(tostring(ArtifactId), "{{artifact_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "service", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "ml-platform"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
