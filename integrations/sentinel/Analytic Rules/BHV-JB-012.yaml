id: 483a9a3f-5032-50f7-bfc6-bccad8d4364d
name: 'BHV-JB-012: Completion contains a reverse shell or destructive command one-liner'
description: |
  The model's completion contains a ready-to-run reverse shell, an encoded PowerShell download cradle, a shadow-copy deletion or a fork bomb. The model is being used to generate attack commands.

  MITRE ATLAS tactics: AML.TA0001. Techniques: AML.T0102 (primary), AML.T0040 (precondition). Mitigations: AML.M0020, AML.M0022.
  ABM behavior BHV-JB-012: status test, severity high, confidence high.
  False positives: Security-training or red-team assistants (scope by model_id).
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-JB-012 | Completion contains a reverse shell or destructive command one-liner
  // ATLAS tactics: AML.TA0001 | techniques: AML.T0102(primary), AML.T0040(precondition)
  // severity=high confidence=high status=test
  // GENERATED by atlas-behavior-map from BHV-JB-012.yaml. Do not edit.
  AIGatewayLogs_CL
  | where Completion matches regex @"(?i)\bbash\s+-i\s*>&\s*/dev/tcp/\d{1,3}(\.\d{1,3}){3}/\d+"
      or Completion matches regex @"(?i)\bnc(at)?\b.{0,60}\s-[a-z]*e\s+(/bin/(ba)?sh|cmd(\.exe)?)\b"
      or Completion matches regex @"(?i)\bpowershell(\.exe)?\b.{0,40}\s-(e|enc|encodedcommand)\s+[A-Za-z0-9+/=]{40,}"
      or Completion matches regex @"(?i)\bIEX\s*\(\s*\(?New-Object\s+(System\.)?Net\.WebClient\)?\.DownloadString\("
      or Completion matches regex @"(?i)\bvssadmin(\.exe)?\s+delete\s+shadows\b"
      or Completion matches regex @":\(\)\s*\{\s*:\|:&\s*\};:"
  | extend BehaviorId = "BHV-JB-012", AtlasTechnique = "AML.T0102",
           AtlasTactics = dynamic(["AML.TA0001"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0102,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "redact_output", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "increment_risk", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "delta", 15), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
