name: 'BHV-SC-011: Recently created package installed on an LLM''s suggestion (slopsquatting)'
description: |
  A package suggested by an LLM or coding agent is installed even though it was published less than 30 days ago, which fits a hallucinated-package squat.

  MITRE ATLAS tactics: AML.TA0005. Techniques: AML.T0011.001 (primary), AML.T0060 (secondary). Mitigations: AML.M0016, AML.M0018.
  ABM behavior BHV-SC-011: status test, severity high, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-SC-011 | Recently created package installed on an LLM's suggestion (slopsquatting)
  // ATLAS tactics: AML.TA0005 | techniques: AML.T0011.001(primary), AML.T0060(secondary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-SC-011.yaml. Do not edit.
  AIMLWorkspaceEvents_CL
  | where EventType == "package_install"
  | where SuggestedByLlm == true
  | where PackageAgeDays < 30
  | extend BehaviorId = "BHV-SC-011", AtlasTechnique = "AML.T0011.001",
           AtlasTactics = dynamic(["AML.TA0005"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0011.001,AML.T0060"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", coalesce(tostring(WorkspaceId), "{{workspace_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
