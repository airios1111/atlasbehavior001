id: 6f10955d-a765-5dc6-890d-50d96f4cf99c
name: 'BHV-CA-002: Credentials returned in agent tool output'
description: |
  A tool result flowing back into an agent's context contains credential material or secret-looking environment variables. The agent, and anyone who can steer it, can now read and reuse the secret.

  MITRE ATLAS tactics: AML.TA0013. Techniques: AML.T0098 (primary), AML.T0055 (secondary). Mitigations: AML.M0028, AML.M0033.
  ABM behavior BHV-CA-002: status test, severity high, confidence medium.
  False positives: Tools that return masked or placeholder values longer than 8 characters.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-CA-002 | Credentials returned in agent tool output
  // ATLAS tactics: AML.TA0013 | techniques: AML.T0098(primary), AML.T0055(secondary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-CA-002.yaml. Do not edit.
  AIAgentToolCalls_CL
  | where ToolOutput matches regex @"\b(AKIA|ASIA)[0-9A-Z]{16}\b"
      or ToolOutput matches regex @"\bgh[pousr]_[A-Za-z0-9]{36}\b"
      or ToolOutput matches regex @"\bxox[abposr]-[A-Za-z0-9-]{10,}"
      or ToolOutput matches regex @"-----BEGIN ([A-Z]+ )?PRIVATE KEY-----"
      or ToolOutput matches regex @"\bsk-(proj-)?[A-Za-z0-9_-]{32,}\b"
      or ToolOutput matches regex @"\bAIza[0-9A-Za-z_-]{35}\b"
      or ToolOutput matches regex @"(?i)\b(AccountKey|SharedAccessKey|Password|Pwd)=[^;\s<>]{8,}"
      or ToolOutput matches regex @"(?i)\b[A-Z0-9_]*(SECRET|TOKEN|API_KEY|PASSWORD)[A-Z0-9_]*=[^\s]{8,}"
  | extend BehaviorId = "BHV-CA-002", AtlasTechnique = "AML.T0098",
           AtlasTactics = dynamic(["AML.TA0013"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0098,AML.T0055"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "redact_output", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "deny_tool_call", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "kill_session", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "session", "status", "auto"),
      bag_pack("action", "rotate_credentials", "params", bag_pack("scope", "agent-tool-output"), "requires_approval", true, "reversible", true, "blast_radius", "service", "status", "awaiting_approval"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
