id: 7329e83e-bba3-5656-b8b5-97393beb3d21
name: 'BHV-IA-001: Exploit payload against an AI-serving application'
description: |
  A request to a model-serving or ML-platform endpoint carries path traversal, a Gradio arbitrary-file read, an MLflow artifact-path traversal or a hit on Langflow's unauthenticated code-validation endpoint. These are the public exploits for exposed AI tooling.

  MITRE ATLAS tactics: AML.TA0004. Techniques: AML.T0049 (primary). Mitigations: AML.M0016, AML.M0019.
  ABM behavior BHV-IA-001: status test, severity high, confidence medium.
  False positives: Your own vulnerability scanners (allowlist their IPs).
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- InitialAccess
relevantTechniques:
- T1190
query: |
  // BHV-IA-001 | Exploit payload against an AI-serving application
  // ATLAS tactics: AML.TA0004 | techniques: AML.T0049(primary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-IA-001.yaml. Do not edit.
  AIInferenceLogs_CL
  | where RequestPath matches regex @"(?i)(\.\./|\.\.%2f|%2e%2e(/|%2f)|\.\.\\)"
      or RequestPath matches regex @"(?i)/file=/?(etc|proc|root|home|windows)/"
      or RequestPath matches regex @"(?i)/ajax-api/2\.0/mlflow/[^?]*\?.*\b(path|source|artifact_uri)=[^&]*(file:|\.\.)"
      or RequestPath matches regex @"(?i)^/api/v1/validate/code\b"
  | extend BehaviorId = "BHV-IA-001", AtlasTechnique = "AML.T0049",
           AtlasTactics = dynamic(["AML.TA0004"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0049"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "rate_limit", "params", bag_pack("principal", strcat("ip:", coalesce(tostring(ClientIp), "{{client_ip}}")), "limit", "0/min", "ttl", "24h"), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: ClientIp
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
