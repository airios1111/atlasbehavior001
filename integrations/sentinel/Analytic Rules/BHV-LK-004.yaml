name: 'BHV-LK-004: Special-token and delimiter probing'
description: |
  Prompt contains runs of model control tokens or template delimiters, used to discover how the system prompt is assembled and which tokens it reacts to.

  MITRE ATLAS tactics: AML.TA0008. Techniques: AML.T0069.000 (primary), AML.T0040 (precondition). Mitigations: AML.M0020, AML.M0015.
  ABM behavior BHV-LK-004: status test, severity medium, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
