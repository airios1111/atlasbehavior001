query: |
  // BHV-LK-004 | Special-token and delimiter probing
  // ATLAS tactics: AML.TA0008 | techniques: AML.T0069.000(primary), AML.T0040(precondition)
  // severity=medium confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-LK-004.yaml. Do not edit.
  AIGatewayLogs_CL
  | where Prompt matches regex @"(<\|[a-z_]{2,20}\|>\s*){2,}"
      or Prompt matches regex @"(\{\{|\}\}|<<|>>|\[\[|\]\]){6,}"
  | extend BehaviorId = "BHV-LK-004", AtlasTechnique = "AML.T0069.000",
           AtlasTactics = dynamic(["AML.TA0008"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0069.000,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "increment_risk", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "delta", 10), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto")))
