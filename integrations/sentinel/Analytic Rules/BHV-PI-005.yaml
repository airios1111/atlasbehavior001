name: 'BHV-PI-005: Invisible Unicode tag characters smuggled in prompt'
description: |
  The gateway normalizer counts Unicode tag-block / invisible formatting characters (U+E0000-E007F) in the prompt. These render as nothing to humans but are read by the model, hiding instructions.

  MITRE ATLAS tactics: AML.TA0007. Techniques: AML.T0068 (primary), AML.T0051.000 (secondary), AML.T0040 (precondition). Mitigations: AML.M0015, AML.M0020.
  ABM behavior BHV-PI-005: status test, severity high, confidence high.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
