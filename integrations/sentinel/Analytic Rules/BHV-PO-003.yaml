id: dd79c5d4-430a-5c6b-aecf-377536078769
name: 'BHV-PO-003: Single external contributor dominates training data intake'
description: |
  One external contributor adds more than 50,000 records to a dataset in a day, enough to steer the model. Internal contributors are excluded.

  MITRE ATLAS tactics: AML.TA0003, AML.TA0006. Techniques: AML.T0020 (primary). Mitigations: AML.M0007, AML.M0025.
  ABM behavior BHV-PO-003: status test, severity medium, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 1d
queryPeriod: 1d
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-PO-003 | Single external contributor dominates training data intake
  // ATLAS tactics: AML.TA0003, AML.TA0006 | techniques: AML.T0020(primary)
  // severity=medium confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-PO-003.yaml. Do not edit.
  AITrainingPipelineEvents_CL
  | where TimeGenerated > ago(1d)
  | where ContributorType == "external"
  | summarize Batches = count(),
              Records = sum(RecordCount)
            by DatasetId, ContributorId, bin(TimeGenerated, 1d)
  | where Records > 50000
  | extend BehaviorId = "BHV-PO-003", AtlasTechnique = "AML.T0020",
           AtlasTactics = dynamic(["AML.TA0003", "AML.TA0006"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0020"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "quarantine_artifact", "params", bag_pack("artifact", coalesce(tostring(DatasetId), "{{dataset_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "service", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "ml-data"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
