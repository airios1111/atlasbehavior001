name: 'BHV-PI-010: Self-replicating prompt instructing copies into future outputs'
description: |
  Input instructs the model to copy the instructions themselves into every future reply, email or message, so the injection spreads to other users and systems (worm behavior).

  MITRE ATLAS tactics: AML.TA0006. Techniques: AML.T0061 (primary), AML.T0051.000 (secondary), AML.T0040 (precondition). Mitigations: AML.M0020, AML.M0030.
  ABM behavior BHV-PI-010: status test, severity high, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-PI-010 | Self-replicating prompt instructing copies into future outputs
  // ATLAS tactics: AML.TA0006 | techniques: AML.T0061(primary), AML.T0051.000(secondary), AML.T0040(precondition)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-PI-010.yaml. Do not edit.
  AIGatewayLogs_CL
  | where Prompt matches regex @"(?i)\b(include|copy|repeat|append|add)\s+(this|these|the\s+following)\s+(exact\s+)?(instructions?|message|prompt|text)\s+(in|into|to|at\s+the\s+end\s+of)\s+(every|all|each|your)\s+(future\s+)?(responses?|repl(y|ies)|emails?|messages?|outputs?)"
  | extend BehaviorId = "BHV-PI-010", AtlasTechnique = "AML.T0061",
           AtlasTactics = dynamic(["AML.TA0006"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0061,AML.T0051.000,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "block_request", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "increment_risk", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "delta", 15), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
