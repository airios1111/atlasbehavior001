id: 0fd263a5-b459-56fc-a3b6-b2de9eaa5f43
name: 'BHV-LK-012: Classifier ontology discovery via label sweeping'
description: |
  One principal draws 40 or more distinct predicted labels from more than 300 requests in an hour, mapping the model's output space.

  MITRE ATLAS tactics: AML.TA0008. Techniques: AML.T0013 (primary), AML.T0040 (precondition). Mitigations: AML.M0002, AML.M0004.
  ABM behavior BHV-LK-012: status test, severity medium, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-LK-012 | Classifier ontology discovery via label sweeping
  // ATLAS tactics: AML.TA0008 | techniques: AML.T0013(primary), AML.T0040(precondition)
  // severity=medium confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-LK-012.yaml. Do not edit.
  AIInferenceLogs_CL
  | where TimeGenerated > ago(1h)
  | summarize Requests = count(),
              LabelsSeen = dcount(PredictedLabel)
            by PrincipalId, ModelId, bin(TimeGenerated, 1h)
  | where Requests > 300 and LabelsSeen >= 40
  | extend BehaviorId = "BHV-LK-012", AtlasTechnique = "AML.T0013",
           AtlasTactics = dynamic(["AML.TA0008"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0013,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "degrade_output", "params", bag_pack("model", coalesce(tostring(ModelId), "{{model_id}}"), "mode", "top1_label_only"), "requires_approval", false, "reversible", true, "blast_radius", "model", "status", "auto"),
      bag_pack("action", "rate_limit", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "limit", "30/min", "ttl", "6h"), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
