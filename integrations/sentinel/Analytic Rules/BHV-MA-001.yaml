id: ccaeeb63-306f-5957-b60f-a59ad252e5d2
name: 'BHV-MA-001: Human principal calls the production inference API directly'
description: |
  A human identity calls a production model endpoint without going through the application tier (via_app_gateway = false). Users should reach the model only through the product; direct access gives unrestricted, scriptable queries.

  MITRE ATLAS tactics: AML.TA0000. Techniques: AML.T0040 (primary). Mitigations: AML.M0019, AML.M0004.
  ABM behavior BHV-MA-001: status test, severity medium, confidence medium.
  False positives: Data scientists with approved break-glass access (add a not_in filter).
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-MA-001 | Human principal calls the production inference API directly
  // ATLAS tactics: AML.TA0000 | techniques: AML.T0040(primary)
  // severity=medium confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-MA-001.yaml. Do not edit.
  AIInferenceLogs_CL
  | where Environment == "prod"
  | where PrincipalType == "human"
  | where ViaAppGateway == false
  | extend BehaviorId = "BHV-MA-001", AtlasTechnique = "AML.T0040",
           AtlasTactics = dynamic(["AML.TA0000"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "step_up_auth", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "ml-platform"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
