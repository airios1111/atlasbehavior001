id: 0c7d9c92-b846-50fe-87e9-2624f012879e
name: 'BHV-RD-003: Newly published agent tool with a name resembling an approved tool'
description: |
  An MCP server or agent tool being registered was published less than 14 days ago and its name is at least 85% similar to an approved tool (name_similarity_to_approved from the gateway). Typosquatted tools are how poisoned agent tools get published. Experimental until the similarity threshold is calibrated.

  MITRE ATLAS tactics: AML.TA0003. Techniques: AML.T0104 (primary), AML.T0010.005 (secondary). Mitigations: AML.M0028, AML.M0023, AML.M0014.
  ABM behavior BHV-RD-003: status experimental, severity high, confidence low.
  False positives: New major versions or official forks of an approved tool.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-RD-003 | Newly published agent tool with a name resembling an approved tool
  // ATLAS tactics: AML.TA0003 | techniques: AML.T0104(primary), AML.T0010.005(secondary)
  // severity=high confidence=low status=experimental
  // GENERATED by atlas-behavior-map from BHV-RD-003.yaml. Do not edit.
  AIMCPGatewayEvents_CL
  | where EventType == "tool_registered"
  | where PackageAgeDays < 14
  | where NameSimilarityToApproved >= 0.85
  | extend BehaviorId = "BHV-RD-003", AtlasTechnique = "AML.T0104",
           AtlasTactics = dynamic(["AML.TA0003"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0104,AML.T0010.005"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "disable_tool", "params", bag_pack("tool", coalesce(tostring(ToolName), "{{tool_name}}"), "server", coalesce(tostring(ServerId), "{{server_id}}")), "requires_approval", true, "reversible", true, "blast_radius", "service", "status", "awaiting_approval"),
      bag_pack("action", "notify", "params", bag_pack("channel", "platform-sec"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
