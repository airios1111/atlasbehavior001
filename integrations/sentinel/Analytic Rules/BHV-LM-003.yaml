id: c1f0eb3b-281a-5873-926a-11cf5addb9f7
name: 'BHV-LM-003: Prompt requests phishing content impersonating an internal function'
description: |
  A prompt asks the LLM to write a message that pretends to come from IT, HR, payroll, finance or an executive and pushes a credential, MFA, gift-card or payment lure, or asks for a spearphishing message aimed at staff.

  MITRE ATLAS tactics: AML.TA0015, AML.TA0004. Techniques: AML.T0052.000 (primary), AML.T0040 (precondition). Mitigations: AML.M0020, AML.M0018.
  ABM behavior BHV-LM-003: status test, severity high, confidence medium.
  False positives: Security-awareness teams building phishing simulations (scope by app).
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- LateralMovement
relevantTechniques:
- T1534
query: |
  // BHV-LM-003 | Prompt requests phishing content impersonating an internal function
  // ATLAS tactics: AML.TA0015, AML.TA0004 | techniques: AML.T0052.000(primary), AML.T0040(precondition)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-LM-003.yaml. Do not edit.
  AIGatewayLogs_CL
  | where Prompt matches regex @"(?i)\b(pretend(ing)? to be|impersonat\w*|posing as|look(s)? like it('s| is) from)\b.{0,60}\b(it|help ?desk|hr|payroll|finance|the ceo|our ceo|security team|microsoft|okta)\b.{0,120}\b(password|credentials|mfa code|log ?in|sign[ -]?in|gift cards?|wire transfer|bank details)\b"
      or Prompt matches regex @"(?i)\b(spear-?)?phishing\s+(email|message|sms|text)\b.{0,80}\b(targeting|aimed at|to send to)\b.{0,40}\b(employees|staff|finance team|our cfo|the cfo|executives)\b"
  | extend BehaviorId = "BHV-LM-003", AtlasTechnique = "AML.T0052.000",
           AtlasTactics = dynamic(["AML.TA0015", "AML.TA0004"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0052.000,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "block_request", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "increment_risk", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "delta", 15), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "soc"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
