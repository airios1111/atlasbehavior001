id: 8e2ccaa5-7999-59b0-bb09-2616da83696a
name: 'BHV-COL-003: Agent pulls bulk records from many connected tools in one session'
description: |
  In 10 minutes an agent session calls at least 4 distinct data-read tools (mail, CRM, drive, calendar) and they return at least 5,000 records in total. One task rarely needs everything the agent can reach.

  MITRE ATLAS tactics: AML.TA0009. Techniques: AML.T0085.001 (primary). Mitigations: AML.M0028, AML.M0030.
  ABM behavior BHV-COL-003: status test, severity high, confidence medium.
  False positives: Scheduled reporting agents (scope by agent_id).
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 10m
queryPeriod: 10m
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-COL-003 | Agent pulls bulk records from many connected tools in one session
  // ATLAS tactics: AML.TA0009 | techniques: AML.T0085.001(primary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-COL-003.yaml. Do not edit.
  AIAgentToolCalls_CL
  | where TimeGenerated > ago(10m)
  | where ToolCategory == "data_read"
  | summarize DistinctTools = dcount(ToolName),
              Records = sum(RecordsReturned)
            by SessionId, AgentId, bin(TimeGenerated, 10m)
  | where DistinctTools >= 4 and Records >= 5000
  | extend BehaviorId = "BHV-COL-003", AtlasTechnique = "AML.T0085.001",
           AtlasTactics = dynamic(["AML.TA0009"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0085.001"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "kill_session", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "session", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
