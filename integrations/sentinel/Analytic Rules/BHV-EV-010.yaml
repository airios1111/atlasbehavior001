id: 645a8f4b-36e4-5085-b9f4-721e49a0ed7f
name: 'BHV-EV-010: Model deployed or loaded after the model scanner could not parse it'
description: |
  A model is deployed or loaded while its latest scan result is `error` or `unparseable` (latest_scan_status, from the registry). Attackers deliberately corrupt malicious model files so scanners fail, while the loader still runs the payload before it errors.

  MITRE ATLAS tactics: AML.TA0007. Techniques: AML.T0076 (primary). Mitigations: AML.M0014, AML.M0011.
  ABM behavior BHV-EV-010: status test, severity critical, confidence high.
  False positives: Scanner outages; fix the scanner rather than suppress the alert.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-EV-010 | Model deployed or loaded after the model scanner could not parse it
  // ATLAS tactics: AML.TA0007 | techniques: AML.T0076(primary)
  // severity=critical confidence=high status=test
  // GENERATED by atlas-behavior-map from BHV-EV-010.yaml. Do not edit.
  AIModelRegistryEvents_CL
  | where EventType in ("model_deploy", "model_load")
  | where LatestScanStatus in ("error", "unparseable")
  | extend BehaviorId = "BHV-EV-010", AtlasTechnique = "AML.T0076",
           AtlasTactics = dynamic(["AML.TA0007"]), Severity = "critical"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0076"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "block_deploy", "params", bag_pack("artifact", coalesce(tostring(ArtifactId), "{{artifact_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "service", "status", "auto"),
      bag_pack("action", "quarantine_artifact", "params", bag_pack("artifact", coalesce(tostring(ArtifactId), "{{artifact_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "service", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P1"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
