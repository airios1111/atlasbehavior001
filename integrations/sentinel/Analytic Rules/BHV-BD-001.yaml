id: 289f4791-f584-512a-8f86-03af53e38138
name: 'BHV-BD-001: Backdoor trigger response detected in model scan'
description: |
  A pre-deployment or periodic backdoor scan finds that candidate trigger patterns flip predictions to an attacker-chosen class at a high attack success rate (ASR), indicating a trigger-conditioned backdoor.

  MITRE ATLAS tactics: AML.TA0006, AML.TA0001. Techniques: AML.T0018.000 (primary), AML.T0043.004 (secondary). Mitigations: AML.M0014, AML.M0008.
  ABM behavior BHV-BD-001: status test, severity critical, confidence medium.
  False positives: Scanner false positives on models with naturally dominant classes (validate with clean-label holdout).
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-BD-001 | Backdoor trigger response detected in model scan
  // ATLAS tactics: AML.TA0006, AML.TA0001 | techniques: AML.T0018.000(primary), AML.T0043.004(secondary)
  // severity=critical confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-BD-001.yaml. Do not edit.
  AIModelRegistryEvents_CL
  | where EventType == "backdoor_scan"
  | where TriggerAsr >= 0.2
  | extend BehaviorId = "BHV-BD-001", AtlasTechnique = "AML.T0018.000",
           AtlasTactics = dynamic(["AML.TA0006", "AML.TA0001"]), Severity = "critical"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0018.000,AML.T0043.004"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "block_deploy", "params", bag_pack("artifact", coalesce(tostring(ArtifactId), "{{artifact_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "service", "status", "auto"),
      bag_pack("action", "pull_model", "params", bag_pack("model", coalesce(tostring(ModelId), "{{model_id}}"), "rollback_to", "last_clean_scan"), "requires_approval", true, "reversible", true, "blast_radius", "service", "status", "awaiting_approval"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P1"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
