id: df59597f-9c62-523b-9926-914b52c9f96c
name: 'BHV-C2-002: AI service API polled on a fixed schedule by an unregistered host'
description: |
  A host not registered as an AI workload polls an AI service API at least 10 times an hour at near-constant spacing with small payloads. Malware has been seen using hosted assistant threads as a command channel.

  MITRE ATLAS tactics: AML.TA0014. Techniques: AML.T0096 (primary). Mitigations: AML.M0019, AML.M0024.
  ABM behavior BHV-C2-002: status test, severity high, confidence medium.
  False positives: Unregistered automation (cron jobs) that should be registered.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- CommandAndControl
relevantTechniques:
- T1102.002
query: |
  // BHV-C2-002 | AI service API polled on a fixed schedule by an unregistered host
  // ATLAS tactics: AML.TA0014 | techniques: AML.T0096(primary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-C2-002.yaml. Do not edit.
  AIGatewayLogs_CL
  | where TimeGenerated > ago(1h)
  | where WorkloadRegistered == false
  | summarize Polls = count(),
              IntervalVariance = variance(InterArrivalS),
              AvgTokens = avg(TotalTokens)
            by ClientHost, ApiKeyId, bin(TimeGenerated, 1h)
  | where Polls >= 10 and IntervalVariance < 4 and AvgTokens < 300
  | extend BehaviorId = "BHV-C2-002", AtlasTechnique = "AML.T0096",
           AtlasTactics = dynamic(["AML.TA0014"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0096"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P1"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto"),
      bag_pack("action", "revoke_token", "params", bag_pack("principal", strcat("apikey:", coalesce(tostring(ApiKeyId), "{{api_key_id}}"))), "requires_approval", true, "reversible", true, "blast_radius", "principal", "status", "awaiting_approval")))
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: ClientHost
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
