id: 8ebf92ad-8acc-52ab-a7ad-1d79c558bfe8
name: 'BHV-CH-004: Sudden premium-model spend'
description: |
  One principal spends more than $100 in an hour on premium-tier models.

  MITRE ATLAS tactics: AML.TA0011. Techniques: AML.T0034.001 (primary). Mitigations: AML.M0004.
  ABM behavior BHV-CH-004: status test, severity medium, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-CH-004 | Sudden premium-model spend
  // ATLAS tactics: AML.TA0011 | techniques: AML.T0034.001(primary)
  // severity=medium confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-CH-004.yaml. Do not edit.
  AIGatewayLogs_CL
  | where TimeGenerated > ago(1h)
  | where ModelTier == "premium"
  | summarize SpendUsd = sum(CostUsd)
            by PrincipalId, bin(TimeGenerated, 1h)
  | where SpendUsd > 100
  | extend BehaviorId = "BHV-CH-004", AtlasTechnique = "AML.T0034.001",
           AtlasTactics = dynamic(["AML.TA0011"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0034.001"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "enforce_quota", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "finops-soc"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
