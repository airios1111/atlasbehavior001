id: 8bc3e72f-ed95-5569-8e99-293fa6702c73
name: 'BHV-PO-004: Instruction-bearing document upserted into RAG index from untrusted source'
description: |
  A document from an untrusted source is written to the vector store containing override phrasing or instructions aimed at the assistant (RAG poisoning).

  MITRE ATLAS tactics: AML.TA0006. Techniques: AML.T0070 (primary). Mitigations: AML.M0025, AML.M0030.
  ABM behavior BHV-PO-004: status test, severity high, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-PO-004 | Instruction-bearing document upserted into RAG index from untrusted source
  // ATLAS tactics: AML.TA0006 | techniques: AML.T0070(primary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-PO-004.yaml. Do not edit.
  AIVectorStoreEvents_CL
  | where Operation == "upsert"
  | where SourceTrust == "untrusted"
  | where Content matches regex @"(?i)\b(ignore|disregard)\s+(all\s+|any\s+)?(previous|prior|other)\s+(instructions|documents|sources)\b"
      or Content matches regex @"(?i)\b(assistant|ai|model)\s*(:|must|should)\s*.{0,40}\b(always|only)\s+(recommend|answer|say|cite)\b"
  | extend BehaviorId = "BHV-PO-004", AtlasTechnique = "AML.T0070",
           AtlasTactics = dynamic(["AML.TA0006"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0070"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "quarantine_vector_records", "params", bag_pack("doc", coalesce(tostring(DocId), "{{doc_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "source", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
