id: 9feef130-fbbd-50f3-ace8-4cffcbdf0296
name: 'BHV-LK-001: System prompt disclosure in model completion'
description: |
  Model output contains the system-prompt canary token or self-disclosing phrasing that reproduces its hidden instructions. Requires embedding a canary (ABM-CANARY-<8 hex>) in every system prompt at the gateway.

  MITRE ATLAS tactics: AML.TA0010. Techniques: AML.T0056 (primary), AML.T0051.000 (precondition). Mitigations: AML.M0020.
  ABM behavior BHV-LK-001: status stable, severity high, confidence high.
  False positives: Model explaining the concept of a system prompt without reproducing one (canary absent).
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-LK-001 | System prompt disclosure in model completion
  // ATLAS tactics: AML.TA0010 | techniques: AML.T0056(primary), AML.T0051.000(precondition)
  // severity=high confidence=high status=stable
  // GENERATED by atlas-behavior-map from BHV-LK-001.yaml. Do not edit.
  AIGatewayLogs_CL
  | where Completion matches regex @"\bABM-CANARY-[0-9a-f]{8}\b"
      or Completion matches regex @"(?i)\b(my|the)\s+(system\s+prompt|initial\s+instructions|hidden\s+instructions)\s+(is|are|says|reads)\s*:"
      or Completion matches regex @"(?i)\bhere\s+(is|are)\s+(my|the)\s+(full\s+|complete\s+)?(system\s+prompt|instructions\s+i\s+was\s+given)\b"
  | extend BehaviorId = "BHV-LK-001", AtlasTechnique = "AML.T0056",
           AtlasTactics = dynamic(["AML.TA0010"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0056,AML.T0051.000"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "redact_output", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "increment_risk", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "delta", 30), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
