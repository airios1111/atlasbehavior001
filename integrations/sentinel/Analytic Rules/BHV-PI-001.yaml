id: 4d7b7a80-d933-5c0c-b258-3474c951007e
name: 'BHV-PI-001: Instruction-override pattern in direct user input'
description: |
  User-supplied prompt contains phrasing that attempts to override, disregard or reveal the system/developer instructions. Signature floor; pair with a prompt-injection classifier score in production.

  MITRE ATLAS tactics: AML.TA0005. Techniques: AML.T0051.000 (primary), AML.T0040 (precondition). Mitigations: AML.M0020, AML.M0015.
  ABM behavior BHV-PI-001: status stable, severity high, confidence medium.
  False positives: Security training content and red-team exercises (scope by principal); Users quoting injection examples in support tickets.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-PI-001 | Instruction-override pattern in direct user input
  // ATLAS tactics: AML.TA0005 | techniques: AML.T0051.000(primary), AML.T0040(precondition)
  // severity=high confidence=medium status=stable
  // GENERATED by atlas-behavior-map from BHV-PI-001.yaml. Do not edit.
  AIGatewayLogs_CL
  | where Prompt matches regex @"(?i)\bignore\s+(all\s+|any\s+)?(previous|prior|above|earlier)\s+(instructions|directions|rules)\b"
      or Prompt matches regex @"(?i)\bdisregard\s+(your|the|all)\s+(system\s+prompt|instructions|guidelines)\b"
      or Prompt matches regex @"(?i)\byou\s+are\s+now\s+(in\s+)?(developer\s+mode|dan|unrestricted|jailbroken)\b"
      or Prompt matches regex @"(?i)\breveal\s+(your|the)\s+(system\s+prompt|hidden\s+instructions|initial\s+prompt)\b"
  | extend BehaviorId = "BHV-PI-001", AtlasTechnique = "AML.T0051.000",
           AtlasTactics = dynamic(["AML.TA0005"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0051.000,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "block_request", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "increment_risk", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "delta", 25), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P3"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
