id: 23de37a3-0e1d-56bd-8e17-29dec4ee5e56
name: 'BHV-MA-004: Restricted model weights loaded outside sanctioned environments'
description: |
  A model artifact classified as restricted is loaded in an environment that is not one of the sanctioned serving or evaluation environments. Whoever controls that environment now has white-box access to the model.

  MITRE ATLAS tactics: AML.TA0000. Techniques: AML.T0044 (primary). Mitigations: AML.M0005, AML.M0012.
  ABM behavior BHV-MA-004: status test, severity critical, confidence high.
  False positives: New sanctioned environments not yet added to the list.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-MA-004 | Restricted model weights loaded outside sanctioned environments
  // ATLAS tactics: AML.TA0000 | techniques: AML.T0044(primary)
  // severity=critical confidence=high status=test
  // GENERATED by atlas-behavior-map from BHV-MA-004.yaml. Do not edit.
  AIMLWorkspaceEvents_CL
  | where EventType == "model_load"
  | where ArtifactClassification == "restricted"
  | where Environment !in ("prod", "staging", "eval-cluster")
  | extend BehaviorId = "BHV-MA-004", AtlasTechnique = "AML.T0044",
           AtlasTactics = dynamic(["AML.TA0000"]), Severity = "critical"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0044"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P1"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto"),
      bag_pack("action", "revoke_token", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}")), "requires_approval", true, "reversible", true, "blast_radius", "principal", "status", "awaiting_approval")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
