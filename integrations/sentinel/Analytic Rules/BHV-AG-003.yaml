id: 9035c03e-093e-5d09-b734-5e6e7f3f25d4
name: 'BHV-AG-003: Reverse shell from agent sandbox'
description: |
  Agent tool arguments open an interactive shell to a remote host (/dev/tcp redirection, nc -e, mkfifo relay). The sandbox is being turned into a C2 foothold.

  MITRE ATLAS tactics: AML.TA0014. Techniques: AML.T0072 (primary). Mitigations: AML.M0032, AML.M0029.
  ABM behavior BHV-AG-003: status test, severity critical, confidence high.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-AG-003 | Reverse shell from agent sandbox
  // ATLAS tactics: AML.TA0014 | techniques: AML.T0072(primary)
  // severity=critical confidence=high status=test
  // GENERATED by atlas-behavior-map from BHV-AG-003.yaml. Do not edit.
  AIAgentToolCalls_CL
  | where ToolArgs matches regex @"(?i)\b(ba)?sh\s+-i\s*>&\s*/dev/tcp/"
      or ToolArgs matches regex @"/dev/tcp/[0-9.]{7,15}/\d{2,5}"
      or ToolArgs matches regex @"(?i)\bnc(at)?\s+(-e|-c)\s+/bin/(ba)?sh\b"
      or ToolArgs matches regex @"(?i)\bmkfifo\s+\S+\s*;.{0,80}\bnc\b"
  | extend BehaviorId = "BHV-AG-003", AtlasTechnique = "AML.T0072",
           AtlasTactics = dynamic(["AML.TA0014"]), Severity = "critical"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0072"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "deny_tool_call", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "kill_session", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "session", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P1"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
