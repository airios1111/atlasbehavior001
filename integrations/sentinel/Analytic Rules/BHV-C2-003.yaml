id: b736d4f9-67c1-5a28-b886-388c89261b99
name: 'BHV-C2-003: Agent fetches from a paste site, tunnel or callback host'
description: |
  An agent fetch or shell tool reaches a paste-site raw endpoint, a raw gist, a reverse-tunnel domain (ngrok, trycloudflare, loca.lt) or an out-of-band callback host (webhook.site, interact.sh, oast.*). These are common dead drops for agent tasking.

  MITRE ATLAS tactics: AML.TA0014. Techniques: AML.T0108 (primary). Mitigations: AML.M0028, AML.M0032.
  ABM behavior BHV-C2-003: status test, severity high, confidence medium.
  False positives: Developers fetching setup scripts from raw gists.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- CommandAndControl
relevantTechniques:
- T1102.001
- T1572
query: |
  // BHV-C2-003 | Agent fetches from a paste site, tunnel or callback host
  // ATLAS tactics: AML.TA0014 | techniques: AML.T0108(primary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-C2-003.yaml. Do not edit.
  AIAgentToolCalls_CL
  | where ToolName in ("web.fetch", "http.request", "http.get", "browser.open", "shell.exec", "code_interpreter.run", "terminal.run")
  | where ToolArgs matches regex @"(?i)\b(pastebin\.com/raw|paste\.ee/r/|hastebin\.com/raw|rentry\.co/[^/\s]+/raw)"
      or ToolArgs matches regex @"(?i)\bgist\.githubusercontent\.com/"
      or ToolArgs matches regex @"(?i)\b[a-z0-9-]+\.(ngrok(-free)?\.(io|app|dev)|trycloudflare\.com|loca\.lt|serveo\.net)\b"
      or ToolArgs matches regex @"(?i)\b(webhook\.site|requestbin\.(net|com)|pipedream\.net|interact\.sh|oast\.(fun|live|me|pro|site|online)|burpcollaborator\.net)\b"
  | extend BehaviorId = "BHV-C2-003", AtlasTechnique = "AML.T0108",
           AtlasTactics = dynamic(["AML.TA0014"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0108"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "deny_tool_call", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "kill_session", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "session", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
