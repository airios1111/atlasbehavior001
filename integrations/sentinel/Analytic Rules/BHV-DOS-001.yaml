id: 3d15f20c-8e42-5176-b513-d6d7a4613caa
name: 'BHV-DOS-001: Token-exhaustion / sponge input volume per principal'
description: |
  A principal drives abnormal input-token volume in a short window, consistent with sponge examples or context-flooding intended to degrade service.

  MITRE ATLAS tactics: AML.TA0011. Techniques: AML.T0029 (primary). Mitigations: AML.M0004.
  ABM behavior BHV-DOS-001: status test, severity medium, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 5m
queryPeriod: 5m
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-DOS-001 | Token-exhaustion / sponge input volume per principal
  // ATLAS tactics: AML.TA0011 | techniques: AML.T0029(primary)
  // severity=medium confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-DOS-001.yaml. Do not edit.
  AIGatewayLogs_CL
  | where TimeGenerated > ago(5m)
  | summarize TotalInputTokens = sum(InputTokens),
              AvgLatencyMs = avg(LatencyMs)
            by PrincipalId, bin(TimeGenerated, 5m)
  | where TotalInputTokens > 500000 and AvgLatencyMs > 8000
  | extend BehaviorId = "BHV-DOS-001", AtlasTechnique = "AML.T0029",
           AtlasTactics = dynamic(["AML.TA0011"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0029"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "cap_tokens", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "max_input_tokens", 8000), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "rate_limit", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "limit", "10/min", "ttl", "1h"), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
