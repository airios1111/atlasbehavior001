name: 'BHV-LK-013: Model family fingerprinting questions'
description: |
  Prompt asks which model, version or knowledge cutoff powers the assistant. Attackers use this reconnaissance to pick known-working jailbreaks.

  MITRE ATLAS tactics: AML.TA0008. Techniques: AML.T0014 (primary), AML.T0040 (precondition). Mitigations: AML.M0000, AML.M0020.
  ABM behavior BHV-LK-013: status test, severity low, confidence low.
  False positives: Curious users; useful mainly as a risk signal.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Low
status: Available
