query: |
  // BHV-LK-013 | Model family fingerprinting questions
  // ATLAS tactics: AML.TA0008 | techniques: AML.T0014(primary), AML.T0040(precondition)
  // severity=low confidence=low status=test
  // GENERATED by atlas-behavior-map from BHV-LK-013.yaml. Do not edit.
  AIGatewayLogs_CL
  | where Prompt matches regex @"(?i)\b(what|which)\s+(llm|language\s+model|model|version|base\s+model)\s+(are\s+you|is\s+this|powers\s+(you|this))\b"
      or Prompt matches regex @"(?i)\bwhat\s+is\s+your\s+(knowledge|training)\s+(cut-?off|data\s+cut-?off)\b"
  | extend BehaviorId = "BHV-LK-013", AtlasTechnique = "AML.T0014",
           AtlasTactics = dynamic(["AML.TA0008"]), Severity = "low"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0014,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "increment_risk", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "delta", 5), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto")))
