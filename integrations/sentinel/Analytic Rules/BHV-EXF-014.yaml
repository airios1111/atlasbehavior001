name: 'BHV-EXF-014: Secret read flows into an outbound HTTP call to a non-allowlisted host'
description: |
  Within one agent run, the output of a secret_read tool (vault, credential store, environment) reaches an egress call to a destination outside the allowlist within 4 hops of the span graph. Unlike BHV-EXF-011, which pairs any secret read with any egress in the same session window, this requires a causal path from the secret to the request.

  MITRE ATLAS tactics: AML.TA0010. Techniques: AML.T0086 (primary), AML.T0098 (secondary). Mitigations: AML.M0026, AML.M0028, AML.M0032.
  ABM behavior BHV-EXF-014: status test, severity critical, confidence high.
  False positives: A new integration whose API host has not been added to the egress allowlist.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
