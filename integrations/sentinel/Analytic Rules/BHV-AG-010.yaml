name: 'BHV-AG-010: Agent configuration changed by a non-admin'
description: |
  An agent's system prompt, tool list or permissions are changed by an actor without admin rights.

  MITRE ATLAS tactics: AML.TA0006, AML.TA0007. Techniques: AML.T0081 (primary). Mitigations: AML.M0026, AML.M0019.
  ABM behavior BHV-AG-010: status test, severity high, confidence high.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-AG-010 | Agent configuration changed by a non-admin
  // ATLAS tactics: AML.TA0006, AML.TA0007 | techniques: AML.T0081(primary)
  // severity=high confidence=high status=test
  // GENERATED by atlas-behavior-map from BHV-AG-010.yaml. Do not edit.
  AIAgentToolCalls_CL
  | where EventType == "agent_config_change"
  | where ChangeTarget in ("system_prompt", "tool_list", "permissions")
  | where ActorIsAdmin == false
  | extend BehaviorId = "BHV-AG-010", AtlasTechnique = "AML.T0081",
           AtlasTactics = dynamic(["AML.TA0006", "AML.TA0007"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0081"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "agent-platform"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
