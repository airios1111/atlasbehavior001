id: 60d10b92-3ad6-5af6-a2c6-4a6fe97fe95c
name: 'BHV-LK-005: Credentials or tokens in model completion'
description: |
  Model output contains credential material: JWTs, connection-string passwords, GitHub tokens, OpenAI-style secret keys or Google API keys.

  MITRE ATLAS tactics: AML.TA0010. Techniques: AML.T0057 (primary), AML.T0055 (secondary). Mitigations: AML.M0020, AML.M0012.
  ABM behavior BHV-LK-005: status test, severity critical, confidence medium.
  False positives: Documentation examples with placeholder keys.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-LK-005 | Credentials or tokens in model completion
  // ATLAS tactics: AML.TA0010 | techniques: AML.T0057(primary), AML.T0055(secondary)
  // severity=critical confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-LK-005.yaml. Do not edit.
  AIGatewayLogs_CL
  | where Completion matches regex @"\beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}"
      or Completion matches regex @"(?i)\b(AccountKey|SharedAccessKey|Password|Pwd)=[^;\s<>]{8,}"
      or Completion matches regex @"\bgh[pousr]_[A-Za-z0-9]{36}\b"
      or Completion matches regex @"\bsk-[A-Za-z0-9_-]{32,}\b"
      or Completion matches regex @"\bAIza[0-9A-Za-z_-]{35}\b"
  | extend BehaviorId = "BHV-LK-005", AtlasTechnique = "AML.T0057",
           AtlasTactics = dynamic(["AML.TA0010"]), Severity = "critical"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0057,AML.T0055"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "redact_output", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "rotate_credentials", "params", bag_pack("scope", "exposed-in-completion"), "requires_approval", true, "reversible", true, "blast_radius", "service", "status", "awaiting_approval"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P1"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
