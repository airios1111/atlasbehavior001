id: 46610dda-b2e8-5443-85c5-f62a341bebbd
name: 'BHV-DSC-001: Probing for special or forbidden keywords in the system instructions'
description: |
  A prompt asks which words, topics or phrases the model is told to avoid or refuse, or which magic, override or debug keywords its developers placed in the system instructions. The answer tells the attacker what the guardrails key on, so they can route around them.

  MITRE ATLAS tactics: AML.TA0008. Techniques: AML.T0069.001 (primary), AML.T0040 (precondition). Mitigations: AML.M0020, AML.M0022.
  ABM behavior BHV-DSC-001: status test, severity medium, confidence medium.
  False positives: Users asking about content policy in good faith (low severity, risk-scored only).
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-DSC-001 | Probing for special or forbidden keywords in the system instructions
  // ATLAS tactics: AML.TA0008 | techniques: AML.T0069.001(primary), AML.T0040(precondition)
  // severity=medium confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-DSC-001.yaml. Do not edit.
  AIGatewayLogs_CL
  | where Prompt matches regex @"(?i)\b(what|which|list|tell me)\b.{0,30}\b(words?|keywords?|phrases?|topics?|terms?)\b.{0,40}\b((you('re|\s+are)|are\s+you)\s+(not\s+allowed|forbidden|told\s+not|instructed\s+not)|(are|is)\s+(banned|forbidden|off-limits|blocklisted|blacklisted)\s+(for|to)\s+you|trigger\s+(a\s+)?refusals?|make\s+you\s+refuse)"
      or Prompt matches regex @"(?i)\b(what|which)\b.{0,20}\b(magic|secret|special|trigger|override|admin|debug)\s+(words?|keywords?|phrases?|commands?|passwords?)\b.{0,40}\b(your|the)\s+(system\s+(prompt|message|instructions)|instructions|developers?|guidelines)\b"
  | extend BehaviorId = "BHV-DSC-001", AtlasTechnique = "AML.T0069.001",
           AtlasTactics = dynamic(["AML.TA0008"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0069.001,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "increment_risk", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "delta", 15), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto")))
