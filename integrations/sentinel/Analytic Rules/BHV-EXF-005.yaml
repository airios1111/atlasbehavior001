id: faaebaec-9e49-5df2-be58-c1a10e55c3e5
name: 'BHV-EXF-005: Agent emails attachments to an external recipient on its own initiative'
description: |
  An agent sends email with attachments to an external recipient when no user explicitly asked for it. This is a common end goal of injected instructions.

  MITRE ATLAS tactics: AML.TA0010. Techniques: AML.T0086 (primary). Mitigations: AML.M0029, AML.M0030.
  ABM behavior BHV-EXF-005: status test, severity high, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-EXF-005 | Agent emails attachments to an external recipient on its own initiative
  // ATLAS tactics: AML.TA0010 | techniques: AML.T0086(primary)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-EXF-005.yaml. Do not edit.
  AIAgentToolCalls_CL
  | where ToolName in ("email.send", "mail.send")
  | where RecipientExternal == true
  | where AttachmentCount > 0
  | where InitiatedByUser == false
  | extend BehaviorId = "BHV-EXF-005", AtlasTechnique = "AML.T0086",
           AtlasTactics = dynamic(["AML.TA0010"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0086"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "deny_tool_call", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "ai-sec", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
