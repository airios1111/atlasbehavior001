query: |
  // BHV-EV-007 | Deepfake media submitted to identity verification
  // ATLAS tactics: AML.TA0004, AML.TA0007, AML.TA0011 | techniques: AML.T0015(primary), AML.T0088(secondary)
  // severity=critical confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-EV-007.yaml. Do not edit.
