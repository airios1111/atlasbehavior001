  | where CheckType in ("liveness", "kyc_selfie")
  | where DeepfakeScore >= 0.85
  | extend BehaviorId = "BHV-EV-007", AtlasTechnique = "AML.T0015",
           AtlasTactics = dynamic(["AML.TA0004", "AML.TA0007", "AML.TA0011"]), Severity = "critical"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0015,AML.T0088"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "block_request", "params", bag_pack("request", coalesce(tostring(PrincipalId), "{{principal_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "step_up_auth", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto"),
      bag_pack("action", "open_incident", "params", bag_pack("queue", "fraud", "priority", "P2"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
