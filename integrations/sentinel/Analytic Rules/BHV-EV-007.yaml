  MITRE ATLAS tactics: AML.TA0004, AML.TA0007, AML.TA0011. Techniques: AML.T0015 (primary), AML.T0088 (secondary). Mitigations: AML.M0034, AML.M0009.
  ABM behavior BHV-EV-007: status test, severity critical, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
