id: b270b896-1b77-549e-b3ac-3d76d2e91438
name: 'BHV-JB-008: Jailbreak probing: repeated refusals in one session'
description: |
  A session receives three or more refusals within five or more requests in 15 minutes, suggesting the user is iterating on a jailbreak.

  MITRE ATLAS tactics: AML.TA0012, AML.TA0007. Techniques: AML.T0054 (primary), AML.T0042 (secondary), AML.T0040 (precondition). Mitigations: AML.M0020, AML.M0004.
  ABM behavior BHV-JB-008: status test, severity medium, confidence medium.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 15m
queryPeriod: 15m
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-JB-008 | Jailbreak probing: repeated refusals in one session
  // ATLAS tactics: AML.TA0012, AML.TA0007 | techniques: AML.T0054(primary), AML.T0042(secondary), AML.T0040(precondition)
  // severity=medium confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-JB-008.yaml. Do not edit.
  AIGatewayLogs_CL
  | where TimeGenerated > ago(15m)
  | summarize Requests = count(),
              Refusals = sum(Refused)
            by SessionId, bin(TimeGenerated, 15m)
  | where Requests >= 5 and Refusals >= 3
  | extend BehaviorId = "BHV-JB-008", AtlasTechnique = "AML.T0054",
           AtlasTactics = dynamic(["AML.TA0012", "AML.TA0007"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0054,AML.T0042,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "kill_session", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "session", "status", "auto"),
      bag_pack("action", "notify", "params", bag_pack("channel", "ai-sec"), "requires_approval", false, "reversible", true, "blast_radius", "org", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: SessionId
customDetails:
  BehaviorId: BehaviorId
  AtlasTechnique: AtlasTechnique
  AtlasTechniques: AtlasTechniques
  AtlasTactics: AtlasTactics
  ResponsePlan: ResponsePlan
eventGroupingSettings:
  aggregationKind: AlertPerResult
