name: 'BHV-RC-004: Prompt asks the assistant to enumerate its indexed sources'
description: |
  A user asks a RAG assistant to list every document, file, site or data source it can reach. The answer maps the index and tells the attacker where to aim poisoning or extraction.

  MITRE ATLAS tactics: AML.TA0002. Techniques: AML.T0064 (primary), AML.T0040 (precondition). Mitigations: AML.M0020, AML.M0019.
  ABM behavior BHV-RC-004: status test, severity medium, confidence medium.
  False positives: Users trying to understand what the assistant can answer.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-RC-004 | Prompt asks the assistant to enumerate its indexed sources
  // ATLAS tactics: AML.TA0002 | techniques: AML.T0064(primary), AML.T0040(precondition)
  // severity=medium confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-RC-004.yaml. Do not edit.
  AIGatewayLogs_CL
  | where Prompt matches regex @"(?i)\b(list|enumerate|show|print|dump|name)\b.{0,30}\b(all|every|each)\b.{0,20}\b(documents?|files?|sources?|data sources|collections?|indexes|indices|knowledge bases?|sharepoint sites|confluence spaces)\b.{0,40}\b(you|your)\b.{0,30}\b(have|can|access|index(ed)?|retrieve|search|know|knowledge)\b"
      or Prompt matches regex @"(?i)\bwhat\s+(documents|files|sources|data sources|knowledge bases?|repositories)\s+(do|can)\s+you\s+(have|access|search|see|read|retrieve)\b"
  | extend BehaviorId = "BHV-RC-004", AtlasTechnique = "AML.T0064",
           AtlasTactics = dynamic(["AML.TA0002"]), Severity = "medium"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0064,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "increment_risk", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "delta", 15), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto")))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: PrincipalId
