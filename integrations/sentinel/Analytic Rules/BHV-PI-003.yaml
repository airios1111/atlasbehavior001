name: 'BHV-PI-003: Encoded instruction payload with decode-and-follow request'
description: |
  Prompt asks the model to decode an encoded blob (base64, hex, rot13) and then follow or execute it, a common way to slip instructions past input filters.

  MITRE ATLAS tactics: AML.TA0007, AML.TA0005. Techniques: AML.T0068 (primary), AML.T0051.000 (secondary), AML.T0040 (precondition). Mitigations: AML.M0020, AML.M0015.
  ABM behavior BHV-PI-003: status test, severity high, confidence medium.
  False positives: Developers asking for decode-then-run snippets in coding assistants.
  Generated by atlas-behavior-map. Do not edit; change the behavior YAML and rebuild.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  // BHV-PI-003 | Encoded instruction payload with decode-and-follow request
  // ATLAS tactics: AML.TA0007, AML.TA0005 | techniques: AML.T0068(primary), AML.T0051.000(secondary), AML.T0040(precondition)
  // severity=high confidence=medium status=test
  // GENERATED by atlas-behavior-map from BHV-PI-003.yaml. Do not edit.
  AIGatewayLogs_CL
  | where Prompt matches regex @"(?i)\b(decode|decipher|deobfuscate)\b.{0,60}\b(then|and)\s+(follow|execute|obey|run|do)\b"
      or Prompt matches regex @"(?i)\bthe\s+following\s+(base64|hex|rot-?13)\b.{0,40}\b(instructions?|commands?)\b"
  | extend BehaviorId = "BHV-PI-003", AtlasTechnique = "AML.T0068",
           AtlasTactics = dynamic(["AML.TA0007", "AML.TA0005"]), Severity = "high"
  | extend AtlasTactics = strcat_array(AtlasTactics, ","), AtlasTechniques = "AML.T0068,AML.T0051.000,AML.T0040"
  | extend ResponsePlan = tostring(pack_array(
      bag_pack("action", "block_request", "params", bag_pack("session", coalesce(tostring(SessionId), "{{session_id}}")), "requires_approval", false, "reversible", true, "blast_radius", "request", "status", "auto"),
      bag_pack("action", "increment_risk", "params", bag_pack("principal", coalesce(tostring(PrincipalId), "{{principal_id}}"), "delta", 15), "requires_approval", false, "reversible", true, "blast_radius", "principal", "status", "auto")))
